  function matchDisplayOrder(a,b){
    const aLive = a?.status === "live";
    const bLive = b?.status === "live";

    // LIVE and halftime always float to the top.
    // Among live matches, preserve normal kickoff order.
    if(aLive !== bLive) return aLive ? -1 : 1;

    // Everything else follows the original chronological order.
    return new Date(a.date) - new Date(b.date);
  }

  function resetMatchDetailsAfterRefresh(){
    const liveIds = new Set();

    for(const evs of Object.values(rounds)){
      for(const ev of evs || []){
        if(stateOf(ev) === "live"){
          liveIds.add(String(ev.id));
        }
      }
    }

    // Finished / pre-match details close on refresh.
    // LIVE and halftime keep both the open state and the selected sub-tab.
    for(const id of [...expandedMatchDetails]){
      if(!liveIds.has(String(id))){
        expandedMatchDetails.delete(id);
      }
    }

    for(const id of [...matchDetailTabs.keys()]){
      if(!liveIds.has(String(id))){
        matchDetailTabs.delete(id);
      }
    }

    // LIVE is normally auto-expanded by matchHtml().
    // Keeping it here as explicit state also prevents a visual collapse
    // if ESPN status changes during the refresh/render cycle.
    for(const id of liveIds){
      expandedMatchDetails.add(id);
    }
  }

  function roundNumbers(){
    return Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  }

  function canMoveRound(delta){
    const nums = roundNumbers();
    if(!nums.length) return false;

    const index = nums.indexOf(Number(selectedRound));
    if(index < 0) return false;

    const nextIndex = index + delta;
    return nextIndex >= 0 && nextIndex < nums.length;
  }

  function animateRoundEnter(delta){
    if(
      !content?.animate ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches
    ){
      return;
    }

    const fromX = delta > 0 ? 22 : -22;

    content.animate(
      [
        {transform:`translateX(${fromX}px)`,opacity:.84},
        {transform:"translateX(0)",opacity:1}
      ],
      {
        duration:210,
        easing:"cubic-bezier(.22,.82,.28,1)"
      }
    );
  }

  async function moveRound(delta){
    const nums = roundNumbers();
    if(!nums.length) return;

    const index = nums.indexOf(Number(selectedRound));
    if(index < 0) return;

    const nextIndex = index + delta;
    if(nextIndex < 0 || nextIndex >= nums.length) return;

    selectedRound = nums[nextIndex];
    await renderMatches();
    animateRoundEnter(delta);
  }

  function setupRoundSwipe(){
    if(document.documentElement.dataset.roundSwipeReady === "1") return;
    document.documentElement.dataset.roundSwipeReady = "1";

    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let startTime = 0;
    let startedInsideContent = false;
    let blocked = false;

    const clearFeedback = ()=>{
      content.classList.remove(
        "round-swipe-feedback-left",
        "round-swipe-feedback-right"
      );
    };

    const feedback = direction=>{
      clearFeedback();
      void content.offsetWidth;

      content.classList.add(
        direction > 0
          ? "round-swipe-feedback-left"
          : "round-swipe-feedback-right"
      );

      setTimeout(clearFeedback,180);
    };

    document.addEventListener("pointerdown",e=>{
      if(
        activeTab !== "matches" ||
        e.pointerType !== "touch" ||
        pointerId !== null
      ){
        return;
      }

      const target = e.target;
      startedInsideContent = !!(
        content &&
        target instanceof Node &&
        content.contains(target)
      );

      if(!startedInsideContent) return;

      blocked = !!target?.closest(
        "button,a,input,select,textarea,[data-detail-tab],[data-details-toggle],[data-match-open]"
      );

      if(blocked) return;

      // Leave the extreme edges free for system gestures.
      if(e.clientX < 16 || e.clientX > window.innerWidth - 16){
        startedInsideContent = false;
        return;
      }

      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      startTime = performance.now();
    },{capture:true,passive:true});

    document.addEventListener("pointerup",async e=>{
      if(
        pointerId === null ||
        e.pointerId !== pointerId
      ){
        return;
      }

      const validStart =
        startedInsideContent &&
        !blocked &&
        activeTab === "matches";

      pointerId = null;
      startedInsideContent = false;
      blocked = false;

      if(!validStart) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const elapsed = performance.now() - startTime;

      const absX = Math.abs(dx);
      const absY = Math.abs(dy);

      const isHorizontal =
        absX >= 42 &&
        absX > absY * 1.18 &&
        elapsed <= 1400;

      if(!isHorizontal) return;

      // left = next round, right = previous round
      const direction = dx < 0 ? 1 : -1;
      if(!canMoveRound(direction)) return;

      await moveRound(direction);
    },{capture:true,passive:true});

    document.addEventListener("pointercancel",e=>{
      if(e.pointerId !== pointerId) return;

      pointerId = null;
      startedInsideContent = false;
      blocked = false;
    },{capture:true,passive:true});
  }

  async function renderMatches(){
    clearError();

    const renderToken = ++matchesRenderToken;
    const requestedRound = Number(selectedRound);
    const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);

    if(!nums.length){
      content.innerHTML = `<div class="message">Calendario non disponibile.</div>`;
      return;
    }

    selectedRound = Math.min(
      Math.max(selectedRound,nums[0]),
      nums[nums.length-1]
    );

    const alreadyShowingRound =
      content.dataset.matchesRound === String(selectedRound) &&
      content.querySelector(".match");

    if(!alreadyShowingRound){
      loading(`Carico la giornata ${selectedRound}…`);
    }

    const models = await Promise.all(
      (rounds[selectedRound] || []).map(matchModel)
    );

    if(
      renderToken !== matchesRenderToken ||
      activeTab !== "matches" ||
      requestedRound !== Number(selectedRound)
    ){
      return;
    }

    // Promote ONLY the individual matches that are actually live.
    // Date grouping happens afterwards for non-live fixtures, so a live
    // Sunday match cannot drag later Sunday fixtures to the top.
    const liveModels = models
      .filter(m=>m.status === "live")
      .sort((a,b)=>new Date(a.date)-new Date(b.date));

    const normalModels = models
      .filter(m=>m.status !== "live")
      .sort((a,b)=>new Date(a.date)-new Date(b.date));

    const grouped = new Map();
    for(const m of normalModels){
      const key = new Date(m.date).toLocaleDateString("it-IT");
      if(!grouped.has(key)) grouped.set(key,{label:dateLabel(m.date),matches:[]});
      grouped.get(key).matches.push(m);
    }

    const prevDisabled = selectedRound <= nums[0] ? "disabled" : "";
    const nextDisabled = selectedRound >= nums[nums.length-1] ? "disabled" : "";
    const today = selectedRound !== currentRound
      ? `<div class="today-wrap"><button class="today-btn" id="todayBtn">TORNA ALLA GIORNATA CORRENTE</button></div>`
      : "";

    let html = `<div class="round-nav">
      <button class="round-btn" id="prevRound" ${prevDisabled} aria-label="Giornata precedente">‹</button>
      <div class="round-center">GIORNATA ${selectedRound}</div>
      <button class="round-btn" id="nextRound" ${nextDisabled} aria-label="Giornata successiva">›</button>
    </div>${today}`;

    // LIVE cards are temporarily shown first, individually.
    if(liveModels.length){
      html += liveModels.map(matchHtml).join("");
    }

    // Every non-live match keeps the normal chronological/date grouping.
    for(const group of grouped.values()){
      html += `<div class="date-label">${esc(group.label)}</div>`;
      html += group.matches.map(matchHtml).join("");
    }
    if(!models.length) html += `<div class="message">Nessuna partita disponibile per questa giornata.</div>`;

    // Temporary visual laboratory for V3 timeline refinement.
    // Completely static: no ESPN data and no extra network requests.
    html += demoTimelineMatchHtml();

    content.innerHTML = html;
    content.dataset.matchesRound = String(selectedRound);

    document.getElementById("prevRound")?.addEventListener("click",()=>{
      moveRound(-1);
    });
    document.getElementById("nextRound")?.addEventListener("click",()=>{
      moveRound(1);
    });
    document.getElementById("todayBtn")?.addEventListener("click",async()=>{
      const direction = currentRound >= selectedRound ? 1 : -1;
      selectedRound = currentRound;
      await renderMatches();
      animateRoundEnter(direction);
    });

    setupTeamLinks();

    content.querySelectorAll("[data-match-open]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const id = String(btn.dataset.matchOpen || "");
        if(!id) return;
        openMatchPage(id);
      });
    });

    setUpdated();
  }

  function stat(entry, names){
    const stats = entry?.stats || [];
    for(const name of names){
      const x = stats.find(s =>
        String(s.name||"").toLowerCase() === String(name).toLowerCase() ||
        String(s.abbreviation||"").toLowerCase() === String(name).toLowerCase()
      );
      if(x) return x.value ?? x.displayValue ?? 0;
    }
    return 0;
  }

  function zoneClass(position){
    const pos = Number(position);
    if(pos >= 1 && pos <= 4) return "zone-champions";
    if(pos === 5) return "zone-europa";
    if(pos === 6) return "zone-conference";
    if(pos >= 18) return "zone-relegation";
    return "";
  }

  function numericStandingStat(entry,names){
    const value = Number(stat(entry,names));
    return Number.isFinite(value) ? value : 0;
  }

  function standingsEntriesFromPayload(payload){
    let entries = [];

    const walk = node => {
      if(!node || typeof node !== "object") return;

      if(
        Array.isArray(node?.standings?.entries) &&
        node.standings.entries.length
      ){
        entries.push(...node.standings.entries);
      }

      if(Array.isArray(node.children)){
        node.children.forEach(walk);
      }
    };

    walk(payload);

    const seen = new Set();

    return entries.filter(entry=>{
      const id = String(entry?.team?.id || "");
      if(!id || seen.has(id)) return false;
      seen.add(id);
      return true;
    });
  }

  function liveSerieAEvents(){
    const seen = new Set();
    const live = [];

    for(const ev of allEvents){
      const id = String(ev?.id || "");
      if(!id || seen.has(id)) continue;
      if(stateOf(ev) !== "live") continue;

      seen.add(id);
      live.push(ev);
    }

    return live.sort(
      (a,b)=>new Date(a.date)-new Date(b.date)
    );
  }

  function competitorScoreNumber(comp){
    const candidates = [
      comp?.score,
      comp?.score?.value,
      comp?.score?.displayValue
    ];

    for(const candidate of candidates){
      const n = Number.parseInt(candidate,10);
      if(Number.isFinite(n)) return n;
    }

    return 0;
  }

  function normalizedStandingRows(entries){
    return entries.map((entry,index)=>{
      const team = entry?.team || {};
      const gf = numericStandingStat(
        entry,
        ["pointsFor","goalsFor","goalsScored","GF"]
      );
      const ga = numericStandingStat(
        entry,
        ["pointsAgainst","goalsAgainst","goalsConceded","GA"]
      );

      let gd = numericStandingStat(
        entry,
        ["pointDifferential","goalDifference","GD"]
      );

      // If ESPN exposes GF/GA but not GD, calculate it.
      if(!gd && (gf || ga)){
        gd = gf - ga;
      }

      return {
        entry,
        team,
        id:String(team?.id || ""),
        baseRank:
          numericStandingStat(entry,["rank"]) ||
          index + 1,
        gp:numericStandingStat(entry,["gamesPlayed","GP"]),
        w:numericStandingStat(entry,["wins","W"]),
        d:numericStandingStat(entry,["ties","draws","D"]),
        l:numericStandingStat(entry,["losses","L"]),
        gf,
        ga,
        gd,
        pts:numericStandingStat(entry,["points","P"]),
        isLive:false
      };
    });
  }

  function applyLiveResultsToStandings(rows,liveEvents){
    const byTeam = new Map(
      rows.map(row=>[row.id,row])
    );

    for(const ev of liveEvents){
      const competitors =
        ev?.competitions?.[0]?.competitors || [];

      const home =
        competitors.find(c=>c?.homeAway === "home") ||
        competitors[0];

      const away =
        competitors.find(c=>c?.homeAway === "away") ||
        competitors[1];

      if(!home || !away) continue;

      const homeId = String(home?.id || home?.team?.id || "");
      const awayId = String(away?.id || away?.team?.id || "");

      const homeRow = byTeam.get(homeId);
      const awayRow = byTeam.get(awayId);

      if(!homeRow || !awayRow) continue;

      const homeGoals = competitorScoreNumber(home);
      const awayGoals = competitorScoreNumber(away);

      homeRow.gp += 1;
      awayRow.gp += 1;

      homeRow.gf += homeGoals;
      homeRow.ga += awayGoals;
      awayRow.gf += awayGoals;
      awayRow.ga += homeGoals;

      homeRow.gd = homeRow.gf - homeRow.ga;
      awayRow.gd = awayRow.gf - awayRow.ga;

      homeRow.isLive = true;
      awayRow.isLive = true;

      if(homeGoals > awayGoals){
        homeRow.w += 1;
        awayRow.l += 1;
        homeRow.pts += 3;
      }else if(awayGoals > homeGoals){
        awayRow.w += 1;
        homeRow.l += 1;
        awayRow.pts += 3;
      }else{
        homeRow.d += 1;
        awayRow.d += 1;
        homeRow.pts += 1;
        awayRow.pts += 1;
      }
    }

    // Live projection. Official Serie A tie-break rules can depend on
    // head-to-head data; base rank is retained as a final stable fallback.
    rows.sort((a,b)=>
      b.pts - a.pts ||
      b.gd - a.gd ||
      b.gf - a.gf ||
      a.baseRank - b.baseRank
    );

    rows.forEach((row,index)=>{
      row.liveRank = index + 1;
    });

    return rows;
  }

  function roundIsNearKickoff(roundNumber){
    const now = Date.now();

    return (rounds[roundNumber] || []).some(ev=>{
      if(stateOf(ev) === "done") return false;

      const kickoff = new Date(ev?.date).getTime();
      if(!Number.isFinite(kickoff)) return false;

      const deltaMinutes = (kickoff - now) / 60000;
      return deltaMinutes <= 10 && deltaMinutes >= -210;
    });
  }

  async function renderStandings(options={}){
    const {skipRoundRefresh=false} = options;

    clearError();

    if(!skipRoundRefresh){
      loading("Carico la classifica…");
    }

    const legend = `<div class="stand-legend">
      <span class="legend-item"><span class="legend-dot champions"></span>Champions</span>
      <span class="legend-item"><span class="legend-dot europa"></span>Europa League</span>
      <span class="legend-item"><span class="legend-dot conference"></span>Conference</span>
      <span class="legend-item"><span class="legend-dot relegation"></span>Retrocessione</span>
    </div>`;

    try{
      // When the user opens CLASSIFICA, first refresh the current round.
      // This gives the projection the freshest live score available.
      if(!skipRoundRefresh && rounds[currentRound]?.length){
        await refreshRoundFromEspn(currentRound).catch(()=>{});
      }

      if(!standingsCache){
        standingsCache = await getJson(
          `${STANDINGS}?season=${seasonYear}&_=${Date.now()}`
        );
        standingsBaseFetchedAt = Date.now();
      }

      const entries = standingsEntriesFromPayload(standingsCache);
      if(!entries.length) throw new Error("Classifica vuota");

      const liveEvents = liveSerieAEvents();
      const isLiveProjection = liveEvents.length > 0;

      let rows = normalizedStandingRows(entries);

      if(isLiveProjection){
        rows = applyLiveResultsToStandings(rows,liveEvents);
      }else{
        rows.sort((a,b)=>
          a.baseRank - b.baseRank ||
          b.pts - a.pts
        );

        rows.forEach((row,index)=>{
          row.liveRank = row.baseRank || index + 1;
        });
      }

      const title = isLiveProjection
        ? `<div class="stand-title-wrap">
            <h2 class="section-title">Classifica</h2>
            <span class="stand-live-badge">
              <span class="stand-live-dot"></span>LIVE
            </span>
          </div>
          <div class="stand-live-note">Proiezione sui risultati delle partite in corso</div>`
        : `<h2 class="section-title">Classifica</h2>`;

      let html = `${title}
      <div class="table-card">
        <div class="stand-head">
          <div>#</div><div>Squadra</div><div>PG</div><div>V</div><div>N</div><div>P</div><div>DR</div><div>PT</div>
        </div>`;

      rows.forEach((row,index)=>{
        const team = row.team || {};
        const logo = team.logos?.[0]?.href || team.logo || "";
        const pos = isLiveProjection
          ? index + 1
          : (row.baseRank || index + 1);

        const gdText =
          Number(row.gd) > 0
            ? `+${row.gd}`
            : String(row.gd);

        const zone = zoneClass(pos);
        const liveClass = row.isLive ? "live-team" : "";

        html += `<div class="stand-row ${zone} ${liveClass}">
          <div class="pos">${esc(pos)}</div>
          <button
            class="club team-open"
            type="button"
            data-team-open
            data-team-id="${esc(row.id)}"
            data-team-name="${esc(team.shortDisplayName||team.displayName||team.name||"—")}"
            data-team-logo="${esc(logo)}"
            aria-label="Apri scheda ${esc(team.shortDisplayName||team.displayName||team.name||"—")}"
          >
            ${logo?`<img src="${esc(logo)}" alt="" loading="lazy">`:""}
            <span>${esc(team.shortDisplayName||team.displayName||team.name||"—")}</span>
          </button>
          <div class="num">${esc(row.gp)}</div>
          <div class="num">${esc(row.w)}</div>
          <div class="num">${esc(row.d)}</div>
          <div class="num">${esc(row.l)}</div>
          <div class="num">${esc(gdText)}</div>
          <div class="num pts">${esc(row.pts)}</div>
        </div>`;
      });

      html += `${legend}</div>`;

      if(activeTab !== "standings") return;

      content.innerHTML = html;
      setupTeamLinks();
      setUpdated();
    }catch(e){
      if(activeTab !== "standings") return;

      content.innerHTML = `<div class="message">Non riesco a caricare la classifica in questo momento.</div>`;
      showError("Errore nel collegamento ai dati della classifica.");
    }
  }

  function teamCompetitorId(comp){
    return String(comp?.id || comp?.team?.id || "");
  }

  function teamCompetitorForEvent(ev,teamId,teamNameText=""){
    const competitors = ev?.competitions?.[0]?.competitors || [];
    const wantedId = String(teamId || "");

    if(wantedId){
      const byId = competitors.find(
        c=>teamCompetitorId(c) === wantedId
      );
      if(byId) return byId;
    }

    const wantedName = normalizedTeamText(teamNameText);
    if(wantedName){
      return competitors.find(c=>{
        const names = [
          c?.team?.shortDisplayName,
          c?.team?.displayName,
          c?.team?.name,
          c?.team?.abbreviation
        ]
          .filter(Boolean)
          .map(normalizedTeamText);

        return names.includes(wantedName);
      }) || null;
    }

    return null;
  }

  function teamEventInfo(ev,teamId,teamNameText=""){
    const competitors = ev?.competitions?.[0]?.competitors || [];
    const mine = teamCompetitorForEvent(ev,teamId,teamNameText);
    if(!mine) return null;

    const opponent = competitors.find(c=>c !== mine) || null;
    if(!opponent) return null;

    const mineScore = competitorScoreNumber(mine);
    const opponentScore = competitorScoreNumber(opponent);
    const state = stateOf(ev);

    let result = "";
    if(state === "done"){
      result =
        mineScore > opponentScore
          ? "V"
          : mineScore < opponentScore
            ? "P"
            : "N";
    }

    return {
      ev,
      mine,
      opponent,
      state,
      result,
      mineScore,
      opponentScore,
      opponentName:teamName(opponent),
      opponentLogo:teamLogo(opponent),
      venue:mine?.homeAway === "home" ? "Casa" : "Trasferta"
    };
  }

  function teamEventsFor(teamId,teamNameText=""){
    return allEvents
      .map(ev=>teamEventInfo(ev,teamId,teamNameText))
      .filter(Boolean)
      .sort((a,b)=>new Date(a.ev.date)-new Date(b.ev.date));
  }

  function teamFormHtml(teamEvents){
    const lastFive = teamEvents
      .filter(x=>x.state === "done")
      .slice(-5);

    if(!lastFive.length){
      return `<div class="team-form-empty">Nessun risultato disponibile.</div>`;
    }

    return `<div class="team-form" aria-label="Forma ultime cinque partite">
      ${lastFive.map(x=>{
        const cls =
          x.result === "V"
            ? "win"
            : x.result === "P"
              ? "loss"
              : "draw";

        const label =
          x.result === "V"
            ? "Vittoria"
            : x.result === "P"
              ? "Sconfitta"
              : "Pareggio";

        return `<span
          class="team-form-pill ${cls}"
          title="${label}"
          aria-label="${label}"
        >${x.result}</span>`;
      }).join("")}
    </div>`;
  }

  function teamFixtureDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("it-IT",{
      weekday:"short",
      day:"numeric",
      month:"short"
    });
  }

  function teamFixtureHtml(label,item,isNext=false){
    if(!item){
      return `<div class="team-fixture">
        <div class="team-fixture-label">${esc(label)}</div>
        <div class="team-fixture-sub" style="margin-top:12px">Non disponibile</div>
      </div>`;
    }

    const opponentLogo = item.opponentLogo
      ? `<img src="${esc(item.opponentLogo)}" alt="" loading="lazy">`
      : "";

    const main = isNext
      ? esc(timeLabel(item.ev.date))
      : `${esc(item.mineScore)}–${esc(item.opponentScore)}`;

    const sub = isNext
      ? `${esc(teamFixtureDate(item.ev.date))} · ${esc(item.venue)}`
      : `${esc(teamFixtureDate(item.ev.date))} · ${esc(item.venue)}`;

    return `<div class="team-fixture">
      <div class="team-fixture-label">${esc(label)}</div>
      <div class="team-fixture-opponent">
        ${opponentLogo}
        <span>${esc(item.opponentName)}</span>
      </div>
      <div class="team-fixture-main">${main}</div>
      <div class="team-fixture-sub">${sub}</div>
    </div>`;
  }

  function teamTopScorer(teamId,teamNameText=""){
    const totals = new Map();
    const wantedId = String(teamId || "");
    const wantedName = normalizedTeamText(teamNameText);

    for(const ev of allEvents){
      if(stateOf(ev) === "pre") continue;

      const details = ev?.competitions?.[0]?.details || [];

      for(const d of details){
        if(!d?.scoringPlay || d?.shootout || d?.ownGoal) continue;

        const raw = d.athletesInvolved || d.participants || [];
        const athletes = raw.map(x=>x?.athlete || x).filter(Boolean);
        const scorer = athletes[0];
        if(!scorer) continue;

        const scoreTeamId = String(
          d?.team?.id ||
          scorer?.team?.id ||
          ""
        );

        const scoreTeamName = normalizedTeamText(
          eventTeamName(ev,scoreTeamId)
        );

        const sameTeam =
          (wantedId && scoreTeamId === wantedId) ||
          (!wantedId && wantedName && scoreTeamName === wantedName);

        if(!sameTeam) continue;

        const id =
          scorer.id ||
          scorer.uid ||
          scorer.displayName ||
          scorer.fullName ||
          scorer.shortName;

        const name =
          scorer.displayName ||
          scorer.fullName ||
          scorer.shortName ||
          "—";

        const key = String(id || name);
        const row = totals.get(key) || {name,value:0};
        row.value += 1;
        totals.set(key,row);
      }
    }

    return [...totals.values()]
      .sort((a,b)=>
        b.value-a.value ||
        a.name.localeCompare(b.name,"it")
      )[0] || null;
  }

  async function teamStandingContext(teamId,teamNameText=""){
    if(!standingsCache){
      standingsCache = await getJson(
        `${STANDINGS}?season=${seasonYear}&_=${Date.now()}`
      );
      standingsBaseFetchedAt = Date.now();
    }

    const entries = standingsEntriesFromPayload(standingsCache);
    if(!entries.length) return {row:null,position:null,isLive:false};

    const liveEvents = liveSerieAEvents();
    const isLive = liveEvents.length > 0;

    let rows = normalizedStandingRows(entries);

    if(isLive){
      rows = applyLiveResultsToStandings(rows,liveEvents);
    }else{
      rows.sort((a,b)=>
        a.baseRank-b.baseRank ||
        b.pts-a.pts
      );
    }

    const wantedId = String(teamId || "");
    const wantedName = normalizedTeamText(teamNameText);

    const index = rows.findIndex(row=>{
      if(wantedId && String(row.id) === wantedId) return true;

      const names = [
        row?.team?.shortDisplayName,
        row?.team?.displayName,
        row?.team?.name,
        row?.team?.abbreviation
      ]
        .filter(Boolean)
        .map(normalizedTeamText);

      return !!wantedName && names.includes(wantedName);
    });

    if(index < 0) return {row:null,position:null,isLive};

    const row = rows[index];

    return {
      row,
      position:isLive ? index+1 : (row.baseRank || index+1),
      isLive
    };
  }

  function closeTeamSheet(){
    teamSheetRequestToken++;
    teamSheetBackdrop.hidden = true;

    const y = teamSheetScrollY || 0;

    document.body.classList.remove("team-sheet-open");
    document.body.style.top = "";
    document.body.style.position = "";
    document.body.style.width = "";
    document.body.style.left = "";
    document.body.style.right = "";

    window.scrollTo(0,y);
  }

  function teamSheetHeaderHtml(name,logo,meta="Serie A"){
    return `<div class="team-sheet-top">
      ${logo
        ? `<img class="team-sheet-logo" src="${esc(logo)}" alt="" loading="lazy">`
        : `<span class="team-sheet-logo" aria-hidden="true"></span>`
      }

      <div>
        <div class="team-sheet-name" id="teamSheetTitle">${esc(name || "Squadra")}</div>
        <div class="team-sheet-meta">${esc(meta)}</div>
      </div>

      <button class="team-sheet-close" id="teamSheetClose" type="button" aria-label="Chiudi scheda squadra">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </div>`;
  }

  function bindTeamSheetClose(){
    document.getElementById("teamSheetClose")?.addEventListener(
      "click",
      closeTeamSheet
    );
  }

  async function openTeamSheet({id="",name="",logo=""}={}){
    const token = ++teamSheetRequestToken;

    teamSheetContent.innerHTML = `
      ${teamSheetHeaderHtml(name,logo)}
      <div class="team-sheet-loading">
        <div><div class="spinner"></div>Carico la squadra…</div>
      </div>
    `;

    teamSheetScrollY = window.scrollY || window.pageYOffset || 0;

    document.body.classList.add("team-sheet-open");
    document.body.style.top = `-${teamSheetScrollY}px`;
    document.body.style.position = "fixed";
    document.body.style.width = "100%";
    document.body.style.left = "0";
    document.body.style.right = "0";

    teamSheetBackdrop.hidden = false;
    bindTeamSheetClose();

    try{
      // Full-season data is loaded only when the user explicitly opens
      // a team sheet. Startup stays lightweight.
      await ensureSeasonCalendar();

      const [standing] = await Promise.all([
        teamStandingContext(id,name)
      ]);

      if(token !== teamSheetRequestToken) return;

      const row = standing.row;
      const team = row?.team || {};
      const resolvedName =
        team?.displayName ||
        team?.shortDisplayName ||
        team?.name ||
        name ||
        "Squadra";

      const resolvedLogo =
        team?.logos?.[0]?.href ||
        team?.logo ||
        logo ||
        leaderTeamLogo(resolvedName);

      const teamEvents = teamEventsFor(
        row?.id || id,
        resolvedName
      );

      const completed = teamEvents.filter(x=>x.state === "done");
      const upcoming = teamEvents.filter(x=>x.state === "pre");

      const lastMatch = completed.at(-1) || null;

      const futureMatches = upcoming.filter(
        x=>new Date(x.ev.date).getTime() >= Date.now() - 2*60*60*1000
      );

      const nextMatch = futureMatches[0] || upcoming[0] || null;
      const followingMatch =
        futureMatches[1] ||
        (upcoming[0] === nextMatch ? upcoming[1] : upcoming[0]) ||
        null;

      const scorer = teamTopScorer(
        row?.id || id,
        resolvedName
      );

      const gd = row
        ? (Number(row.gd) > 0 ? `+${row.gd}` : String(row.gd))
        : "—";

      const position = standing.position
        ? `${standing.position}°`
        : "—";

      const liveMeta = standing.isLive
        ? "Serie A · Classifica LIVE"
        : "Serie A";

      teamSheetContent.innerHTML = `
        ${teamSheetHeaderHtml(resolvedName,resolvedLogo,liveMeta)}

        <div class="team-sheet-stats">
          <div class="team-sheet-stat">
            <div class="team-sheet-stat-label">Pos.</div>
            <div class="team-sheet-stat-value">${esc(position)}</div>
          </div>
          <div class="team-sheet-stat">
            <div class="team-sheet-stat-label">PT</div>
            <div class="team-sheet-stat-value">${esc(row?.pts ?? "—")}</div>
          </div>
          <div class="team-sheet-stat">
            <div class="team-sheet-stat-label">PG</div>
            <div class="team-sheet-stat-value">${esc(row?.gp ?? "—")}</div>
          </div>
          <div class="team-sheet-stat">
            <div class="team-sheet-stat-label">DR</div>
            <div class="team-sheet-stat-value">${esc(gd)}</div>
          </div>
        </div>

        <div class="team-record">
          <span>V <strong>${esc(row?.w ?? "—")}</strong></span>
          <span>N <strong>${esc(row?.d ?? "—")}</strong></span>
          <span>P <strong>${esc(row?.l ?? "—")}</strong></span>
        </div>

        <div class="team-sheet-section">
          <div class="team-sheet-section-title">Forma ultime 5</div>
          ${teamFormHtml(teamEvents)}
        </div>

        <div class="team-sheet-section">
          <div class="team-fixtures">
            ${teamFixtureHtml("Ultima partita",lastMatch,false)}
            ${teamFixtureHtml("Prossima",nextMatch,true)}
            ${teamFixtureHtml("Successiva",followingMatch,true)}
          </div>
        </div>

        <div class="team-sheet-section">
          <div class="team-sheet-section-title">Miglior marcatore</div>
          ${scorer
            ? `<div class="team-top-scorer">
                <div class="team-top-scorer-name">${esc(scorer.name)}</div>
                <div class="team-top-scorer-value">${esc(scorer.value)}</div>
              </div>`
            : `<div class="team-form-empty">Dato non disponibile.</div>`
          }
        </div>
      `;

      bindTeamSheetClose();
    }catch(_){
      if(token !== teamSheetRequestToken) return;

      teamSheetContent.innerHTML = `
        ${teamSheetHeaderHtml(name,logo)}
        <div class="message">Scheda squadra non disponibile in questo momento.</div>
      `;

      bindTeamSheetClose();
    }
  }

  function setupTeamLinks(){
    content.querySelectorAll("[data-team-open]").forEach(btn=>{
      btn.addEventListener("click",event=>{
        event.stopPropagation();

        openTeamSheet({
          id:String(btn.dataset.teamId || ""),
          name:String(btn.dataset.teamName || ""),
          logo:String(btn.dataset.teamLogo || "")
        });
      });
    });
  }

  function setupTeamSheet(){
    teamSheetBackdrop?.addEventListener("click",event=>{
      if(event.target === teamSheetBackdrop){
        closeTeamSheet();
      }
    });

    teamSheet?.addEventListener("click",event=>{
      event.stopPropagation();
    });

    document.addEventListener("keydown",event=>{
      if(event.key === "Escape" && !teamSheetBackdrop.hidden){
        closeTeamSheet();
      }
    });
  }

  function eventTeamName(ev, teamId){
    const competitors = ev?.competitions?.[0]?.competitors || [];
    const c = competitors.find(x => String(x?.id) === String(teamId));
    return c ? teamName(c) : "—";
  }

  function leaderTeamLogo(team){
    const wanted = normalizedTeamText(team);
    if(!wanted || wanted === "—") return "";

    for(const ev of allEvents){
      const competitors = ev?.competitions?.[0]?.competitors || [];

      for(const competitor of competitors){
        const names = [
          competitor?.team?.shortDisplayName,
          competitor?.team?.displayName,
          competitor?.team?.name,
          competitor?.team?.abbreviation
        ]
          .filter(Boolean)
          .map(normalizedTeamText);

        if(names.includes(wanted)){
          return teamLogo(competitor);
        }
      }
    }

    return "";
  }

  function seasonScorerRows(){
    const totals = new Map();

    for(const ev of allEvents){
      if(stateOf(ev) === "pre") continue;

      const details = ev?.competitions?.[0]?.details || [];
      for(const d of details){
        if(!d?.scoringPlay || d?.shootout || d?.ownGoal) continue;

        const raw = d.athletesInvolved || d.participants || [];
        const athletes = raw.map(x => x?.athlete || x).filter(Boolean);
        const scorer = athletes[0];
        if(!scorer) continue;

        const playerId = scorer.id || scorer.uid || scorer.displayName || scorer.fullName;
        const name = scorer.displayName || scorer.fullName || scorer.shortName || "—";
        const teamId = d?.team?.id || scorer?.team?.id || "";
        const team = eventTeamName(ev, teamId);
        const key = String(playerId);

        const row = totals.get(key) || {name, team, value:0};
        row.name = name;
        if(team && team !== "—") row.team = team;
        row.value += 1;
        totals.set(key,row);
      }
    }

    return [...totals.values()]
      .sort((a,b)=>b.value-a.value || a.name.localeCompare(b.name,"it"))
      .slice(0,50)
      .map((r,i)=>({rank:i+1,...r}));
  }

  function assistStorageKey(){
    return `serie-a-live-assists-v2-${seasonYear}`;
  }

  function loadAssistCache(){
    try{
      const raw = localStorage.getItem(assistStorageKey());
      const obj = raw ? JSON.parse(raw) : {};
      return obj && typeof obj === "object" ? obj : {};
    }catch{
      return {};
    }
  }

  function saveAssistCache(cache){
    try{
      localStorage.setItem(assistStorageKey(), JSON.stringify(cache));
    }catch(_){}
  }

  function assistsFromSummary(summary, ev){
    const goals = extractMatchEvents(summary, null)
      .filter(e=>e.kind==="goal")
      .map(e=>({
        scorer:e.player,
        assist:e.assist,
        minute:e.minute,
        penalty:e.penalty,
        ownGoal:e.ownGoal
      }));
    const result = [];

    for(const g of goals){
      if(!g.assist || g.ownGoal || g.penalty) continue;

      // Find the goal event again to resolve the credited team.
      const details = summary?.header?.competitions?.[0]?.details || [];
      const detail = details.find(d => {
        if(!d?.scoringPlay || d?.shootout) return false;
        const raw = d.participants || d.athletesInvolved || [];
        const athletes = raw.map(x => x?.athlete || x).filter(Boolean);
        const scorerName =
          athletes?.[0]?.displayName ||
          athletes?.[0]?.fullName ||
          athletes?.[0]?.shortName ||
          "";

        return normalizedTeamText(scorerName) === normalizedTeamText(g.scorer) &&
          minuteOf(d) === g.minute;
      });

      const raw = detail?.participants || detail?.athletesInvolved || [];
      const athletes = raw.map(x => x?.athlete || x).filter(Boolean);
      const assister = athletes?.[1];
      if(!assister) continue;

      const playerId = assister.id || assister.uid || assister.displayName || assister.fullName;
      const name = assister.displayName || assister.fullName || assister.shortName || g.assist;
      const teamId = detail?.team?.id || assister?.team?.id || "";
      const team = eventTeamName(ev, teamId);

      result.push({id:String(playerId), name, team});
    }

    return result;
  }

  async function assistRows(){
    const cache = loadAssistCache();
    const started = allEvents
      .filter(ev => stateOf(ev) !== "pre")
      .sort((a,b)=>new Date(a.date)-new Date(b.date));

    const toFetch = started.filter(ev => {
      if(stateOf(ev) === "live") return true;
      return !Array.isArray(cache[ev.id]);
    });

    let done = 0;
    const worker = async () => {
      while(toFetch.length){
        const ev = toFetch.shift();
        try{
          const summary = await summaryFor(ev);
          cache[ev.id] = assistsFromSummary(summary, ev);
          if(stateOf(ev) === "done") saveAssistCache(cache);
        }catch{
          if(!Array.isArray(cache[ev.id])) cache[ev.id] = [];
        }
        done++;
        if(activeTab === "assists" && toFetch.length){
          content.innerHTML = `<div class="message"><div class="spinner"></div>Carico gli assist… ${done}/${done + toFetch.length}</div>`;
        }
      }
    };

    const concurrency = Math.min(6, Math.max(1, toFetch.length));
    await Promise.all(Array.from({length:concurrency}, worker));
    saveAssistCache(cache);

    const totals = new Map();
    for(const ev of started){
      const list = cache[ev.id] || [];
      for(const a of list){
        const key = a.id || `${a.name}|${a.team}`;
        const row = totals.get(key) || {name:a.name, team:a.team, value:0};
        row.value += 1;
        totals.set(key,row);
      }
    }

    return [...totals.values()]
      .sort((a,b)=>b.value-a.value || a.name.localeCompare(b.name,"it"))
      .slice(0,50)
      .map((r,i)=>({rank:i+1,...r}));
  }

  async function makeLeaderRows(type){
    // Marcatori e Assist dipendono dall'intera stagione.
    // Il calendario completo viene scaricato solo quando davvero serve
    // (oppure nel frattempo è già stato idratato in background).
    await ensureSeasonCalendar();

    if(type === "scorers"){
      // Marcatori: conteggio diretto di ogni evento "Goal" di tutte le partite
      // Serie A già scaricate dal calendario ESPN. Autogol esclusi; rigori inclusi.
      return seasonScorerRows();
    }

    // Assist: vengono conteggiati solo quando ESPN indica esplicitamente
    // un secondo atleta coinvolto nell'evento gol.
    return assistRows();
  }

  async function renderLeaders(type){
    clearError();
    const isGoals = type === "scorers";
    loading(isGoals ? "Carico i marcatori…" : "Carico gli assist…");
    try{
      let rows = leadersCache[type];

      if(!rows){
        rows = await makeLeaderRows(type);
        leadersCache[type] = rows;
      }

      if(activeTab !== type) return;

      if(!rows.length){
        content.innerHTML = `<div class="message">${isGoals ? "Nessun marcatore" : "Nessun assist"} disponibile al momento.</div>`;
        return;
      }
      let html = `<h2 class="section-title">${isGoals ? "Marcatori" : "Assist"}</h2><div class="table-card">`;
      rows.forEach(r=>{
        const logo = leaderTeamLogo(r.team);

        html += `<div class="leader-row">
          <div class="rank">${r.rank}</div>
          <div class="player">
            ${logo
              ? `<img class="player-logo" src="${esc(logo)}" alt="" loading="lazy">`
              : `<span class="player-logo" aria-hidden="true"></span>`
            }
            <div class="player-name">${esc(r.name)}</div>
          </div>
          <div class="leader-value">${esc(r.value)}</div>
        </div>`;
      });
      html += `</div>`;
      content.innerHTML = html;
      setUpdated();
    }catch(e){
      content.innerHTML = `<div class="message">${isGoals ? "La classifica marcatori" : "La classifica assist"} non è disponibile in questo momento.</div>`;
      showError("Non riesco a leggere tutte le statistiche dai tabellini ESPN in questo momento.");
    }
  }

  async function renderActive(){
    if(activeTab === "matches") return renderMatches();
    if(activeTab === "standings") return renderStandings();
    if(activeTab === "scorers") return renderLeaders("scorers");
    if(activeTab === "assists") return renderLeaders("assists");
  }

document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const nextTab = btn.dataset.tab;
      if(nextTab === activeTab) return;

      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      btn.classList.add("active");
      activeTab = nextTab;
      renderActive();
      window.scrollTo({top:0,behavior:"smooth"});
    });
  });

  async function refreshRoundFromEspn(roundNumber){
    const evs = rounds[roundNumber] || [];
    if(!evs.length) return;

    const times = evs
      .map(e=>new Date(e.date))
      .filter(d=>!Number.isNaN(d.getTime()));

    if(!times.length) return;

    const min = new Date(Math.min(...times.map(d=>d.getTime())));
    const max = new Date(Math.max(...times.map(d=>d.getTime())));

    const board = await getJson(
      `${SITE}/scoreboard?dates=${fmtDateKey(min)}-${fmtDateKey(max)}&_=${Date.now()}`
    );

    const fresh = new Map((board.events || []).map(e=>[String(e.id),e]));
    const updatedRound = evs.map(e=>fresh.get(String(e.id)) || e);

    rounds[roundNumber] = updatedRound;

    const freshAll = new Map(allEvents.map(e=>[String(e.id),e]));
    for(const e of updatedRound){
      freshAll.set(String(e.id),e);
    }
    allEvents = [...freshAll.values()];
  }

  async function manualRefresh(){
    if(refreshBtn.disabled) return;

    refreshBtn.disabled = true;
    refreshBtn.classList.add("refreshing");
    clearError();

    const wantedRound = selectedRound;
    const roundsToRefresh = new Set([wantedRound,currentRound]);

    try{
      // I tabellini e le statistiche devono essere riletti da ESPN.
      matchDetailsCache.clear();
      summaryCache.clear();
      cardPlaysCache.clear();
      standingsCache = null;
      standingsBaseFetchedAt = 0;
      leadersCache = {scorers:null,assists:null};

      for(const roundNumber of roundsToRefresh){
        await refreshRoundFromEspn(roundNumber);
      }

      // Close only non-live details using the freshly updated ESPN status.
      // LIVE / halftime remain open and keep EVENTI/STATISTICHE/FORMAZIONI selection.
      resetMatchDetailsAfterRefresh();

      // Manteniamo esattamente il tab e la giornata che l'utente stava guardando.
      selectedRound = rounds[wantedRound] ? wantedRound : currentRound;

      await renderActive();
      setUpdated();
    }catch(e){
      showError("Aggiornamento non riuscito. Riprova tra poco.");
    }finally{
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("refreshing");
    }
  }

  refreshBtn.addEventListener("click",manualRefresh);

  async function refreshCurrentRound(){
    const watchingMatches =
      activeTab === "matches" &&
      selectedRound === currentRound;

    const watchingStandings =
      activeTab === "standings";

    if(!watchingMatches && !watchingStandings) return;

    const evs = rounds[currentRound] || [];
    if(!evs.length) return;

    // On CLASSIFICA we only poll near kickoff / while a match can be live.
    // Outside that window the official table is static and no network work is needed.
    if(
      watchingStandings &&
      !liveSerieAEvents().length &&
      !roundIsNearKickoff(currentRound)
    ){
      return;
    }

    try{
      const hadLive = liveSerieAEvents().length > 0;

      await refreshRoundFromEspn(currentRound);

      const hasLive = liveSerieAEvents().length > 0;

      if(watchingMatches){
        for(const e of rounds[currentRound] || []){
          if(stateOf(e)!=="done"){
            matchDetailsCache.delete(e.id);
            summaryCache.delete(e.id);
            cardPlaysCache.delete(String(e.id));
          }
        }

        await renderMatches();

        if(matchPageOpenId){
          await refreshOpenMatchPage();
        }

        return;
      }

      // While games are live, keep the official pre-match standings as
      // the stable base and only update the projected live score.
      //
      // As soon as the last live match finishes, force one fresh official
      // standings fetch so the projection disappears cleanly.
      if(hadLive && !hasLive){
        standingsCache = null;
        standingsBaseFetchedAt = 0;
      }

      await renderStandings({skipRoundRefresh:true});
    }catch(_){}
  }

  async function start(){
    try{
      setupRoundSwipe();
      setupThemeControl();
      setupMatchPage();
      setupTeamSheet();
      clearLegacyUiState();

      // Every fresh app launch starts from the current matchday.
      activeTab = "matches";
      document.querySelectorAll(".tab").forEach(btn=>{
        btn.classList.toggle(
          "active",
          btn.dataset.tab === "matches"
        );
      });

      await loadSeason();

      // loadSeason detects the current Serie A round from ESPN.
      // Explicitly align selectedRound again before first render.
      selectedRound = currentRound;

      await renderMatches();
      setInterval(refreshCurrentRound,REFRESH_MS);
    }catch(e){
      showError("Non riesco a collegarmi ai dati di Serie A.");
      content.innerHTML = `<div class="message">Impossibile caricare la stagione. Riprova tra poco.</div>`;
    }
  }

  start();
})();
</script>
