<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Serie A Live</title>
  <link rel="icon" type="image/png" sizes="32x32" href="seriea-live-v3-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="seriea-live-v3-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="seriea-live-v3-180.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="seriea-live-v3-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Serie A Live">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="app-version" content="2.35">
  <style>
    :root{
      --bg:#f4f6f8;
      --card:#ffffff;
      --ink:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#0b63ce;
      --accent-soft:#eaf3ff;
      --live:#d92d20;
      --green:#067647;
      --nav:#0b1220;
      --shadow:0 5px 18px rgba(16,24,40,.06);
    }
    *{box-sizing:border-box;touch-action:manipulation}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      min-height:100vh;
      padding-bottom:calc(94px + env(safe-area-inset-bottom));
    }
    button{font:inherit}
    .top{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(244,246,248,.94);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(228,231,236,.85);
    }
    header{
      max-width:760px;
      margin:0 auto;
      padding:15px 16px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .header-actions{
      display:flex;
      align-items:center;
      gap:9px;
    }
    .refresh-btn{
      appearance:none;
      width:36px;
      height:36px;
      flex:0 0 36px;
      display:grid;
      place-items:center;
      padding:0;
      border:1px solid rgba(208,213,221,.9);
      border-radius:12px;
      background:rgba(255,255,255,.78);
      color:#344054;
      box-shadow:0 2px 8px rgba(16,24,40,.06);
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .refresh-btn:active{
      transform:scale(.96);
    }
    .refresh-btn:disabled{
      opacity:.72;
    }
    .refresh-btn i{
      display:block;
      font-size:19px;
      line-height:1;
    }
    .refresh-btn.refreshing i{
      animation:spin .8s linear infinite;
    }
    h1{
      margin:0;
      font-size:24px;
      line-height:1;
      letter-spacing:-.03em;
    }
    .season{
      margin-top:5px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }
    .updated{
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      text-align:right;
    }
    main{
      max-width:760px;
      margin:0 auto;
      padding:14px 12px 22px;
    }
    .round-nav{
      display:grid;
      grid-template-columns:46px 1fr 46px;
      gap:8px;
      align-items:center;
      margin-bottom:10px;
    }
    .round-btn,.round-center,.today-btn{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:13px;
      min-height:44px;
      color:var(--ink);
      box-shadow:var(--shadow);
    }
    .round-btn{
      font-size:25px;
      line-height:1;
      font-weight:400;
    }
    .round-btn:disabled{opacity:.3}
    .round-center{
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.02em;
    }
    .today-wrap{text-align:center;margin:0 0 14px}
    .today-btn{
      min-height:34px;
      padding:0 13px;
      color:var(--accent);
      font-size:12px;
      font-weight:700;
      box-shadow:none;
    }
    .date-label{
      margin:18px 4px 8px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.07em;
    }
    .match{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      margin-bottom:10px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .match.live{border-color:#f2b8b5}
    .match-main{
      display:grid;
      grid-template-columns:1fr 78px 1fr;
      align-items:center;
      gap:5px;
      padding:15px 12px 12px;
    }
    .team{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
      text-align:center;
      min-width:0;
      font-size:13px;
      font-weight:750;
    }
    .team img{
      width:38px;height:38px;object-fit:contain;
    }
    .team-name{
      width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .scorebox{text-align:center}
    .score{
      font-size:27px;
      font-weight:850;
      letter-spacing:-.04em;
      line-height:1.05;
    }
    .ko{
      font-size:20px;
      font-weight:800;
      line-height:1.1;
    }
    .status{
      display:inline-block;
      margin-top:6px;
      padding:3px 6px;
      border-radius:99px;
      background:#f2f4f7;
      color:var(--muted);
      font-size:9.5px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.03em;
      white-space:nowrap;
    }
    .status.live{
      background:#fee4e2;
      color:var(--live);
    }
    .status.done{color:var(--green);background:#ecfdf3}
    .events{
      position:relative;
      border-top:1px solid var(--line);
      padding:14px 12px 16px;
      background:#fcfcfd;
    }
    .events::before{
      content:"";
      position:absolute;
      top:16px;
      bottom:16px;
      left:50%;
      width:1px;
      background:#d9dee7;
      transform:translateX(-50%);
    }
    .timeline-row{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:minmax(0,1fr) 42px 30px 42px minmax(0,1fr);
      align-items:center;
      min-height:40px;
      margin-bottom:7px;
    }
    .timeline-row:last-child{margin-bottom:0}
    .timeline-info{
      min-width:0;
      font-size:12.5px;
      line-height:1.3;
      font-weight:400;
    }
    .timeline-info.home{
      grid-column:1;
      text-align:right;
      padding-right:6px;
    }
    .timeline-info.away{
      grid-column:5;
      text-align:left;
      padding-left:6px;
    }
    .timeline-main{
      color:var(--ink);
      font-weight:400;
    }
    .timeline-assist{
      display:block;
      color:var(--muted);
      font-size:11.5px;
      font-weight:400;
      margin-top:1px;
    }
    .timeline-sub-in,
    .timeline-sub-out{
      display:block;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .timeline-sub-in{
      color:#168447;
      font-weight:400;
    }
    .timeline-sub-out{
      color:#c4322b;
      font-size:11px;
      font-weight:400;
      margin-top:1px;
    }
    .timeline-sub-arrow{
      display:inline-block;
      width:12px;
      text-align:center;
      font-weight:850;
    }
    .timeline-minute{
      color:var(--muted);
      font-size:11.5px;
      font-weight:700;
      white-space:nowrap;
    }
    .timeline-minute.home{
      grid-column:4;
      text-align:left;
      padding-left:4px;
    }
    .timeline-minute.away{
      grid-column:2;
      text-align:right;
      padding-right:4px;
    }
    .timeline-icon{
      grid-column:3;
      display:grid;
      place-items:center;
      width:30px;
      min-width:30px;
      height:30px;
      line-height:1;
      background:transparent;
      border:0;
      box-shadow:none;
    }
    .event-ph{
      display:block;
      font-size:21px;
      line-height:1;
      color:#344054;
      font-weight:400;
    }
    .event-ph.own-goal{
      color:#d92d20;
    }
    .event-ph.pen-saved{
      color:#344054;
    }
    .event-card{
      display:block;
      width:11px;
      height:17px;
      border-radius:2px;
      box-shadow:0 1px 2px rgba(16,24,40,.15);
    }
    .event-card.yellow{
      background:#f4c430;
      border:1px solid #d9aa00;
    }
    .event-card.red{
      background:#d92d20;
      border:1px solid #b42318;
    }
    .sub-ph{
      width:24px;
      height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:0;
    }
    .sub-ph i{
      display:block;
      font-size:14px;
      line-height:1;
      margin:0 -1px;
    }
    .sub-ph .sub-up{color:#168447}
    .sub-ph .sub-down{color:#c4322b}

    .assist-icon{
      display:inline-block;
      vertical-align:-2px;
      margin-right:3px;
      font-size:13px;
      line-height:1;
      color:currentColor;
      font-weight:400;
    }

    .pen-miss-wrap{
      position:relative;
      width:23px;
      height:23px;
      display:grid;
      place-items:center;
      color:#b42318;
    }
    .pen-miss-wrap .ph-soccer-ball{
      font-size:21px;
      line-height:1;
    }
    .pen-miss-wrap .ph-x{
      position:absolute;
      font-size:12px;
      line-height:1;
      color:#b42318;
      font-weight:700;
      text-shadow:
        0 0 2px #fff,
        0 0 2px #fff;
    }
    .minute{color:var(--muted);font-weight:650}
    .empty-events{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      padding:2px 0;
    }
    .events-toggle{
      appearance:none;
      width:100%;
      border:0;
      border-top:1px solid var(--line);
      background:transparent;
      color:var(--muted);
      min-height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      padding:8px 12px 9px;
      font:inherit;
      font-size:11.5px;
      font-weight:650;
      cursor:pointer;
    }
    .events-toggle:active{
      background:#f9fafb;
    }

    .match-details{
      border-top:1px solid var(--line);
      background:#fcfcfd;
    }
    .detail-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      border-bottom:1px solid var(--line);
      padding:0 14px;
      background:#fff;
    }
    .detail-tab{
      appearance:none;
      position:relative;
      border:0;
      background:transparent;
      color:var(--muted);
      min-height:40px;
      padding:10px 6px 9px;
      font:inherit;
      font-size:10.5px;
      font-weight:750;
      letter-spacing:.025em;
      cursor:pointer;
    }
    .detail-tab.active{
      color:var(--ink);
    }
    .detail-tab.active::after{
      content:"";
      position:absolute;
      left:28%;
      right:28%;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:var(--ink);
    }
    .detail-panel{
      min-width:0;
    }
    .detail-message{
      padding:18px 14px 19px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }

    .lineups{
      padding:14px 14px 17px;
    }
    .formation-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:24px;
      margin:0 0 13px;
      min-height:18px;
      align-items:center;
    }
    .formation-value{
      text-align:center;
      color:var(--ink);
      font-size:12px;
      font-weight:750;
    }
    .lineup-heading{
      margin:13px 0 8px;
      text-align:center;
      color:var(--muted);
      font-size:9.5px;
      font-weight:800;
      letter-spacing:.075em;
      text-transform:uppercase;
    }
    .lineup-heading:first-child{
      margin-top:0;
    }
    .lineup-grid{
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .lineup-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:20px;
      align-items:center;
      min-height:22px;
    }
    .lineup-player{
      min-width:0;
      display:flex;
      align-items:baseline;
      gap:6px;
      color:var(--ink);
      font-size:12px;
      line-height:1.3;
    }
    .lineup-player.home{
      justify-content:flex-start;
      text-align:left;
    }
    .lineup-player.away{
      justify-content:flex-end;
      text-align:right;
    }
    .lineup-number{
      flex:0 0 auto;
      min-width:16px;
      color:var(--muted);
      font-size:10.5px;
      font-weight:650;
    }
    .lineup-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .soccer-pitch{
      position:relative;
      width:100%;
      aspect-ratio:68 / 105;
      margin:3px auto 16px;
      overflow:hidden;
      border-radius:8px;
      background:#9fbd8d;
      border:1px solid rgba(27,55,35,.12);
    }
    .pitch-lines{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:1;
    }
    .pitch-player{
      position:absolute;
      z-index:2;
      width:64px;
      transform:translate(-50%,-50%);
      text-align:center;
      pointer-events:none;
    }
    .pitch-player-dot{
      width:27px;
      height:27px;
      margin:0 auto 3px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--team-color,#344054);
      color:var(--team-text,#fff);
      border:1.5px solid var(--team-border,rgba(255,255,255,.62));
      box-shadow:0 1px 3px rgba(16,24,40,.15);
      font-size:10px;
      font-weight:850;
      line-height:1;
    }
    .pitch-player-name{
      display:block;
      max-width:64px;
      margin:0 auto;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:#17251b;
      text-shadow:0 1px 1px rgba(255,255,255,.55);
      font-size:8.7px;
      font-weight:750;
      line-height:1.12;
      letter-spacing:-.01em;
    }
    .pitch-fallback-note{
      margin:-2px 0 10px;
      text-align:center;
      color:var(--muted);
      font-size:10.5px;
    }
    @media (max-width:350px){
      .pitch-player{width:57px}
      .pitch-player-name{
        max-width:57px;
        font-size:8.1px;
      }
      .pitch-player-dot{
        width:25px;
        height:25px;
        font-size:9.5px;
      }
    }

    .section-title{
      margin:2px 4px 12px;
      font-size:20px;
      letter-spacing:-.025em;
    }
    .table-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .stand-head,.stand-row{
      display:grid;
      grid-template-columns:27px minmax(130px,1fr) 28px 28px 28px 28px 34px 38px;
      align-items:center;
      gap:3px;
      padding:9px 8px;
      font-size:11px;
    }
    .stand-head{
      color:var(--muted);
      background:#f9fafb;
      text-transform:uppercase;
      font-size:9px;
      font-weight:800;
      border-bottom:1px solid var(--line);
    }
    .stand-row{
      min-height:47px;
      border-bottom:1px solid rgba(228,231,236,.82);
    }
    .stand-row.zone-champions{background:#eaf3ff}
    .stand-row.zone-europa{background:#fff3e6}
    .stand-row.zone-conference{background:#ecf8ef}
    .stand-row.zone-relegation{background:#fff0f0}
    .stand-row:last-child{border-bottom:0}
    .stand-legend{
      display:flex;
      flex-wrap:wrap;
      gap:8px 12px;
      padding:11px 12px 12px;
      border-top:1px solid var(--line);
      background:#fff;
      color:var(--muted);
      font-size:10px;
      line-height:1.25;
    }
    .legend-item{
      display:inline-flex;
      align-items:center;
      gap:5px;
      white-space:nowrap;
    }
    .legend-dot{
      width:9px;
      height:9px;
      border-radius:3px;
      display:inline-block;
    }
    .legend-dot.champions{background:#cfe3ff}
    .legend-dot.europa{background:#ffd9ad}
    .legend-dot.conference{background:#cdeed5}
    .legend-dot.relegation{background:#ffd0d0}
    .pos{text-align:center;font-weight:800}
    .club{
      min-width:0;
      display:flex;
      align-items:center;
      gap:7px;
      font-weight:700;
      font-size:12px;
    }
    .club img{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
    .club span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .num{text-align:center;font-variant-numeric:tabular-nums}
    .pts{font-weight:850}
    .leader-row{
      display:grid;
      grid-template-columns:34px 1fr 52px;
      gap:8px;
      align-items:center;
      min-height:61px;
      padding:8px 12px;
      border-bottom:1px solid var(--line);
    }
    .leader-row:last-child{border-bottom:0}
    .rank{
      font-size:17px;
      font-weight:850;
      text-align:center;
    }
    .player{min-width:0}
    .player-name{
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .player-team{
      margin-top:3px;
      color:var(--muted);
      font-size:11.5px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .leader-value{
      text-align:center;
      font-size:21px;
      font-weight:900;
    }
    .message{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:34px 18px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      box-shadow:var(--shadow);
    }
    .spinner{
      width:25px;height:25px;border-radius:50%;
      border:3px solid var(--line);border-top-color:var(--accent);
      margin:0 auto 11px;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{
      margin-bottom:10px;
      padding:10px 12px;
      border-radius:12px;
      background:#fff4ed;
      color:#b54708;
      font-size:12px;
      display:none;
    }
    .bottom-nav-frost{
      position:fixed;
      z-index:29;
      pointer-events:none;
      left:max(10px,env(safe-area-inset-left));
      right:max(10px,env(safe-area-inset-right));
      bottom:calc(6px + env(safe-area-inset-bottom));
      height:68px;
      border-radius:34px;

      /*
        Separate backdrop layer:
        Safari now blurs the page content BEFORE the actual glass bar is drawn.
        This makes text, scores and crests behind the bar visibly lose focus.
      */
      background:rgba(255,255,255,.16);
      backdrop-filter:
        blur(20px)
        saturate(125%)
        brightness(105%)
        contrast(92%);
      -webkit-backdrop-filter:
        blur(20px)
        saturate(125%)
        brightness(105%)
        contrast(92%);

      box-shadow:
        0 9px 28px rgba(16,24,40,.08);
    }

    .bottom-nav{
      position:fixed;
      z-index:30;
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      bottom:calc(8px + env(safe-area-inset-bottom));
      height:64px;
      padding:5px;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;
      overflow:hidden;
      isolation:isolate;

      /* iOS-style floating glass capsule */
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.44) 0%,
          rgba(250,251,252,.28) 52%,
          rgba(246,248,250,.22) 100%
        );
      border:1px solid rgba(255,255,255,.56);
      border-radius:32px;

      /* stronger frosted refraction: content remains visible but loses focus */
      backdrop-filter:
        blur(26px)
        saturate(165%)
        brightness(104%)
        contrast(96%);
      -webkit-backdrop-filter:
        blur(26px)
        saturate(165%)
        brightness(104%)
        contrast(96%);

      box-shadow:
        0 11px 32px rgba(16,24,40,.14),
        0 2px 8px rgba(16,24,40,.06),
        inset 0 1px 0 rgba(255,255,255,.94),
        inset 0 -1px 0 rgba(255,255,255,.24);
    }

    /* very restrained specular reflection, like the top edge of Liquid Glass */
    .bottom-nav::before{
      content:"";
      position:absolute;
      z-index:0;
      pointer-events:none;
      left:10px;
      right:10px;
      top:1px;
      height:46%;
      border-radius:30px 30px 50% 50%;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.56),
          rgba(255,255,255,.15) 44%,
          transparent 100%
        );
      opacity:.78;
    }

    /* faint lower refraction; not a visible border */
    .bottom-nav::after{
      content:"";
      position:absolute;
      z-index:0;
      pointer-events:none;
      inset:1px;
      border-radius:31px;
      background:rgba(255,255,255,.06);
      box-shadow:
        inset 0 -9px 20px rgba(255,255,255,.12),
        inset 0 0 0 .5px rgba(255,255,255,.26);
    }

    .tab{
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(29,29,31,.62);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      min-width:0;
      border-radius:27px;
      font-size:9.5px;
      font-weight:600;
      letter-spacing:-.01em;
      padding:5px 2px 4px;
      position:relative;
      z-index:1;
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      transition:
        color .20s ease,
        transform .16s ease;
    }

    /* selected Liquid Glass lens */
    .tab::before{
      content:"";
      position:absolute;
      z-index:-1;
      inset:0;
      border-radius:27px;
      opacity:0;
      transform:scale(.88);
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.98),
          rgba(255,255,255,.76)
        );
      border:1px solid rgba(255,255,255,.98);
      outline:1px solid rgba(60,60,67,.09);
      outline-offset:-1px;
      backdrop-filter:blur(18px) saturate(150%) brightness(110%);
      -webkit-backdrop-filter:blur(18px) saturate(150%) brightness(110%);
      box-shadow:
        0 5px 16px rgba(16,24,40,.15),
        0 1px 4px rgba(16,24,40,.08),
        inset 0 1px 0 rgba(255,255,255,1),
        inset 0 -1px 0 rgba(148,163,184,.16),
        inset 0 0 0 .5px rgba(255,255,255,.72);
      transition:
        opacity .20s ease,
        transform .22s cubic-bezier(.2,.8,.2,1);
    }

    .tab:active{
      transform:scale(.96);
    }

    .tab .ico{
      width:22px;
      height:22px;
      display:grid;
      place-items:center;
      line-height:1;
      transition:
        transform .20s cubic-bezier(.2,.8,.2,1),
        color .20s ease;
    }

    .tab .ico i{
      display:block;
      font-size:22px;
      line-height:1;
      font-weight:400;
    }

    .tab.active{
      /* iOS system-blue style selection tint */
      color:#007aff;
      text-shadow:0 1px 0 rgba(255,255,255,.72);
    }

    .tab.active::before{
      opacity:1;
      transform:scale(1);
    }

    .tab.active .ico{
      transform:translateY(-.5px) scale(1.02);
    }

    @supports not ((backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px))){
      .bottom-nav-frost{
        background:rgba(246,247,249,.82);
      }
      .bottom-nav{
        background:rgba(246,247,249,.98);
        border-color:rgba(208,213,221,.75);
      }
      .tab.active::before{
        background:rgba(255,255,255,.88);
      }
    }

    @media (prefers-reduced-motion:reduce){
      .tab,
      .tab::before,
      .tab .ico{
        transition:none;
      }
    }
    .footnote{
      margin:14px 5px 0;
      text-align:center;
      color:#98a2b3;
      font-size:10px;
      line-height:1.4;
    }

    @media(min-width:650px){
      main{padding-left:18px;padding-right:18px}
      .match-main{padding-left:24px;padding-right:24px}
      .stand-head,.stand-row{
        grid-template-columns:36px minmax(200px,1fr) 40px 40px 40px 40px 48px 52px;
        font-size:12px;
      }
      .stand-head{font-size:10px}
    }
  </style>

    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
  />

<body>
  <div class="top">
    <header>
      <div>
        <h1>Serie A Live</h1>
        <div class="season" id="seasonLabel">Serie A</div>
      </div>
      <div class="header-actions">
        <div class="updated" id="updated">—</div>
        <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Aggiorna dati" title="Aggiorna">
          <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>
        </button>
      </div>
    </header>
  </div>

  <main>
    <div class="error" id="error"></div>
    <div id="content">
      <div class="message"><div class="spinner"></div>Carico i dati…</div>
    </div>
    <div class="footnote">Dati da ESPN. Nel tabellino sono mostrati gol, assist, cartellini, rigori e sostituzioni quando disponibili.</div>
  </main>


  <div class="bottom-nav-frost" aria-hidden="true"></div>

  <nav class="bottom-nav" aria-label="Navigazione principale">
    <button class="tab active" data-tab="matches">
      <span class="ico" aria-hidden="true"><i class="ph ph-soccer-ball"></i></span>
      <span>PARTITE</span>
    </button>
    <button class="tab" data-tab="standings">
      <span class="ico" aria-hidden="true"><i class="ph ph-ranking"></i></span>
      <span>CLASSIFICA</span>
    </button>
    <button class="tab" data-tab="scorers">
      <span class="ico" aria-hidden="true"><i class="ph ph-target"></i></span>
      <span>MARCATORI</span>
    </button>
    <button class="tab" data-tab="assists">
      <span class="ico" aria-hidden="true"><i class="ph ph-sneaker"></i></span>
      <span>ASSIST</span>
    </button>
  </nav>

<script>
(() => {
  "use strict";

  const SITE = "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1";
  const STANDINGS = "https://site.api.espn.com/apis/v2/sports/soccer/ita.1/standings";
  const CORE = "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ita.1";
  const REFRESH_MS = 60000;

  const content = document.getElementById("content");
  const errorBox = document.getElementById("error");
  const updated = document.getElementById("updated");
  const seasonLabel = document.getElementById("seasonLabel");
  const refreshBtn = document.getElementById("refreshBtn");

  let activeTab = "matches";
  let rounds = {};
  let currentRound = 1;
  let selectedRound = 1;
  let seasonYear = new Date().getFullYear();
  let seasonText = "Serie A";
  let allEvents = [];
  let matchDetailsCache = new Map();
  let summaryCache = new Map();
  let standingsCache = null;
  let leadersCache = { scorers:null, assists:null };
  let cardPlaysCache = new Map();

  const expandedMatchDetails = new Set();
  const matchDetailTabs = new Map();

  const esc = value => String(value ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");

  function shortPlayerName(name){
    const clean = String(name || "").trim().replace(/\s+/g," ");
    if(!clean) return "—";

    // Se ESPN fornisce già "N. Cognome", lo lasciamo così.
    if(/^[A-ZÀ-ÖØ-Ý]\.\s+/u.test(clean)) return clean;

    const parts = clean.split(" ");
    if(parts.length === 1) return clean;

    const firstInitial = parts[0].charAt(0).toUpperCase();
    const particle = new Set([
      "de","del","della","di","da","do","dos","das",
      "van","von","der","den","la","le"
    ]);

    // Mantiene cognomi come "Di Lorenzo", "De Roon", "Van de Ven".
    let surnameStart = parts.length - 1;
    while(surnameStart > 1 && particle.has(parts[surnameStart - 1].toLowerCase())){
      surnameStart--;
    }

    return `${firstInitial}. ${parts.slice(surnameStart).join(" ")}`;
  }

  const two = n => String(n).padStart(2,"0");
  const fmtDateKey = d => `${d.getUTCFullYear()}${two(d.getUTCMonth()+1)}${two(d.getUTCDate())}`;

  function setUpdated(){
    updated.textContent = "Agg. " + new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

function showError(text){
    errorBox.textContent = text;
    errorBox.style.display = "block";
  }
  function clearError(){ errorBox.style.display = "none"; }

  async function getJson(url){
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }


  function loading(text="Carico i dati…"){
    content.innerHTML = `<div class="message"><div class="spinner"></div>${esc(text)}</div>`;
  }

  function dateLabel(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  }

  function timeLabel(iso){
    return new Date(iso).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

  function teamName(c){
    return c?.team?.shortDisplayName || c?.team?.displayName || c?.team?.name || "—";
  }
  function teamLogo(c){
    return c?.team?.logo || c?.team?.logos?.[0]?.href || "";
  }

  function cleanHexColor(value){
    const raw = String(value || "").trim().replace(/^#/,"");
    if(/^[0-9a-f]{6}$/i.test(raw)) return `#${raw.toUpperCase()}`;
    if(/^[0-9a-f]{3}$/i.test(raw)){
      return `#${raw.split("").map(x=>x+x).join("").toUpperCase()}`;
    }
    return "";
  }

  function teamPrimaryColor(c){
    const key = String(teamName(c) || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");

    // Small visual overrides for the most recognizable Serie A identities.
    const overrides = [
      [["juventus"],"#FFFFFF"],
      [["milan"],"#D71920"],
      [["inter","internazionale"],"#0057B8"],
      [["sassuolo"],"#168447"],
      [["como"],"#4B9CD3"],
      [["napoli"],"#43A7E1"],
      [["lazio"],"#78C7E8"],
      [["fiorentina"],"#6F2DA8"],
      [["roma"],"#8E1F2D"],
      [["atalanta"],"#1765A7"],
      [["genoa"],"#C52032"],
      [["torino"],"#8A1538"]
    ];

    for(const [names,color] of overrides){
      if(names.some(name=>key === name || key.includes(name))) return color;
    }

    return (
      cleanHexColor(c?.team?.color) ||
      cleanHexColor(c?.team?.alternateColor) ||
      "#344054"
    );
  }

  function colorPresentation(hex){
    const color = cleanHexColor(hex) || "#344054";
    const raw = color.slice(1);
    const r = parseInt(raw.slice(0,2),16);
    const g = parseInt(raw.slice(2,4),16);
    const b = parseInt(raw.slice(4,6),16);

    // Relative visual brightness: enough for choosing readable jersey numbers.
    const brightness = (r*299 + g*587 + b*114) / 1000;
    const light = brightness > 178;

    return {
      color,
      text:light ? "#17202A" : "#FFFFFF",
      border:light ? "rgba(23,32,42,.58)" : "rgba(255,255,255,.62)"
    };
  }

  function isActuallyLive(ev){
    const status = ev?.status || {};
    const type = status?.type || {};
    const state = String(type?.state || "").toLowerCase();

    if(state !== "in" || type?.completed === true) return false;

    // ESPN can occasionally expose state="in" for other fixtures on the
    // same matchday. A future kickoff must never be promoted as LIVE.
    const kickoff = new Date(ev?.date).getTime();
    const now = Date.now();

    if(Number.isFinite(kickoff)){
      // Small tolerance for ESPN switching state just before kickoff.
      if(now < kickoff - 2 * 60 * 1000) return false;

      // Safety net against a stale "in" state many hours after kickoff.
      if(now > kickoff + 4 * 60 * 60 * 1000) return false;
    }

    const typeName = String(type?.name || "").toUpperCase();
    const description = String(type?.description || "").toLowerCase();
    const detail = String(
      type?.detail ||
      type?.shortDetail ||
      status?.displayClock ||
      ""
    ).toLowerCase();

    const explicitLiveStatus =
      /STATUS_(IN_PROGRESS|HALFTIME|FIRST_HALF|SECOND_HALF|EXTRA_TIME|PENALTY_SHOOTOUT|END_PERIOD)/.test(typeName) ||
      /half[\s-]?time|intervallo|first half|second half|extra time|penalt/.test(description) ||
      /half[\s-]?time|intervallo/.test(detail);

    const period = Number(
      status?.period ??
      ev?.competitions?.[0]?.status?.period ??
      0
    );

    const clock = String(status?.displayClock || "").trim();

    // Match clocks such as 12', 45'+2, 90+4, 105' are real live evidence.
    const hasMatchClock =
      /^\d{1,3}(?:['’])?(?:\+\d{1,2})?(?:['’])?$/.test(clock) ||
      /^\d{1,3}:\d{2}$/.test(clock);

    return explicitLiveStatus || period > 0 || hasMatchClock;
  }

  function stateOf(ev){
    const type = ev?.status?.type || {};
    const state = String(type?.state || "").toLowerCase();

    if(state === "post" || type?.completed === true) return "done";
    if(isActuallyLive(ev)) return "live";
    return "pre";
  }

  function roundNumberFromEvent(ev){
    const candidates = [
      ev?.week?.number,
      ev?.competitions?.[0]?.week?.number,
      ev?.season?.week?.number
    ];
    for(const n of candidates){
      const x = Number(n);
      if(Number.isFinite(x) && x > 0) return x;
    }
    return null;
  }

  function groupIntoRounds(events){
    const explicit = {};
    let explicitCount = 0;

    for(const ev of events){
      const n = roundNumberFromEvent(ev);
      if(n){
        (explicit[n] ||= []).push(ev);
        explicitCount++;
      }
    }
    if(explicitCount >= Math.max(20, events.length * 0.7)){
      Object.values(explicit).forEach(list => list.sort((a,b)=>new Date(a.date)-new Date(b.date)));
      return explicit;
    }

    const out = {};
    let n = 1, current = [], seen = new Set();
    const sorted = [...events].sort((a,b)=>new Date(a.date)-new Date(b.date));
    for(const ev of sorted){
      const ids = (ev?.competitions?.[0]?.competitors || []).map(c => String(c.id));
      if(current.length && ids.some(id => seen.has(id))){
        out[n++] = current;
        current = [];
        seen = new Set();
      }
      current.push(ev);
      ids.forEach(id => seen.add(id));
    }
    if(current.length) out[n] = current;
    return out;
  }

  function detectCurrentRound(){
    const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    if(!nums.length) return 1;

    const live = nums.find(n => rounds[n].some(e => stateOf(e) === "live"));
    if(live) return live;

    const now = Date.now();
    let latestStarted = nums[0];
    for(const n of nums){
      const times = rounds[n].map(e => new Date(e.date).getTime()).filter(Number.isFinite);
      const first = Math.min(...times);
      if(Number.isFinite(first) && first <= now) latestStarted = n;
    }
    return latestStarted;
  }

  async function loadSeason(){
    const board = await getJson(`${SITE}/scoreboard?_=${Date.now()}`);
    const league = board?.leagues?.[0];
    if(!league?.season?.startDate || !league?.season?.endDate) throw new Error("Stagione non disponibile");

    seasonYear = Number(league.season.year) || new Date(league.season.startDate).getFullYear();
    const y2 = String(seasonYear + 1).slice(-2);
    seasonText = `Serie A ${seasonYear}/${y2}`;
    seasonLabel.textContent = seasonText;

    const start = new Date(league.season.startDate);
    const end = new Date(league.season.endDate);
    const ranges = [];
    let cur = new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),start.getUTCDate()));

    while(cur <= end){
      const blockEnd = new Date(Math.min(cur.getTime() + 13*86400000, end.getTime()));
      ranges.push(`${fmtDateKey(cur)}-${fmtDateKey(blockEnd)}`);
      cur = new Date(blockEnd.getTime() + 86400000);
    }

    const chunks = await Promise.all(
      ranges.map(rng =>
        getJson(`${SITE}/scoreboard?dates=${rng}`).catch(()=>({events:[]}))
      )
    );

    const map = new Map();
    for(const ev of board.events || []) map.set(ev.id, ev);
    for(const chunk of chunks){
      for(const ev of chunk.events || []) if(!map.has(ev.id)) map.set(ev.id, ev);
    }

    allEvents = [...map.values()];
    rounds = groupIntoRounds(allEvents);
    currentRound = detectCurrentRound();
    selectedRound = currentRound;
    setUpdated();
  }

  function minuteOf(detail){
    const display = detail?.clock?.displayValue || "";
    return display || "";
  }

  function extractMatchEvents(summary, homeId){
    const details = summary?.header?.competitions?.[0]?.details || [];
    const events = [];

    for(const d of details){
      const raw = d.participants || d.athletesInvolved || [];
      const athletes = raw.map(x => x?.athlete || x).filter(Boolean);
      const athlete = athletes?.[0] || {};
      const displayName =
        athlete?.displayName ||
        athlete?.fullName ||
        athlete?.shortName ||
        "—";

      const teamId = d?.team?.id;
      const side = String(teamId) === String(homeId) ? "home" : "away";
      const minute = minuteOf(d);
      const typeText = String(d?.type?.text || d?.type?.description || "").toLowerCase();

      if(d?.scoringPlay && !d?.shootout){
        let assist = "";
        if(!d.penaltyKick && !d.ownGoal && athletes.length > 1){
          const assister = athletes[1] || {};
          assist =
            assister?.displayName ||
            assister?.fullName ||
            assister?.shortName ||
            "";
        }

        events.push({
          kind:"goal",
          side,
          player:displayName,
          assist,
          minute,
          penalty:!!d.penaltyKick,
          ownGoal:!!d.ownGoal
        });
        continue;
      }

      const isMissedPenalty =
        !d?.scoringPlay && (
          !!d?.penaltyKick ||
          typeText.includes("penalty missed") ||
          typeText.includes("penalty saved") ||
          typeText.includes("missed penalty") ||
          typeText.includes("misses a penalty") ||
          typeText.includes("failed penalty") ||
          typeText.includes("fails to convert the penalty") ||
          typeText.includes("failed to convert the penalty")
        );

      if(isMissedPenalty){
        events.push({
          kind:"penmiss",
          side,
          player:displayName,
          minute
        });
        continue;
      }

      // ESPN può indicare il cartellino tramite flag oppure nel testo del tipo.
      const isRed =
        !!d?.redCard ||
        typeText.includes("red card") ||
        typeText.includes("second yellow");

      const isYellow =
        !isRed && (
          !!d?.yellowCard ||
          typeText.includes("yellow card")
        );

      if(isRed || isYellow){
        events.push({
          kind:isRed ? "red" : "yellow",
          side,
          player:displayName,
          minute
        });
      }
    }

    return events;
  }

  function normalizedTeamText(value){
    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]/g,"");
  }

  function playText(play){
    return String(
      play?.text ||
      play?.shortText ||
      play?.description ||
      play?.headline ||
      ""
    ).trim();
  }

  function playMinute(play){
    const direct =
      play?.clock?.displayValue ||
      play?.time?.displayValue ||
      play?.period?.displayValue ||
      "";
    if(direct) return direct;

    const txt = playText(play);
    const m = txt.match(/^\s*(\d+(?:'\+\d+)?')/);
    return m ? m[1] : "";
  }

  function playAthleteName(play){
    const raw =
      play?.athletesInvolved ||
      play?.participants ||
      (play?.athlete ? [play.athlete] : []);

    const list = Array.isArray(raw) ? raw : [];
    const athlete = list?.[0]?.athlete || list?.[0] || {};

    const direct =
      athlete?.displayName ||
      athlete?.fullName ||
      athlete?.shortName ||
      "";

    if(direct) return direct;

    let txt = playText(play).replace(/^\s*\d+(?:'\+\d+)?'\s*/,"");

    // Esempi:
    // "Martin Baturina (Como) is shown the yellow card."
    // "Patrick Cutrone (Como) has a penalty saved."
    // "Patrick Cutrone (Como) misses a penalty."
    const generic = txt.match(/^(.+?)\s+\(([^)]+)\)/);
    return generic ? generic[1].trim() : "";
  }

  function playTeamId(play){
    if(play?.team?.id) return String(play.team.id);
    const ref = String(play?.team?.$ref || "");
    const m = ref.match(/\/teams\/(\d+)/);
    return m ? m[1] : "";
  }

  function eventCompetitorAliases(ev){
    const competitors = ev?.competitions?.[0]?.competitors || [];
    const sides = {};

    for(const c of competitors){
      const side = c?.homeAway;
      if(side !== "home" && side !== "away") continue;

      sides[side] = [
        c?.team?.displayName,
        c?.team?.shortDisplayName,
        c?.team?.name,
        c?.team?.abbreviation
      ]
        .filter(Boolean)
        .map(String)
        .sort((a,b)=>b.length-a.length);
    }

    return sides;
  }

  function sideFromTeamText(value,ev){
    const mentioned = normalizedTeamText(value);
    if(!mentioned) return "";

    const aliases = eventCompetitorAliases(ev);

    for(const side of ["home","away"]){
      for(const alias of aliases[side] || []){
        const normalized = normalizedTeamText(alias);
        if(!normalized) continue;

        if(
          normalized === mentioned ||
          (normalized.length >= 4 && mentioned.includes(normalized)) ||
          (mentioned.length >= 4 && normalized.includes(mentioned))
        ){
          return side;
        }
      }
    }

    return "";
  }

  function substitutionNamesFromPlay(play,ev){
    let txt = playText(play)
      .replace(/^\s*\d+(?:'\+\d+)?'\s*/,"")
      .trim();

    if(!/substitution/i.test(txt) || !/\sreplaces\s/i.test(txt)){
      return null;
    }

    const replaceMatch = txt.match(/\sreplaces\s/i);
    if(!replaceMatch) return null;

    const splitAt = replaceMatch.index;
    let left = txt.slice(0,splitAt).trim();
    let playerOut = txt
      .slice(splitAt + replaceMatch[0].length)
      .trim();

    playerOut = playerOut
      .replace(/\s+(?:because of|due to)\b.*$/i,"")
      .replace(/[.!?]+\s*$/,"")
      .trim();

    left = left.replace(/^substitution,\s*/i,"").trim();

    const aliases = eventCompetitorAliases(ev);
    const allAliases = [
      ...(aliases.home || []).map(name=>({name,side:"home"})),
      ...(aliases.away || []).map(name=>({name,side:"away"}))
    ].sort((a,b)=>b.name.length-a.name.length);

    let playerIn = left;
    let side = "";

    for(const item of allAliases){
      const prefix = `${item.name}.`;
      if(left.toLowerCase().startsWith(prefix.toLowerCase())){
        playerIn = left.slice(prefix.length).trim();
        side = item.side;
        break;
      }
    }

    if(playerIn === left){
      const pieces = left.split(/\.\s+/);
      if(pieces.length >= 2){
        const possibleTeam = pieces.slice(0,-1).join(". ");
        const possiblePlayer = pieces[pieces.length-1].trim();
        const detectedSide = sideFromTeamText(possibleTeam,ev);

        if(detectedSide){
          side = detectedSide;
          playerIn = possiblePlayer;
        }else{
          const firstSeparator = left.indexOf(". ");
          if(firstSeparator >= 0){
            playerIn = left.slice(firstSeparator+2).trim();
          }
        }
      }
    }

    playerIn = playerIn
      .replace(/[.!?]+\s*$/,"")
      .trim();

    if(!playerIn || !playerOut) return null;

    return {playerIn,playerOut,side};
  }

  function playSpecialKind(play){
    const typeId = String(play?.type?.id || "");
    const typeText = String(
      play?.type?.text ||
      play?.type?.description ||
      playText(play)
    ).toLowerCase();
    const txt = playText(play).toLowerCase();

    if(
      typeId === "95" ||
      play?.redCard ||
      typeText.includes("red card") ||
      typeText.includes("second yellow")
    ) return "red";

    if(
      typeId === "94" ||
      play?.yellowCard ||
      typeText.includes("yellow card")
    ) return "yellow";

    const savedPenalty =
      txt.includes("penalty saved") ||
      txt.includes("penalty is saved") ||
      txt.includes("penalty was saved") ||
      /penalty.{0,80}saved by/.test(txt);

    if(savedPenalty) return "pensaved";

    const missedPenalty =
      txt.includes("penalty missed") ||
      txt.includes("misses a penalty") ||
      txt.includes("missed a penalty") ||
      txt.includes("failed to convert the penalty") ||
      txt.includes("fails to convert the penalty") ||
      txt.includes("failed penalty");

    if(missedPenalty) return "penmiss";

    if(
      typeText.includes("substitution") ||
      (txt.includes("substitution") && txt.includes("replaces"))
    ) return "sub";

    return "";
  }

  function specialSide(play, ev, homeId){
    const teamId = playTeamId(play);
    if(teamId) return String(teamId) === String(homeId) ? "home" : "away";

    const txt = playText(play);

    const subTeam = txt.match(/substitution,\s*(.+?)\.\s*/i);
    if(subTeam){
      const side = sideFromTeamText(subTeam[1],ev);
      if(side) return side;
    }

    const teamMatch = txt.match(/\(([^)]+)\)/);
    if(teamMatch){
      const side = sideFromTeamText(teamMatch[1],ev);
      if(side) return side;
    }

    return "";
  }

  function specialEventFromPlay(play, ev, homeId){
    const kind = playSpecialKind(play);
    if(!kind) return null;

    if(kind === "sub"){
      const sub = substitutionNamesFromPlay(play,ev);
      if(!sub) return null;

      const side =
        specialSide(play,ev,homeId) ||
        sub.side;

      if(!side) return null;

      return {
        kind:"sub",
        side,
        playerIn:sub.playerIn,
        playerOut:sub.playerOut,
        minute:playMinute(play)
      };
    }

    const player = playAthleteName(play);
    const side = specialSide(play,ev,homeId);
    if(!player || !side) return null;

    return {
      kind,
      side,
      player,
      minute:playMinute(play)
    };
  }

  function specialEventKey(e){
    if(e.kind === "sub"){
      return [
        e.kind,
        e.side,
        normalizedTeamText(e.playerIn),
        normalizedTeamText(e.playerOut),
        String(e.minute || "")
      ].join("|");
    }

    return [
      e.kind,
      e.side,
      normalizedTeamText(e.player),
      String(e.minute || "")
    ].join("|");
  }

  function specialEventsFromSummaryDeep(summary, ev, homeId){
    const events = [];
    const seenObjects = new WeakSet();

    function walk(node,depth=0){
      if(!node || typeof node !== "object" || depth > 8) return;
      if(seenObjects.has(node)) return;
      seenObjects.add(node);

      if(!Array.isArray(node)){
        const kind = playSpecialKind(node);
        const txt = playText(node).toLowerCase();
        const eventLike =
          !!node?.clock ||
          !!node?.time ||
          !!node?.athletesInvolved ||
          !!node?.participants ||
          txt.includes("is shown the yellow card") ||
          txt.includes("is shown the red card") ||
          txt.includes("penalty saved") ||
          txt.includes("penalty is saved") ||
          txt.includes("penalty was saved") ||
          txt.includes("misses a penalty") ||
          txt.includes("penalty missed") ||
          (txt.includes("substitution") && txt.includes("replaces"));

        if(kind && eventLike){
          const parsed = specialEventFromPlay(node,ev,homeId);
          if(parsed) events.push(parsed);
        }
      }

      if(Array.isArray(node)){
        node.forEach(x=>walk(x,depth+1));
      }else{
        for(const value of Object.values(node)){
          if(value && typeof value === "object") walk(value,depth+1);
        }
      }
    }

    walk(summary);

    const unique = new Map();
    events.forEach(e=>unique.set(specialEventKey(e),e));
    return [...unique.values()];
  }

  async function specialPlaysFor(ev, homeId){
    const id = String(ev.id);
    if(cardPlaysCache.has(id)) return cardPlaysCache.get(id);

    const promise = (async()=>{
      const compId = ev?.competitions?.[0]?.id || ev.id;
      try{
        const data = await getJson(
          `${CORE}/events/${encodeURIComponent(ev.id)}/competitions/${encodeURIComponent(compId)}/plays?limit=300`
        );

        const plays =
          data?.items ||
          data?.plays ||
          data?.events ||
          [];

        const events = [];
        if(Array.isArray(plays)){
          for(const play of plays){
            const parsed = specialEventFromPlay(play,ev,homeId);
            if(parsed) events.push(parsed);
          }
        }

        const unique = new Map();
        events.forEach(e=>unique.set(specialEventKey(e),e));
        return [...unique.values()];
      }catch{
        return [];
      }
    })();

    cardPlaysCache.set(id,promise);
    try{
      return await promise;
    }catch{
      cardPlaysCache.delete(id);
      return [];
    }
  }
  function personDisplayName(person){
    if(!person) return "";
    if(typeof person === "string") return person.trim();

    const p = person?.athlete || person?.person || person;

    const direct =
      p?.displayName ||
      p?.fullName ||
      p?.shortName ||
      p?.name ||
      "";

    if(direct) return String(direct).trim();

    const combined = [p?.firstName,p?.lastName]
      .filter(Boolean)
      .join(" ")
      .trim();

    return combined;
  }

  function teamIdFromObject(obj){
    const direct =
      obj?.team?.id ||
      obj?.id ||
      obj?.teamId ||
      "";
    if(direct) return String(direct);

    const ref = String(obj?.team?.$ref || obj?.$ref || "");
    const m = ref.match(/\/teams\/(\d+)/);
    return m ? m[1] : "";
  }

  function normalizeFormation(value){
    if(value == null) return "";

    if(typeof value === "object"){
      value =
        value?.displayValue ??
        value?.displayName ??
        value?.name ??
        value?.value ??
        "";
    }

    let clean = String(value || "").trim();
    if(!clean) return "";

    // ESPN/feeds sometimes expose a compact numeric formation, e.g. 4231.
    if(/^\d{3,5}$/.test(clean)){
      clean = clean.split("").join("-");
    }

    return /^\d(?:-\d){2,4}$/.test(clean) ? clean : "";
  }

  function formationFromContainer(container){
    if(!container || typeof container !== "object") return "";
    const candidates = [
      container?.formation,
      container?.formationName,
      container?.formationText,
      container?.team?.formation
    ];
    for(const c of candidates){
      const value = normalizeFormation(c);
      if(value) return value;
    }
    return "";
  }

  function flattenRosterEntries(roster){
    if(!Array.isArray(roster)) return [];

    const out = [];
    for(const item of roster){
      if(!item) continue;

      if(Array.isArray(item?.athletes)){
        for(const nested of item.athletes){
          out.push(nested);
        }
      }else{
        out.push(item);
      }
    }
    return out;
  }

  function lineupPlayer(entry){
    const athlete = entry?.athlete || entry?.player || entry;
    const name = personDisplayName(athlete);
    if(!name) return null;

    const jersey = String(
      entry?.jersey ??
      athlete?.jersey ??
      entry?.shirtNumber ??
      athlete?.shirtNumber ??
      ""
    ).trim();

    const starter =
      entry?.starter === true ||
      entry?.isStarter === true ||
      String(entry?.status?.type || "").toLowerCase() === "starter";

    const positionObj =
      entry?.position ||
      athlete?.position ||
      {};

    // Keep every useful ESPN position label instead of only the first one.
    // Different matches can expose D/M/F, CB/RB/LB, or full names.
    const position = [
      positionObj?.abbreviation,
      positionObj?.name,
      positionObj?.displayName,
      entry?.positionName,
      athlete?.position?.abbreviation,
      athlete?.position?.name,
      athlete?.position?.displayName
    ]
      .filter(Boolean)
      .map(String)
      .join(" ")
      .trim();

    const tacticalOrder = Number(
      entry?.formationPlace ??
      entry?.formationPosition ??
      entry?.order ??
      athlete?.formationPlace ??
      NaN
    );

    return {
      name,
      jersey,
      starter,
      position,
      tacticalOrder:Number.isFinite(tacticalOrder) ? tacticalOrder : null
    };
  }

  function fallbackTeamContainer(summary, teamId){
    const id = String(teamId || "");
    const candidates = [
      ...(summary?.boxscore?.teams || []),
      ...(summary?.header?.competitions?.[0]?.competitors || [])
    ];

    return candidates.find(item => teamIdFromObject(item) === id) || null;
  }

  function lineupSideFromSummary(summary, teamId){
    const id = String(teamId || "");
    const blocks = Array.isArray(summary?.rosters) ? summary.rosters : [];
    const block = blocks.find(r => teamIdFromObject(r) === id) || null;
    const fallback = fallbackTeamContainer(summary,id);

    const rawRoster = flattenRosterEntries(
      block?.roster ||
      block?.athletes ||
      []
    );

    const players = rawRoster
      .map(lineupPlayer)
      .filter(Boolean);

    let starters = players.filter(p=>p.starter);
    let bench = players.filter(p=>!p.starter);

    // If starter flags are absent but the match roster is ordered,
    // use the first 11 only when the feed clearly contains >11 players.
    const hasStarterFlags = rawRoster.some(
      x => x?.starter === true || x?.starter === false || x?.isStarter === true || x?.isStarter === false
    );

    if(!hasStarterFlags && players.length > 11){
      starters = players.slice(0,11);
      bench = players.slice(11);
    }

    const formation =
      formationFromContainer(block) ||
      formationFromContainer(fallback);

    return {
      starters,
      bench,
      formation
    };
  }

  function lineupsFromSummary(summary, homeId, awayId){
    return {
      home:lineupSideFromSummary(summary,homeId),
      away:lineupSideFromSummary(summary,awayId)
    };
  }

  function hasLineupData(lineups){
    return !!(
      lineups?.home?.starters?.length ||
      lineups?.away?.starters?.length ||
      lineups?.home?.bench?.length ||
      lineups?.away?.bench?.length
    );
  }

  async function summaryFor(ev){
    if(summaryCache.has(ev.id)) return summaryCache.get(ev.id);
    const promise = getJson(`${SITE}/summary?event=${encodeURIComponent(ev.id)}`);
    summaryCache.set(ev.id,promise);
    try{
      return await promise;
    }catch(e){
      summaryCache.delete(ev.id);
      throw e;
    }
  }

  async function detailsFor(ev, homeId, awayId){
    if(matchDetailsCache.has(ev.id)) return matchDetailsCache.get(ev.id);

    try{
      const sm = await summaryFor(ev);
      const lineups = lineupsFromSummary(sm,homeId,awayId);

      // Coach data must be match-specific.
      // If ESPN does not provide it in the match summary, we leave it blank
      // instead of using the team's current coach for an older fixture.
      const status = stateOf(ev);

      if(status === "pre"){
        const value = {events:[],lineups};
        matchDetailsCache.set(ev.id,value);
        return value;
      }

      const baseEvents = extractMatchEvents(sm,homeId);

      // Per cartellini, rigori sbagliati e sostituzioni integriamo anche il play-by-play ESPN.
      const [deepSpecials, playSpecials] = await Promise.all([
        Promise.resolve(specialEventsFromSummaryDeep(sm,ev,homeId)),
        specialPlaysFor(ev,homeId)
      ]);

      const combined = [...baseEvents];
      const seenSpecials = new Set(
        combined
          .filter(e=>
            e.kind==="yellow" ||
            e.kind==="red" ||
            e.kind==="penmiss" ||
            e.kind==="pensaved" ||
            e.kind==="sub"
          )
          .map(specialEventKey)
      );

      for(const item of [...deepSpecials,...playSpecials]){
        const key = specialEventKey(item);
        if(!seenSpecials.has(key)){
          combined.push(item);
          seenSpecials.add(key);
        }
      }

      const value = {events:combined,lineups};
      matchDetailsCache.set(ev.id,value);
      return value;
    }catch{
      return {
        events:[],
        lineups:{
          home:{starters:[],bench:[],formation:""},
          away:{starters:[],bench:[],formation:""}
        }
      };
    }
  }

  async function matchModel(ev){
    const comp = ev?.competitions?.[0];
    const cs = comp?.competitors || [];
    const home = cs.find(x=>x.homeAway==="home") || cs[0];
    const away = cs.find(x=>x.homeAway==="away") || cs[1];
    const status = stateOf(ev);

    let matchEvents = [];
    let lineups = {
      home:{starters:[],bench:[],formation:""},
      away:{starters:[],bench:[],formation:""}
    };

    if(home && away){
      const details = await detailsFor(ev,home.id,away.id);
      matchEvents = details.events || [];
      lineups = details.lineups || lineups;
    }

    const score = c => {
      const n = Number.parseInt(c?.score,10);
      return Number.isFinite(n) ? n : 0;
    };

    let statusText = "Da giocare";
    if(status === "done") statusText = "Finale";
    if(status === "live"){
      const t = ev?.status?.type || {};
      const typeName = String(t?.name || "");
      const description = String(t?.description || "");
      const isHalftime =
        typeName === "STATUS_HALFTIME" ||
        /^half[\s-]?time$/i.test(description) ||
        /^halftime$/i.test(description);

      statusText = isHalftime
        ? "Intervallo"
        : (ev?.status?.displayClock || t?.shortDetail || t?.detail || "LIVE");
    }

    return {
      id:ev.id,
      date:ev.date,
      status,
      statusText,
      home:{
        id:home?.id,
        name:teamName(home),
        logo:teamLogo(home),
        score:score(home),
        color:teamPrimaryColor(home)
      },
      away:{
        id:away?.id,
        name:teamName(away),
        logo:teamLogo(away),
        score:score(away),
        color:teamPrimaryColor(away)
      },
      matchEvents,
      lineups
    };
  }

  function eventMinuteValue(minute){
    const clean = String(minute || "");
    const match = clean.match(/(\d+)(?:\D*\+(\d+))?/);
    if(!match) return Number.MAX_SAFE_INTEGER;

    const base = Number(match[1]) || 0;
    const extra = Number(match[2]) || 0;
    return base * 100 + extra;
  }

  function soccerBallIcon(extraClass=""){

  }

  function missedPenaltyIcon(){

      <i class="ph ph-x" aria-hidden="true"></i>
    </span>`;
  }

  function savedPenaltyIcon(){

  function substitutionIcon(){

      <i class="ph ph-arrow-up sub-up" aria-hidden="true"></i>

    </span>`;

  function assistPassIcon(){

  function eventIcon(e){

    }

    if(e.kind === "sub") return substitutionIcon();
    return `<span class="event-card yellow" aria-label="Cartellino giallo"></span>`;

  function eventInfoHtml(e){

      return `

  function eventMinuteHtml(e){

    if(e.kind === "goal" && e.penalty) tag = " (Rig.)";
    if(e.kind === "penmiss" || e.kind === "pensaved") tag = " (Rig.)";

  function eventsPanelHtml(m,timeline){
    if(m.status === "pre"){
      return `<div class="detail-message">Partita non iniziata.</div>`;
    }

      return `<div class="detail-message">Nessun evento disponibile.</div>`;

          <div class="timeline-icon">${eventIcon(e)}</div>

          ${e.side === "home"
            ? `<div class="timeline-minute home">${eventMinuteHtml(e)}</div>`
            : `<div></div>`}

          <div class="timeline-info away">
            ${e.side === "away" ? eventInfoHtml(e) : ""}
          </div>
        </div>
      `).join("")}
    </div>`;
  }

  function lineupRowsHtml(homePlayers,awayPlayers){
    const max = Math.max(homePlayers?.length || 0,awayPlayers?.length || 0);
    if(!max) return "";

    const rows = [];
    for(let i=0;i<max;i++){
      const h = homePlayers?.[i] || null;

      rows.push(`<div class="lineup-row">

          ` : ""}

          ${a ? `

            <span class="lineup-number">${esc(a.jersey || "")}</span>
          ` : ""}
        </div>
      </div>`);
    }
    return rows.join("");
  }

  function formationNumbers(value){
    const clean = normalizeFormation(value);
    if(!clean) return [];

    const nums = clean
      .split("-")
      .map(Number)
      .filter(n=>Number.isFinite(n) && n>0);

    return nums.reduce((sum,n)=>sum+n,0) === 10 ? nums : [];
  }

  function normalizedPositionText(player){
    return String(player?.position || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[._/,-]+/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function hasPositionToken(text,tokens){
    const padded = ` ${text} `;
    return tokens.some(token=>{
      const t = String(token).toLowerCase();
      return padded.includes(` ${t} `);
    });
  }

  function playerPositionProfile(player){
    const text = normalizedPositionText(player);

    // Neutral fallback: formation + roster order can still place the player,
    // but a real ESPN position always wins by a wide margin.
    const profile = {
      def:12,
      mid:12,
      att:12,
      vertical:.5,
      side:0,
      known:false
    };

    if(!text) return profile;

    // Goalkeeper
    if(
      hasPositionToken(text,["g","gk","goalkeeper","keeper","portiere"]) ||
      text.includes("goalkeeper") ||
      text.includes("portiere")
    ){
      return {
        def:0,mid:0,att:0,vertical:0,side:0,known:true,gk:true
      };
    }

    // Horizontal side preference.
    // -1 = left, 0 = centre, +1 = right.
    if(
      /\b(lb|lwb|lm|lw)\b/.test(text) ||
      text.includes("left back") ||
      text.includes("left wing") ||
      text.includes("sinistro")
    ){
      profile.side = -1;
    }else if(
      /\b(rb|rwb|rm|rw)\b/.test(text) ||
      text.includes("right back") ||
      text.includes("right wing") ||
      text.includes("destro")
    ){
      profile.side = 1;
    }

    // Central defenders: strongest defensive signal.
    if(
      /\b(cb|cd|dc)\b/.test(text) ||
      text.includes("centre back") ||
      text.includes("center back") ||
      text.includes("central defender") ||
      text.includes("difensore centrale")
    ){
      Object.assign(profile,{
        def:120,mid:4,att:0,vertical:.05,known:true
      });
      return profile;
    }

    // Full-backs: defenders first, but can spill into midfield in systems
    // with wing-backs if the formation requires it.
    if(
      /\b(lb|rb|fb)\b/.test(text) ||
      text.includes("full back") ||
      text.includes("terzino")
    ){
      Object.assign(profile,{
        def:108,mid:34,att:2,vertical:.16,known:true
      });
      return profile;
    }

    // Wing-backs are deliberately more flexible between DEF and MID.
    if(
      /\b(lwb|rwb|wb)\b/.test(text) ||
      text.includes("wing back")
    ){
      Object.assign(profile,{
        def:74,mid:92,att:10,vertical:.30,known:true
      });
      return profile;
    }

    // Defensive midfielders.
    if(
      /\b(cdm|dm|md)\b/.test(text) ||
      text.includes("defensive midfield") ||
      text.includes("holding midfield") ||
      text.includes("mediano")
    ){
      Object.assign(profile,{
        def:28,mid:116,att:8,vertical:.26,known:true
      });
      return profile;
    }

    // Attacking midfield / trequartista.
    if(
      /\b(cam|am)\b/.test(text) ||
      text.includes("attacking midfield") ||
      text.includes("trequartista")
    ){
      Object.assign(profile,{
        def:2,mid:108,att:50,vertical:.78,known:true
      });
      return profile;
    }

    // Wide midfielders.
    if(
      /\b(lm|rm)\b/.test(text) ||
      text.includes("left midfield") ||
      text.includes("right midfield")
    ){
      Object.assign(profile,{
        def:8,mid:112,att:36,vertical:.58,known:true
      });
      return profile;
    }

    // Central midfielders.
    if(
      /\b(cm|mc)\b/.test(text) ||
      text.includes("central midfield") ||
      text.includes("centrocampista centrale")
    ){
      Object.assign(profile,{
        def:10,mid:120,att:20,vertical:.48,known:true
      });
      return profile;
    }

    // Wingers: usually the most advanced line in a 4-3-3, but can be
    // attacking midfielders in shapes such as 4-2-3-1.
    if(
      /\b(lw|rw|winger|w)\b/.test(text) ||
      text.includes("left wing") ||
      text.includes("right wing") ||
      text.includes("ala")
    ){
      Object.assign(profile,{
        def:1,mid:58,att:106,vertical:.84,known:true
      });
      return profile;
    }

    // Strikers / centre-forwards.
    if(
      /\b(st|cf|ss)\b/.test(text) ||
      text.includes("striker") ||
      text.includes("centre forward") ||
      text.includes("center forward") ||
      text.includes("second striker") ||
      text.includes("forward centre") ||
      text.includes("punta") ||
      text.includes("attaccante centrale")
    ){
      Object.assign(profile,{
        def:0,mid:8,att:122,vertical:.98,known:true
      });
      return profile;
    }

    // Generic ESPN broad roles.
    if(
      hasPositionToken(text,["d","df","def"]) ||
      text.includes("defender") ||
      text.includes("difensore")
    ){
      Object.assign(profile,{
        def:104,mid:18,att:1,vertical:.12,known:true
      });
      return profile;
    }

    if(
      hasPositionToken(text,["m","mf","mid"]) ||
      text.includes("midfielder") ||
      text.includes("centrocampista")
    ){
      Object.assign(profile,{
        def:12,mid:106,att:18,vertical:.5,known:true
      });
      return profile;
    }

    if(
      hasPositionToken(text,["f","fw","att"]) ||
      text.includes("forward") ||
      text.includes("attaccante")
    ){
      Object.assign(profile,{
        def:0,mid:16,att:110,vertical:.9,known:true
      });
      return profile;
    }

    return profile;
  }

  function isGoalkeeper(player){
    return !!playerPositionProfile(player).gk;
  }

  function playerSortOrder(player,index){
    return Number.isFinite(player?.tacticalOrder)
      ? player.tacticalOrder
      : 1000 + index;
  }

  function orderedStartersForPitch(starters){
    const list = [...(starters || [])];
    if(!list.length) return [];

    const indexed = list.map((player,index)=>({player,index}));

    // Tactical order is now only a secondary ordering signal.
    // We no longer let it decide the player's tactical line by itself.
    indexed.sort((a,b)=>
      playerSortOrder(a.player,a.index) - playerSortOrder(b.player,b.index)
    );

    return indexed.map(x=>x.player);
  }

  function pitchGroupScore(player,group,orderHint){
    const p = playerPositionProfile(player);
    let score =
      group === "def" ? p.def :
      group === "mid" ? p.mid :
      p.att;

    // Weak formation-order hint only when ESPN exposes a usable order.
    // Position remains the dominant signal.
    if(Number.isFinite(orderHint)){
      if(group === "def" && orderHint < .34) score += 8;
      if(group === "mid" && orderHint >= .22 && orderHint <= .78) score += 8;
      if(group === "att" && orderHint > .66) score += 8;
    }

    return score;
  }

  function assignPitchGroups(players,defCount,midCount,attCount){
    const n = players.length;
    if(n !== defCount + midCount + attCount) return null;

    const withOrder = players.filter(p=>Number.isFinite(p?.tacticalOrder));
    const orderedValues = withOrder
      .map(p=>p.tacticalOrder)
      .sort((a,b)=>a-b);

    const orderHintFor = player=>{
      if(!Number.isFinite(player?.tacticalOrder) || orderedValues.length < 7){
        return null;
      }
      const rank = orderedValues.indexOf(player.tacticalOrder);
      return orderedValues.length <= 1 ? .5 : rank/(orderedValues.length-1);
    };

    const memo = new Map();

    function solve(i,d,m,a){
      if(i === n){
        return (d===defCount && m===midCount && a===attCount)
          ? {score:0,groups:[]}
          : null;
      }

      const key = `${i}|${d}|${m}|${a}`;
      if(memo.has(key)) return memo.get(key);

      const player = players[i];
      const hint = orderHintFor(player);
      let best = null;

      const options = [
        ["def",d < defCount,d+1,m,a],
        ["mid",m < midCount,d,m+1,a],
        ["att",a < attCount,d,m,a+1]
      ];

      for(const [group,allowed,nd,nm,na] of options){
        if(!allowed) continue;

        const tail = solve(i+1,nd,nm,na);
        if(!tail) continue;

        const total = pitchGroupScore(player,group,hint) + tail.score;
        if(!best || total > best.score){
          best = {
            score:total,
            groups:[group,...tail.groups]
          };
        }
      }

      memo.set(key,best);
      return best;
    }

    const solved = solve(0,0,0,0);
    if(!solved) return null;

    const groups = {def:[],mid:[],att:[]};
    players.forEach((player,index)=>{
      groups[solved.groups[index]].push(player);
    });

    return groups;
  }

  function horizontalPlayerSort(players){
    return [...players]
      .map((player,index)=>({
        player,
        index,
        profile:playerPositionProfile(player)
      }))
      .sort((a,b)=>{
        if(a.profile.side !== b.profile.side){
          return a.profile.side - b.profile.side;
        }
        return playerSortOrder(a.player,a.index) - playerSortOrder(b.player,b.index);
      })
      .map(x=>x.player);
  }

  function splitMidfieldLines(players,lineCounts){
    const sorted = [...players]
      .map((player,index)=>({
        player,
        index,
        profile:playerPositionProfile(player)
      }))
      .sort((a,b)=>{
        if(a.profile.vertical !== b.profile.vertical){
          return a.profile.vertical - b.profile.vertical;
        }
        return playerSortOrder(a.player,a.index) - playerSortOrder(b.player,b.index);
      })
      .map(x=>x.player);

    const lines = [];
    let cursor = 0;

    for(const count of lineCounts){
      const line = sorted.slice(cursor,cursor+count);
      lines.push(horizontalPlayerSort(line));
      cursor += count;
    }

    return cursor === players.length ? lines : null;
  }

  function pitchDataForSide(side){
    const formation = formationNumbers(side?.formation);
    const starters = orderedStartersForPitch(side?.starters);

    if(formation.length < 3 || starters.length < 11){
      return null;
    }

    // Use an ESPN goalkeeper whenever possible, not simply roster item #1.
    let keeperIndex = starters.findIndex(isGoalkeeper);
    if(keeperIndex < 0) keeperIndex = 0;

    const keeper = starters[keeperIndex];
    const fieldPlayers = starters
      .filter((_,index)=>index !== keeperIndex)
      .slice(0,10);

    if(fieldPlayers.length !== 10) return null;

    const defCount = formation[0];
    const attCount = formation[formation.length-1];
    const middleLineCounts = formation.slice(1,-1);
    const midCount = middleLineCounts.reduce((sum,n)=>sum+n,0);

    if(defCount + midCount + attCount !== 10) return null;

    return {
      keeper,
      fieldPlayers,
      formation,
      defCount,
      midCount,
      attCount,
      middleLineCounts
    };
  }

  function buildPitchSide(side){
    const data = pitchDataForSide(side);
    if(!data) return null;

    const groups = assignPitchGroups(
      data.fieldPlayers,
      data.defCount,
      data.midCount,
      data.attCount
    );

    if(!groups) return null;

    const midfieldLines = splitMidfieldLines(
      groups.mid,
      data.middleLineCounts
    );

    if(!midfieldLines) return null;

    const lines = [
      horizontalPlayerSort(groups.def),
      ...midfieldLines,
      horizontalPlayerSort(groups.att)
    ];

    if(lines.reduce((sum,line)=>sum+line.length,0) !== 10){
      return null;
    }

    return {
      keeper:data.keeper,
      lines,
      formation:data.formation,
      starters:[data.keeper,...lines.flat()]
    };
  }

  function evenlySpacedX(count,index){
    if(count <= 1) return 50;
    const edge = count >= 5 ? 10 : count === 4 ? 13 : 18;
    const usable = 100 - edge*2;
    return edge + (usable * index / (count-1));
  }

  function pitchYPositions(lineCount,home){
    const keeper = home ? 7.5 : 92.5;
    const nearHalf = home ? 43 : 57;
    const firstLine = home ? 18 : 82;

    if(lineCount <= 1){
      return {keeper,lines:[nearHalf]};
    }

    const lines = [];
    for(let i=0;i<lineCount;i++){
      const t = i/(lineCount-1);
      lines.push(firstLine + (nearHalf-firstLine)*t);
    }

    return {keeper,lines};
  }

  function pitchPlayerHtml(player,x,y,colorSpec){
    if(!player) return "";

    return `<div
      class="pitch-player"
      style="
        left:${x.toFixed(2)}%;
        top:${y.toFixed(2)}%;
        --team-color:${esc(colorSpec.color)};
        --team-text:${esc(colorSpec.text)};
        --team-border:${esc(colorSpec.border)};
      "
    >
      <span class="pitch-player-dot">${esc(player.jersey || "•")}</span>
      <span class="pitch-player-name">${esc(shortPlayerName(player.name))}</span>
    </div>`;
  }

  function pitchSidePlayersHtml(side,home,color){
    const data = buildPitchSide(side);
    if(!data) return "";

    const colorSpec = colorPresentation(color);
    const pos = pitchYPositions(data.lines.length,home);
    const chunks = [];

    chunks.push(
      pitchPlayerHtml(data.keeper,50,pos.keeper,colorSpec)
    );

    data.lines.forEach((line,lineIndex)=>{
      line.forEach((player,playerIndex)=>{
        chunks.push(
          pitchPlayerHtml(
            player,
            evenlySpacedX(line.length,playerIndex),
            pos.lines[lineIndex],
            colorSpec
          )
        );
      });
    });

    return chunks.join("");
  }

  function startersPitchHtml(m){
    const homePitch = buildPitchSide(m?.lineups?.home);
    const awayPitch = buildPitchSide(m?.lineups?.away);

    if(!homePitch || !awayPitch) return "";

    return `<div
      class="soccer-pitch"

  function formationsPanelHtml(m){
    const lineups = m?.lineups || {};
    const home = lineups?.home || {};
    const away = lineups?.away || {};

    if(!hasLineupData(lineups)){

      ? `<div class="lineup-heading">Panchina</div>

         </div>`

      ${formationRow}

  }

  function detailTabsHtml(m,timeline,activeDetailTab){
    const eventsActive = activeDetailTab === "events";
    const formationsActive = activeDetailTab === "formations";

    return `<div class="match-details">
      <div class="detail-tabs" role="tablist" aria-label="Dettagli partita">
