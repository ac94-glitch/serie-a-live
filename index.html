<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#f4f6f8">
  <meta name="color-scheme" content="light dark">
  <title>Serie A Live</title>
  <link rel="icon" type="image/png" sizes="32x32" href="seriea-live-v3-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="seriea-live-v3-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="seriea-live-v3-180.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="seriea-live-v3-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://site.api.espn.com" crossorigin>
  <link rel="preconnect" href="https://sports.core.api.espn.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Serie A Live">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="app-version" content="3.6.6">
  <script>
    (() => {
      const key = "serie-a-live-theme";
      let theme = "light";

      try {
        const saved = localStorage.getItem(key);
        theme = (saved === "light" || saved === "dark")
          ? saved
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (_) {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      document.documentElement.classList.add(
        theme === "dark" ? "theme-dark" : "theme-light"
      );
      document.documentElement.style.colorScheme = theme;

      const meta = document.getElementById("themeColor");
      if (meta) meta.content = theme === "dark" ? "#0b0f14" : "#f4f6f8";
    })();
  </script>
  <style>
    :root{
      --bg:#f4f6f8;
      --card:#ffffff;
      --ink:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#0b63ce;
      --accent-soft:#eaf3ff;
      --live:#d92d20;
      --green:#067647;
      --nav:#0b1220;
      --surface-soft:#fcfcfd;
      --surface-muted:#f9fafb;
      --skeleton:#e7ebf0;
      --shadow:0 5px 18px rgba(16,24,40,.06);
    }
    *{box-sizing:border-box;touch-action:manipulation}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      min-height:100vh;
      padding-bottom:calc(94px + env(safe-area-inset-bottom));
    }
    button{font:inherit}
    .top{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(244,246,248,.94);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(228,231,236,.85);
    }
    header{
      max-width:760px;
      margin:0 auto;
      padding:15px 16px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .header-actions{
      display:flex;
      align-items:center;
      gap:9px;
    }
    .refresh-btn{
      appearance:none;
      width:36px;
      height:36px;
      flex:0 0 36px;
      display:grid;
      place-items:center;
      padding:0;
      border:1px solid rgba(208,213,221,.9);
      border-radius:12px;
      background:rgba(255,255,255,.78);
      color:#344054;
      box-shadow:0 2px 8px rgba(16,24,40,.06);
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .refresh-btn:active{
      transform:scale(.96);
    }
    .refresh-btn:disabled{
      opacity:.72;
    }
    .refresh-btn i{
      display:block;
      font-size:19px;
      line-height:1;
    }
    .refresh-btn.refreshing i{
      animation:spin .8s linear infinite;
    }
    h1{
      margin:0;
      font-size:24px;
      line-height:1;
      letter-spacing:-.03em;
    }
    .season{
      margin-top:5px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }
    .updated{
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:25px;
      padding:3px 7px;
      border:1px solid rgba(208,213,221,.72);
      border-radius:999px;
      background:rgba(255,255,255,.54);
      color:var(--muted);
      font-size:10px;
      font-weight:650;
      white-space:nowrap;
      text-align:right;
    }
    .updated::before{
      content:"";
      width:5px;
      height:5px;
      flex:0 0 5px;
      border-radius:50%;
      background:#98a2b3;
    }
    main{
      max-width:760px;
      margin:0 auto;
      padding:14px 12px 22px;
    }
    #content,
    #content *{
      touch-action:pan-y;
    }
    html,
    body{
      overscroll-behavior-x:none;
    }
    #content.round-swipe-feedback-left{
      animation:roundSwipeLeft .16s ease-out;
    }
    #content.round-swipe-feedback-right{
      animation:roundSwipeRight .16s ease-out;
    }
    @keyframes roundSwipeLeft{
      0%{transform:translateX(0);opacity:1}
      55%{transform:translateX(-16px);opacity:.84}
      100%{transform:translateX(0);opacity:1}
    }
    @keyframes roundSwipeRight{
      0%{transform:translateX(0);opacity:1}
      55%{transform:translateX(16px);opacity:.84}
      100%{transform:translateX(0);opacity:1}
    }
    .round-nav{
      display:grid;
      grid-template-columns:46px 1fr 46px;
      gap:8px;
      align-items:center;
      margin-bottom:10px;
    }
    .round-btn,.round-center,.today-btn{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:13px;
      min-height:44px;
      color:var(--ink);
      box-shadow:var(--shadow);
    }
    .round-btn{
      font-size:25px;
      line-height:1;
      font-weight:400;
    }
    .round-btn:disabled{opacity:.3}
    .round-center{
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.02em;
    }
    .today-wrap{text-align:center;margin:0 0 14px}
    .today-btn{
      min-height:34px;
      padding:0 13px;
      color:var(--accent);
      font-size:12px;
      font-weight:700;
      box-shadow:none;
    }
    .date-label{
      margin:18px 4px 8px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.07em;
    }
    .match{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      margin-bottom:10px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .match.live{border-color:#f2b8b5}
    .match-main{
      display:grid;
      grid-template-columns:1fr 78px 1fr;
      align-items:center;
      gap:5px;
      padding:15px 12px 12px;
    }
    .team{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
      text-align:center;
      min-width:0;
      font-size:13px;
      font-weight:750;
    }
    .team img{
      width:38px;height:38px;object-fit:contain;
    }
    .team-name{
      width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .scorebox{text-align:center}
    .score{
      font-size:27px;
      font-weight:850;
      letter-spacing:-.04em;
      line-height:1.05;
    }
    .ko{
      font-size:20px;
      font-weight:800;
      line-height:1.1;
    }
    .status{
      display:inline-block;
      margin-top:6px;
      padding:3px 6px;
      border-radius:99px;
      background:#f2f4f7;
      color:var(--muted);
      font-size:9.5px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.03em;
      white-space:nowrap;
    }
    .status.live{
      background:#fee4e2;
      color:var(--live);
    }
    .status.done{color:var(--green);background:#ecfdf3}
    .events{
      position:relative;
      border-top:1px solid var(--line);
      padding:14px 12px 16px;
      background:var(--surface-soft);
    }
    .events::before{
      content:"";
      position:absolute;
      top:16px;
      bottom:16px;
      left:50%;
      width:1px;
      background:#d9dee7;
      transform:translateX(-50%);
    }
    .timeline-row{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:minmax(0,1fr) 42px 30px 42px minmax(0,1fr);
      align-items:center;
      min-height:40px;
      margin-bottom:7px;
    }
    .timeline-row:last-child{margin-bottom:0}
    .timeline-info{
      min-width:0;
      font-size:13.5px;
      line-height:1.3;
      font-weight:400;
    }
    .timeline-info.home{
      grid-column:1;
      text-align:right;
      padding-right:6px;
    }
    .timeline-info.away{
      grid-column:5;
      text-align:left;
      padding-left:6px;
    }
    .timeline-main{
      color:var(--ink);
      font-weight:400;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .timeline-period{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      gap:9px;
      margin:2px 0 11px;
      color:var(--muted);
      font-size:10px;
      font-weight:850;
      letter-spacing:.065em;
      text-transform:uppercase;
    }

    .timeline-period.second{
      margin-top:2px;
    }

    .timeline-period.interval{
      margin:13px 0;
      color:var(--ink);
    }

    .timeline-period.interval span{
      display:inline-flex;
      align-items:center;
      gap:5px;
      background:var(--card);
      font-size:9.5px;
    }

    .timeline-period-score{
      font-weight:900;
      font-variant-numeric:tabular-nums;
      letter-spacing:0;
    }

    .timeline-period::before,
    .timeline-period::after{
      content:"";
      height:.5px;
      flex:1 1 auto;
      background:var(--line);
    }

    .timeline-period span{
      flex:0 0 auto;
      padding:2px 6px;
      border-radius:6px;
      background:var(--surface-soft);
    }
    .timeline-assist{
      display:block;
      color:var(--muted);
      font-size:12.5px;
      font-weight:400;
      line-height:1.2;
      margin-top:1px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .timeline-sub-in,
    .timeline-sub-out{
      display:block;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .timeline-sub-in{
      color:#168447;
      font-weight:400;
    }
    .timeline-sub-out{
      color:#c4322b;
      font-size:12.5px;
      font-weight:400;
      line-height:1.2;
      margin-top:1px;
    }
    .timeline-sub-arrow{
      display:none;
    }
    .timeline-minute{
      color:var(--muted);
      font-size:12.5px;
      font-weight:700;
      white-space:nowrap;
    }
    .timeline-minute.home{
      grid-column:4;
      text-align:left;
      padding-left:4px;
    }
    .timeline-minute.away{
      grid-column:2;
      text-align:right;
      padding-right:4px;
    }
    .timeline-icon{
      grid-column:3;
      display:grid;
      place-items:center;
      width:30px;
      min-width:30px;
      height:30px;
      line-height:1;
      background:transparent;
      border:0;
      box-shadow:none;
    }
    .event-ph{
      display:block;
      font-size:20px;
      line-height:1;
      color:#344054;
      font-weight:400;
    }
    .event-ph.own-goal{
      color:#d92d20;
    }
    .event-ph.pen-saved{
      color:#344054;
    }
    .event-ph.positive{
      color:#168447;
    }
    .event-ph.negative,
    .event-ph.injury{
      color:#c4322b;
    }

    .event-card{
      display:block;
      width:11px;
      height:17px;
      border-radius:2px;
      box-shadow:0 1px 2px rgba(16,24,40,.15);
    }
    .event-card.yellow{
      background:#f4c430;
      border:1px solid #d9aa00;
    }
    .event-card.red{
      background:#d92d20;
      border:1px solid #b42318;
    }


    .substitution-ph{
      font-size:20px;
      line-height:1;
      color:#667085;
      font-weight:400;
    }

    .injury-cross{
      position:relative;
      width:24px;
      height:24px;
      display:block;
    }
    .injury-cross::before,
    .injury-cross::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      background:#c4322b;
      border-radius:2px;
    }
    .injury-cross::before{
      width:15px;
      height:4px;
    }
    .injury-cross::after{
      width:4px;
      height:15px;
    }

    .assist-icon{
      display:inline-block;
      vertical-align:-2px;
      margin-right:3px;
      font-size:13px;
      line-height:1;
      color:currentColor;
      font-weight:400;
    }

    .pen-miss-wrap{
      position:relative;
      width:23px;
      height:23px;
      display:grid;
      place-items:center;
      color:#b42318;
    }
    .pen-miss-wrap .ph-soccer-ball{
      font-size:21px;
      line-height:1;
    }
    .pen-miss-wrap .ph-x{
      position:absolute;
      font-size:12px;
      line-height:1;
      color:#b42318;
      font-weight:700;
      text-shadow:
        0 0 2px #fff,
        0 0 2px #fff;
    }
    .timeline-event-note{
      display:block;
      margin-top:1px;
      color:var(--muted);
      font-size:12.5px;
      font-weight:400;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .timeline-event-note.var{
      font-weight:400;
      letter-spacing:0;
    }

    .timeline-event-note.danger{
      color:#c4322b;
    }

    .timeline-event-note.success{
      color:#168447;
    }

    .event-overlay-wrap{
      position:relative;
      width:24px;
      height:24px;
      display:grid;
      place-items:center;
    }

    .event-overlay-wrap > .event-ph{
      font-size:20px;
    }

    .event-overlay-mark{
      position:absolute;
      right:-1px;
      bottom:-1px;
      width:13px;
      height:13px;
      display:grid;
      place-items:center;
      border-radius:999px;
      background:var(--surface-soft);
      font-size:11px;
      line-height:1;
      font-weight:900;
    }

    .event-overlay-mark.reject{
      color:#c4322b;
    }

    .event-overlay-mark.accept{
      color:#168447;
    }

    .second-yellow-cards{
      position:relative;
      width:22px;
      height:23px;
      display:block;
    }

    .second-yellow-cards .event-card{
      position:absolute;
      top:3px;
      transform:none;
    }

    .second-yellow-cards .event-card:first-child{
      left:2px;
      z-index:1;
    }

    .second-yellow-cards .event-card:last-child{
      left:9px;
      z-index:2;
    }

    html.theme-dark .timeline-event-note.danger{
      color:#ff817a;
    }

    html.theme-dark .event-ph.injury{
      color:#ff817a;
    }

    html.theme-dark .timeline-event-note.success{
      color:#5dd39e;
    }

    html.theme-dark .event-overlay-mark{
      background:var(--surface-soft);
    }

    .minute{color:var(--muted);font-weight:650}
    .empty-events{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      padding:2px 0;
    }
    .events-toggle{
      appearance:none;
      width:100%;
      border:0;
      border-top:1px solid var(--line);
      background:transparent;
      color:var(--muted);
      min-height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      padding:8px 12px 9px;
      font:inherit;
      font-size:11.5px;
      font-weight:650;
      cursor:pointer;
    }
    .events-toggle:active{
      background:var(--surface-muted);
    }

    .match-details{
      border-top:1px solid var(--line);
      background:var(--surface-soft);
    }
    .detail-tabs{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      border-bottom:1px solid var(--line);
      padding:0 14px;
      background:#fff;
    }
    .detail-tab{
      appearance:none;
      position:relative;
      border:0;
      background:transparent;
      color:var(--muted);
      min-height:40px;
      padding:10px 6px 9px;
      font:inherit;
      font-size:10.5px;
      font-weight:750;
      letter-spacing:.025em;
      cursor:pointer;
    }
    .detail-tab.active{
      color:var(--ink);
    }
    .detail-tab.active::after{
      content:"";
      position:absolute;
      left:28%;
      right:28%;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:var(--ink);
    }
    .detail-panel{
      min-width:0;
    }
    .detail-message{
      padding:18px 14px 19px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }


    .match-stats{
      padding:15px 14px 18px;
    }
    .match-stat-row{
      padding:8px 0 9px;
    }
    .match-stat-row + .match-stat-row{
      border-top:1px solid rgba(228,231,236,.72);
    }
    .match-stat-head{
      display:grid;
      grid-template-columns:46px minmax(0,1fr) 46px;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
    }
    .match-stat-value{
      color:var(--ink);
      font-size:12px;
      font-weight:800;
      line-height:1;
    }
    .match-stat-value.home{text-align:left}
    .match-stat-value.away{text-align:right}
    .match-stat-label{
      min-width:0;
      text-align:center;
      color:var(--muted);
      font-size:10.5px;
      font-weight:700;
      line-height:1.15;
    }
    .match-stat-bars{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:3px;
      height:6px;
    }
    .match-stat-half{
      display:flex;
      align-items:stretch;
      overflow:hidden;
      border-radius:999px;
      background:#edf0f3;
    }
    .match-stat-half.home{justify-content:flex-end}
    .match-stat-half.away{justify-content:flex-start}
    .match-stat-fill{
      display:block;
      width:var(--stat-width,0%);
      min-width:0;
      border-radius:999px;
      background:var(--stat-color,#344054);
      box-shadow:inset 0 0 0 .75px rgba(16,24,40,.14);
      transition:width .18s ease-out;
    }

    

    /* Final Dark Mode override for standings readability */
    

    @media (prefers-reduced-motion:reduce){
      .match-stat-fill{transition:none}
    }

    .lineups{
      padding:14px 14px 17px;
    }
    .formation-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:24px;
      margin:0 0 13px;
      min-height:18px;
      align-items:center;
    }
    .formation-value{
      text-align:center;
      color:var(--ink);
      font-size:12px;
      font-weight:750;
    }
    .lineup-heading{
      margin:13px 0 8px;
      text-align:center;
      color:var(--muted);
      font-size:9.5px;
      font-weight:800;
      letter-spacing:.075em;
      text-transform:uppercase;
    }
    .lineup-heading:first-child{
      margin-top:0;
    }
    .lineup-grid{
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .lineup-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:20px;
      align-items:center;
      min-height:22px;
    }
    .lineup-player{
      min-width:0;
      display:flex;
      align-items:baseline;
      gap:6px;
      color:var(--ink);
      font-size:12px;
      line-height:1.3;
    }
    .lineup-player.home{
      justify-content:flex-start;
      text-align:left;
    }
    .lineup-player.away{
      justify-content:flex-end;
      text-align:right;
    }
    .lineup-number{
      flex:0 0 auto;
      min-width:16px;
      color:var(--muted);
      font-size:10.5px;
      font-weight:650;
    }
    .lineup-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .soccer-pitch{
      position:relative;
      width:100%;
      aspect-ratio:68 / 105;
      margin:3px auto 16px;
      overflow:hidden;
      border-radius:8px;
      background:#9fbd8d;
      border:1px solid rgba(27,55,35,.12);
    }
    .pitch-lines{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:1;
    }
    .pitch-player{

    .bottom-nav-frost{
      position:fixed;
      z-index:29;
      pointer-events:none;
      left:max(10px,env(safe-area-inset-left));
      right:max(10px,env(safe-area-inset-right));
      bottom:calc(6px + env(safe-area-inset-bottom));
      height:68px;
      border-radius:34px;

      /*
        Separate backdrop layer:
        Safari now blurs the page content BEFORE the actual glass bar is drawn.
        This makes text, scores and crests behind the bar visibly lose focus.
      */
      background:rgba(255,255,255,.16);
      backdrop-filter:
        blur(20px)
        saturate(125%)
        brightness(105%)
        contrast(92%);
      -webkit-backdrop-filter:
        blur(20px)
        saturate(125%)
        brightness(105%)
        contrast(92%);

      box-shadow:
        0 9px 28px rgba(16,24,40,.08);
    }

    .bottom-nav{
      position:fixed;
      z-index:30;
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      bottom:calc(8px + env(safe-area-inset-bottom));
      height:64px;
      padding:5px;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;
      overflow:hidden;
      isolation:isolate;

      /* iOS-style floating glass capsule */
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.44) 0%,
          rgba(250,251,252,.28) 52%,
          rgba(246,248,250,.22) 100%
        );
      border:1px solid rgba(255,255,255,.56);
      border-radius:32px;

      /* stronger frosted refraction: content remains visible but loses focus */
      backdrop-filter:
        blur(26px)
        saturate(165%)
        brightness(104%)
        contrast(96%);
      -webkit-backdrop-filter:
        blur(26px)
        saturate(165%)
        brightness(104%)
        contrast(96%);

      box-shadow:
        0 11px 32px rgba(16,24,40,.14),
        0 2px 8px rgba(16,24,40,.06),
        inset 0 1px 0 rgba(255,255,255,.94),
        inset 0 -1px 0 rgba(255,255,255,.24);
    }

    /* very restrained specular reflection, like the top edge of Liquid Glass */
    .bottom-nav::before{
      content:"";
      position:absolute;
      z-index:0;
      pointer-events:none;
      left:10px;
      right:10px;
      top:1px;
      height:46%;
      border-radius:30px 30px 50% 50%;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.56),
          rgba(255,255,255,.15) 44%,
          transparent 100%
        );
      opacity:.78;
    }

    /* faint lower refraction; not a visible border */
    .bottom-nav::after{
      content:"";
      position:absolute;
      z-index:0;
      pointer-events:none;
      inset:1px;
      border-radius:31px;
      background:rgba(255,255,255,.06);
      box-shadow:
        inset 0 -9px 20px rgba(255,255,255,.12),
        inset 0 0 0 .5px rgba(255,255,255,.26);
    }

    .tab{
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(29,29,31,.62);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      min-width:0;
      border-radius:27px;
      font-size:9.5px;
      font-weight:600;
      letter-spacing:-.01em;
      padding:5px 2px 4px;
      position:relative;
      z-index:1;
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      transition:
        color .20s ease,
        transform .16s ease;
    }

    /* selected Liquid Glass lens */
    .tab::before{
      content:"";
      position:absolute;
      z-index:-1;
      inset:0;
      border-radius:27px;
      opacity:0;
      transform:scale(.88);
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.98),
          rgba(255,255,255,.76)
        );
      border:1px solid rgba(255,255,255,.98);
      outline:1px solid rgba(60,60,67,.09);
      outline-offset:-1px;
      backdrop-filter:blur(18px) saturate(150%) brightness(110%);
      -webkit-backdrop-filter:blur(18px) saturate(150%) brightness(110%);
      box-shadow:
        0 5px 16px rgba(16,24,40,.15),
        0 1px 4px rgba(16,24,40,.08),
        inset 0 1px 0 rgba(255,255,255,1),
        inset 0 -1px 0 rgba(148,163,184,.16),
        inset 0 0 0 .5px rgba(255,255,255,.72);
      transition:
        opacity .20s ease,
        transform .22s cubic-bezier(.2,.8,.2,1);
    }

    .tab:active{
      transform:scale(.96);
    }

    .tab .ico{
      width:22px;
      height:22px;
      display:grid;
      place-items:center;
      line-height:1;
      transition:
        transform .20s cubic-bezier(.2,.8,.2,1),
        color .20s ease;
    }

    .tab .ico i{
      display:block;
      font-size:22px;
      line-height:1;
      font-weight:400;
    }

    .tab.active{
      /* iOS system-blue style selection tint */
      color:#007aff;
      text-shadow:0 1px 0 rgba(255,255,255,.72);
    }

    .tab.active::before{
      opacity:1;
      transform:scale(1);
    }

    .tab.active .ico{
      transform:translateY(-.5px) scale(1.02);
    }

    @supports not ((backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px))){
      .bottom-nav-frost{
        background:rgba(246,247,249,.82);
      }
      .bottom-nav{
        background:rgba(246,247,249,.98);
        border-color:rgba(208,213,221,.75);
      }
      .tab.active::before{
        background:rgba(255,255,255,.88);
      }
    }

    /* Final Dark Mode override for the floating tab bar.
       Must come after the normal Liquid Glass definitions. */
    

    @media (prefers-reduced-motion:reduce){

    /* V3.4 — Team sheet */
    body.team-sheet-open{
      position:fixed;
      width:100%;
      left:0;
      right:0;
      overflow:hidden;
      overscroll-behavior:none;
      touch-action:none;
    }

    body.team-sheet-open .team-sheet{
      touch-action:pan-y;
    }

    .team-open{
      -webkit-tap-highlight-color:transparent;
    }

    button.team-open{
      appearance:none;
      border:0;
      background:transparent;
      color:inherit;
      font:inherit;
      padding:0;
      margin:0;
    }

    .team.team-open{
      width:100%;
    }

    .club.team-open{
      width:100%;
      text-align:left;
    }

    .team-open:active{
      opacity:.66;
    }

    .team-sheet-backdrop{
      position:fixed;
      inset:0;
      z-index:80;
      display:flex;
      overscroll-behavior:none;
      align-items:flex-end;
      justify-content:center;
      padding:0;
      background:rgba(16,24,40,.28);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    .team-sheet-backdrop[hidden]{
      display:none;
    }

    .team-sheet{
      width:min(100%,760px);
      max-height:min(82vh,720px);
      overflow:auto;
      overscroll-behavior:contain;
      background:var(--card);
      border:1px solid var(--line);
      border-bottom:0;
      border-radius:24px 24px 0 0;
      box-shadow:0 -18px 48px rgba(16,24,40,.18);

        14px

      animation:teamSheetIn .22s cubic-bezier(.2,.75,.25,1);
    }

    @keyframes teamSheetIn{
      from{transform:translateY(22px);opacity:.72}
      to{transform:translateY(0);opacity:1}
    }

    .team-sheet-handle{
      width:38px;
      height:5px;
      margin:0 auto 7px;
      border-radius:999px;
      background:#d0d5dd;
    }

    .team-sheet-top{
      display:grid;
      grid-template-columns:48px minmax(0,1fr) 36px;
      gap:11px;
      align-items:center;
      min-height:54px;
      padding:3px 2px 11px;
    }

    .team-sheet-logo{
      width:46px;
      height:46px;
      object-fit:contain;
      display:block;
    }

    .team-sheet-name{
      min-width:0;
      font-size:20px;
      line-height:1.08;
      font-weight:900;
      letter-spacing:-.025em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .team-sheet-meta{
      margin-top:4px;
      color:var(--muted);
      font-size:10.5px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.055em;
    }

    .team-sheet-close{
      appearance:none;
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--surface-soft);
      color:var(--ink);
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    .team-sheet-close i{
      font-size:18px;
      line-height:1;
    }

    .team-sheet-close:active{
      transform:scale(.96);
    }

    .team-sheet-stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:7px;
      margin-top:1px;
    }

    .team-sheet-stat{
      min-width:0;
      padding:10px 6px 9px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface-soft);
      text-align:center;
    }

    .team-sheet-stat-label{
      color:var(--muted);
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.055em;
    }

    .team-sheet-stat-value{
      margin-top:4px;
      font-size:18px;
      line-height:1;
      font-weight:900;
      font-variant-numeric:tabular-nums;
    }

    .team-record{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:17px;
      min-height:34px;
      margin-top:5px;
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .team-record strong{
      color:var(--ink);
      font-size:12px;
      font-weight:900;
      font-variant-numeric:tabular-nums;
    }

    .team-sheet-section{
      padding-top:13px;
      margin-top:4px;
      border-top:.5px solid var(--line);
    }

    .team-sheet-section-title{
      margin-bottom:9px;
      color:var(--muted);
      font-size:10px;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.065em;
    }

    .team-form{
      display:flex;
      align-items:center;
      gap:7px;
      min-height:30px;
    }

    .team-form-pill{
      width:29px;
      height:29px;
      display:grid;
      place-items:center;
      border-radius:9px;
      font-size:11px;
      line-height:1;
      font-weight:900;
    }

    .team-form-pill.win{
      background:#ecfdf3;
      color:#168447;
    }

    .team-form-pill.draw{
      background:#f2f4f7;
      color:#667085;
    }

    .team-form-pill.loss{
      background:#fff0f0;
      color:#c4322b;
    }

    .team-form-empty{
      color:var(--muted);
      font-size:12px;
      font-weight:650;
    }

    .team-fixtures{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:7px;
    }

    .team-fixture{
      min-width:0;
      min-height:105px;
      padding:9px 8px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface-soft);
    }

    .team-fixture-label{
      color:var(--muted);
      font-size:8.25px;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.045em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .team-fixture-opponent{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
      margin-top:8px;
    }

    .team-fixture-opponent img{
      width:23px;
      height:23px;
      flex:0 0 23px;
      object-fit:contain;
    }

    .team-fixture-opponent span{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:11.25px;
      font-weight:800;
    }

    .team-fixture-main{
      margin-top:8px;
      font-size:14px;
      font-weight:900;
      line-height:1.1;
      font-variant-numeric:tabular-nums;
    }

    .team-fixture-sub{
      margin-top:3px;
      color:var(--muted);
      font-size:9.75px;
      font-weight:700;
      line-height:1.2;
      text-transform:uppercase;
      letter-spacing:.035em;
    }

    .team-top-scorer{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      align-items:center;
      min-height:43px;
    }

    .team-top-scorer-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:13px;
      font-weight:800;
    }

    .team-top-scorer-value{
      font-size:17px;
      font-weight:900;
      font-variant-numeric:tabular-nums;
    }

    .team-sheet-loading{
      min-height:210px;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    @media (prefers-reduced-motion:reduce){
      .team-sheet{animation:none}
    }

    html.theme-dark .team-sheet-backdrop{
      background:rgba(0,0,0,.46);
    }

    html.theme-dark .team-sheet{
      box-shadow:0 -18px 48px rgba(0,0,0,.42);
    }

    html.theme-dark .team-sheet-handle{
      background:#475467;
    }

    html.theme-dark .team-form-pill.win{
      background:rgba(48,209,88,.15);
      color:#5dd39e;
    }

    html.theme-dark .team-form-pill.draw{
      background:#202832;
      color:#b9c3d0;
    }

    html.theme-dark .team-form-pill.loss{
      background:rgba(255,69,58,.16);
      color:#ff817a;
    }

    @media(min-width:650px){
      .team-sheet-backdrop{
        align-items:center;
        padding:18px;
      }

      .team-sheet{
        width:min(560px,100%);
        max-height:min(80vh,720px);
        border-bottom:1px solid var(--line);
        border-radius:24px;
        padding-bottom:18px;
      }
    }


    /* Light/Dark control — same geometry as Refresh */
    .theme-btn i{
      width:19px;
      height:19px;
      display:grid;
      place-items:center;
      font-size:19px;
      line-height:19px;
      font-weight:400;
    }

    /* Manual Dark Mode.
       This block is intentionally LAST so no light rule can override it. */
    html.theme-dark{
      --bg:#0b0f14;
      --card:#151a21;
      --ink:#f2f4f7;
      --muted:#98a2b3;
      --line:#29313d;
      --accent:#0a84ff;
      --accent-soft:#102a43;
      --live:#ff6961;
      --green:#5dd39e;
      --nav:#f2f4f7;
      --surface-soft:#11161d;
      --surface-muted:#121820;
      --skeleton:#27303b;
      --shadow:0 5px 18px rgba(0,0,0,.18);
    }

    html.theme-dark body{
      background:var(--bg);
      color:var(--ink);

    html.theme-dark .top{
      background:rgba(11,15,20,.91);

    html.theme-dark .status{background:#202832}

    html.theme-dark .table-card{
      background:#121820;

      box-shadow:0 8px 24px rgba(0,0,0,.22);
    }
    html.theme-dark .stand-head{
      background:#0f151d;
      color:#b9c3d0;
      border-bottom-color:#2a3440;
    }

      background:#121820;
      border-bottom-color:#2a3440;

      background:linear-gradient(0deg,rgba(10,132,255,.18),rgba(10,132,255,.18)),#121820;

    html.theme-dark .stand-row.zone-europa{
      background:linear-gradient(0deg,rgba(255,159,10,.17),rgba(255,159,10,.17)),#121820;

    html.theme-dark .stand-row.zone-conference{
      background:linear-gradient(0deg,rgba(48,209,88,.15),rgba(48,209,88,.15)),#121820;
    }
    html.theme-dark .stand-row.zone-relegation{
      background:linear-gradient(0deg,rgba(255,69,58,.16),rgba(255,69,58,.16)),#121820;
    }
    html.theme-dark .stand-row.live-team{
      box-shadow:inset 3px 0 0 #ff6961;

    html.theme-dark .pos,
    html.theme-dark .num,
    html.theme-dark .pts,
    html.theme-dark .club,
    html.theme-dark .club span{
      color:#f2f4f7;
    }
    html.theme-dark .stand-legend{
      background:#121820;
      color:#b9c3d0;
      border-top-color:#2a3440;

    html.theme-dark .legend-dot.champions{background:#3b82f6}
    html.theme-dark .legend-dot.europa{background:#f59e0b}
    html.theme-dark .legend-dot.conference{background:#22c55e}
    html.theme-dark .legend-dot.relegation{background:#ef4444}
    html.theme-dark .stand-live-note{color:#b9c3d0}

    html.theme-dark .error{
      background:rgba(255,159,10,.13);
      color:#ffb340;
    }

    /* True dark Liquid Glass bottom bar */
    html.theme-dark .bottom-nav-frost{
      background:rgba(5,8,12,.42);
      backdrop-filter:
        blur(22px)
        saturate(125%)
        brightness(72%)
        contrast(108%);
      -webkit-backdrop-filter:
        blur(22px)
        saturate(125%)
        brightness(72%)
        contrast(108%);
      box-shadow:0 10px 30px rgba(0,0,0,.34);

        linear-gradient(

          rgba(28,33,41,.72) 52%,
          rgba(20,25,32,.76) 100%
        );
      border-color:rgba(255,255,255,.13);
      backdrop-filter:
        blur(28px)
        saturate(145%)
        brightness(78%)
        contrast(108%);
      -webkit-backdrop-filter:
        blur(28px)
        saturate(145%)
        brightness(78%)
        contrast(108%);
      box-shadow:
        0 12px 34px rgba(0,0,0,.42),
        0 2px 8px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -1px 0 rgba(255,255,255,.04);

    html.theme-dark .bottom-nav::before{
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.16),
          rgba(255,255,255,.045) 48%,
          transparent 100%
        );
      opacity:.72;
    }

    html.theme-dark .bottom-nav::after{
      background:rgba(255,255,255,.018);

        inset 0 0 0 .5px rgba(255,255,255,.065);

    html.theme-dark .tab{
      color:rgba(235,238,243,.54);
    }

    html.theme-dark .tab::before{
      background:
        linear-gradient(
          180deg,
          rgba(72,80,91,.94),
          rgba(45,52,62,.90)
        );
      border-color:rgba(255,255,255,.12);
      outline-color:rgba(255,255,255,.035);
      backdrop-filter:blur(18px) saturate(135%) brightness(92%);

      box-shadow:
        0 5px 16px rgba(0,0,0,.34),
        0 1px 4px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 -1px 0 rgba(255,255,255,.025),
        inset 0 0 0 .5px rgba(255,255,255,.055);
    }

    html.theme-dark .tab.active{
      color:#0a84ff;
      text-shadow:none;
    }

    @supports not ((backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px))){
      html.theme-dark .bottom-nav-frost{
        background:rgba(17,22,28,.96);
      }
      html.theme-dark .bottom-nav{
        background:rgba(24,30,38,.98);
        border-color:rgba(255,255,255,.12);
      }
      html.theme-dark .tab.active::before{
        background:rgba(55,63,74,.96);
      }
    }
