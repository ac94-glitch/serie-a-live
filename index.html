<script>
(() => {
  "use strict";

  const SITE = "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1";
  const STANDINGS = "https://site.api.espn.com/apis/v2/sports/soccer/ita.1/standings";
  const CORE = "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ita.1";
  const REFRESH_MS = 60000;

  const content = document.getElementById("content");
  const errorBox = document.getElementById("error");
  const updated = document.getElementById("updated");
  const seasonLabel = document.getElementById("seasonLabel");
  const themeBtn = document.getElementById("themeBtn");
  const themeIcon = document.getElementById("themeIcon");
  const refreshBtn = document.getElementById("refreshBtn");
  const matchPage = document.getElementById("matchPage");
  const matchPageClose = document.getElementById("matchPageClose");
  const matchPageScroll = document.getElementById("matchPageScroll");
  const matchPageContent = document.getElementById("matchPageContent");
  const teamSheetBackdrop = document.getElementById("teamSheetBackdrop");
  const teamSheet = document.getElementById("teamSheet");
  const teamSheetContent = document.getElementById("teamSheetContent");

  const THEME_KEY = "serie-a-live-theme";
  let activeTab = "matches";
  let rounds = {};
  let currentRound = 1;
  let selectedRound = 1;
  let seasonYear = new Date().getFullYear();
  let seasonText = "Serie A";
  let allEvents = [];
  let matchDetailsCache = new Map();
  let summaryCache = new Map();
  let standingsCache = null;
  let standingsBaseFetchedAt = 0;
  let leadersCache = { scorers:null, assists:null };
  let cardPlaysCache = new Map();
  let seasonCalendarLoaded = false;
  let seasonCalendarPromise = null;
  let seasonStartDate = null;
  let seasonEndDate = null;
  let seasonHydrationTimer = null;
  let matchesRenderToken = 0;
  let teamSheetRequestToken = 0;
  let teamSheetScrollY = 0;
  let matchPageRequestToken = 0;
  let matchPageScrollY = 0;
  let matchPageOpenId = "";
  let matchPageModel = null;

  const expandedMatchDetails = new Set();
  const matchDetailTabs = new Map();

  const esc = value => String(value ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");

  function shortPlayerName(name){
    const clean = String(name || "").trim().replace(/\s+/g," ");
    if(!clean) return "—";

    // Se ESPN fornisce già "N. Cognome", lo lasciamo così.
    if(/^[A-ZÀ-ÖØ-Ý]\.\s+/u.test(clean)) return clean;

    const parts = clean.split(" ");
    if(parts.length === 1) return clean;

    const firstInitial = parts[0].charAt(0).toUpperCase();
    const particle = new Set([
      "de","del","della","di","da","do","dos","das",
      "van","von","der","den","la","le"
    ]);

    // Mantiene cognomi come "Di Lorenzo", "De Roon", "Van de Ven".
    let surnameStart = parts.length - 1;
    while(surnameStart > 1 && particle.has(parts[surnameStart - 1].toLowerCase())){
      surnameStart--;
    }

    return `${firstInitial}. ${parts.slice(surnameStart).join(" ")}`;
  }

  const two = n => String(n).padStart(2,"0");
  const fmtDateKey = d => `${d.getUTCFullYear()}${two(d.getUTCMonth()+1)}${two(d.getUTCDate())}`;

  function activeTheme(){
    return document.documentElement.classList.contains("theme-dark")
      ? "dark"
      : "light";
  }

  function savedThemePreference(){
    try{
      const value = localStorage.getItem(THEME_KEY);
      return value === "light" || value === "dark"
        ? value
        : null;
    }catch(_){
      return null;
    }
  }

  function updateThemeButton(){
    if(!themeBtn || !themeIcon) return;

    const dark = activeTheme() === "dark";

    // Icon shows the ACTION:
    // moon in Light -> tap for Dark
    // sun in Dark -> tap for Light
    themeIcon.className = dark
      ? "ph ph-sun"
      : "ph ph-moon";

    const label = dark
      ? "Attiva modalità chiara"
      : "Attiva modalità scura";

    themeBtn.setAttribute("aria-label",label);
    themeBtn.setAttribute("title",label);
  }

  function applyTheme(theme,{persist=false}={}){
    const dark = theme === "dark";

    document.documentElement.classList.toggle("theme-dark",dark);
    document.documentElement.classList.toggle("theme-light",!dark);
    document.documentElement.style.colorScheme = dark ? "dark" : "light";

    const meta = document.getElementById("themeColor");
    if(meta){
      meta.content = dark ? "#0b0f14" : "#f4f6f8";
    }

    if(persist){
      try{
        localStorage.setItem(THEME_KEY,dark ? "dark" : "light");
      }catch(_){}
    }

    updateThemeButton();
  }

  function setupThemeControl(){
    updateThemeButton();

    themeBtn?.addEventListener("click",()=>{
      applyTheme(
        activeTheme() === "dark" ? "light" : "dark",
        {persist:true}
      );
    });

    const systemTheme = matchMedia("(prefers-color-scheme: dark)");

    const followSystem = event=>{
      // The iPhone theme continues to drive the app only until
      // the user makes an explicit manual choice.
      if(savedThemePreference()) return;
      applyTheme(event.matches ? "dark" : "light");
    };

    if(systemTheme.addEventListener){
      systemTheme.addEventListener("change",followSystem);
    }else if(systemTheme.addListener){
      systemTheme.addListener(followSystem);
    }
  }

  function setUpdated(){
    updated.textContent = "Aggiornato " + new Date().toLocaleTimeString(
      "it-IT",
      {hour:"2-digit",minute:"2-digit"}
    );
  }

  function clearLegacyUiState(){
    // V3.2 briefly remembered tab and matchday.
    // From V3.2.4 every fresh app launch always starts on
    // PARTITE + the current Serie A matchday.
    try{
      localStorage.removeItem("serie-a-live-ui-v3");
    }catch(_){}
  }


  function showError(text){
    errorBox.textContent = text;
    errorBox.style.display = "block";
  }

  function clearError(){
    errorBox.style.display = "none";
  }

  async function getJson(url){
    const r = await fetch(url,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function skeletonMatchHtml(){
    return `<div class="skeleton-match">
      <div class="skeleton-team">
        <span class="skeleton-block skeleton-logo"></span>
        <span class="skeleton-block skeleton-name"></span>
      </div>
      <div>
        <div class="skeleton-block skeleton-score"></div>
        <div class="skeleton-block skeleton-status"></div>
      </div>
      <div class="skeleton-team">
        <span class="skeleton-block skeleton-logo"></span>
        <span class="skeleton-block skeleton-name"></span>
      </div>
    </div>`;
  }

  function skeletonTableHtml(rows=8){
    return `<div class="skeleton-table">
      <div class="skeleton-table-head"></div>
      ${Array.from({length:rows},()=>`
        <div class="skeleton-table-row">
          <span class="skeleton-block skeleton-rank"></span>
          <span class="skeleton-club">
            <span class="skeleton-block skeleton-mini-logo"></span>
            <span class="skeleton-block skeleton-text"></span>
          </span>
          <span class="skeleton-block skeleton-value"></span>
        </div>
      `).join("")}
    </div>`;
  }

  function loading(){
    if(activeTab === "matches"){
      content.innerHTML = `<div class="skeleton-stack">
        ${skeletonMatchHtml()}
        ${skeletonMatchHtml()}
        ${skeletonMatchHtml()}
      </div>`;
      return;
    }

    content.innerHTML = skeletonTableHtml(
      activeTab === "standings" ? 10 : 8
    );
  }

  function dateLabel(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  }

  function timeLabel(iso){
    return new Date(iso).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

  function teamName(c){
    return c?.team?.shortDisplayName || c?.team?.displayName || c?.team?.name || "—";
  }
  function teamLogo(c){
    return c?.team?.logo || c?.team?.logos?.[0]?.href || "";
  }

  function cleanHexColor(value){
    const raw = String(value || "").trim().replace(/^#/,"");
    if(/^[0-9a-f]{6}$/i.test(raw)) return `#${raw.toUpperCase()}`;
    if(/^[0-9a-f]{3}$/i.test(raw)){
      return `#${raw.split("").map(x=>x+x).join("").toUpperCase()}`;
    }
    return "";
  }

  function teamPrimaryColor(c){
    const key = String(teamName(c) || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");

    // Small visual overrides for the most recognizable Serie A identities.
    const overrides = [
      [["juventus"],"#FFFFFF"],
      [["milan"],"#D71920"],
      [["inter","internazionale"],"#0057B8"],
      [["sassuolo"],"#168447"],
      [["como"],"#4B9CD3"],
      [["napoli"],"#43A7E1"],
      [["lazio"],"#78C7E8"],
      [["fiorentina"],"#6F2DA8"],
      [["roma"],"#8E1F2D"],
      [["atalanta"],"#1765A7"],
      [["genoa"],"#C52032"],
      [["torino"],"#8A1538"]
    ];

    for(const [names,color] of overrides){
      if(names.some(name=>key === name || key.includes(name))) return color;
    }

    return (
      cleanHexColor(c?.team?.color) ||
      cleanHexColor(c?.team?.alternateColor) ||
      "#344054"
    );
  }

  function colorPresentation(hex){
    const color = cleanHexColor(hex) || "#344054";
    const raw = color.slice(1);
    const r = parseInt(raw.slice(0,2),16);
    const g = parseInt(raw.slice(2,4),16);
    const b = parseInt(raw.slice(4,6),16);

    // Relative visual brightness: enough for choosing readable jersey numbers.
    const brightness = (r*299 + g*587 + b*114) / 1000;
    const light = brightness > 178;

    return {
      color,
      text:light ? "#17202A" : "#FFFFFF",
      border:light ? "rgba(23,32,42,.58)" : "rgba(255,255,255,.62)"
    };
  }

  function isActuallyLive(ev){
    const status = ev?.status || {};
    const type = status?.type || {};
    const state = String(type?.state || "").toLowerCase();

    if(state !== "in" || type?.completed === true) return false;

    // ESPN can occasionally expose state="in" for other fixtures on the
    // same matchday. A future kickoff must never be promoted as LIVE.
    const kickoff = new Date(ev?.date).getTime();
    const now = Date.now();

    if(Number.isFinite(kickoff)){
      // Small tolerance for ESPN switching state just before kickoff.
      if(now < kickoff - 2 * 60 * 1000) return false;

      // Safety net against a stale "in" state many hours after kickoff.
      if(now > kickoff + 4 * 60 * 60 * 1000) return false;
    }

    const typeName = String(type?.name || "").toUpperCase();
    const description = String(type?.description || "").toLowerCase();
    const detail = String(
      type?.detail ||
      type?.shortDetail ||
      status?.displayClock ||
      ""
    ).toLowerCase();

    const explicitLiveStatus =
      /STATUS_(IN_PROGRESS|HALFTIME|FIRST_HALF|SECOND_HALF|EXTRA_TIME|PENALTY_SHOOTOUT|END_PERIOD)/.test(typeName) ||
      /half[\s-]?time|intervallo|first half|second half|extra time|penalt/.test(description) ||
      /half[\s-]?time|intervallo/.test(detail);

    const period = Number(
      status?.period ??
      ev?.competitions?.[0]?.status?.period ??
      0
    );

    const clock = String(status?.displayClock || "").trim();

    // Match clocks such as 12', 45'+2, 90+4, 105' are real live evidence.
    const hasMatchClock =
      /^\d{1,3}(?:['’])?(?:\+\d{1,2})?(?:['’])?$/.test(clock) ||
      /^\d{1,3}:\d{2}$/.test(clock);

    return explicitLiveStatus || period > 0 || hasMatchClock;
  }

  function stateOf(ev){
    const type = ev?.status?.type || {};
    const state = String(type?.state || "").toLowerCase();

    if(state === "post" || type?.completed === true) return "done";
    if(isActuallyLive(ev)) return "live";
    return "pre";
  }

  function roundNumberFromEvent(ev){
    const candidates = [
      ev?.week?.number,
      ev?.competitions?.[0]?.week?.number,
      ev?.season?.week?.number
    ];
    for(const n of candidates){
      const x = Number(n);
      if(Number.isFinite(x) && x > 0) return x;
    }
    return null;
  }

  function groupIntoRounds(events){
    const explicit = {};
    let explicitCount = 0;

    for(const ev of events){
      const n = roundNumberFromEvent(ev);
      if(n){
        (explicit[n] ||= []).push(ev);
        explicitCount++;
      }
    }
    const explicitThreshold = events.length < 20
      ? Math.ceil(events.length * 0.7)
      : Math.max(20, Math.ceil(events.length * 0.7));

    if(explicitCount >= explicitThreshold){
      Object.values(explicit).forEach(list => list.sort((a,b)=>new Date(a.date)-new Date(b.date)));
      return explicit;
    }

    const out = {};
    let n = 1, current = [], seen = new Set();
    const sorted = [...events].sort((a,b)=>new Date(a.date)-new Date(b.date));
    for(const ev of sorted){
      const ids = (ev?.competitions?.[0]?.competitors || []).map(c => String(c.id));
      if(current.length && ids.some(id => seen.has(id))){
        out[n++] = current;
        current = [];
        seen = new Set();
      }
      current.push(ev);
      ids.forEach(id => seen.add(id));
    }
    if(current.length) out[n] = current;
    return out;
  }

  function detectCurrentRound(){
    const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    if(!nums.length) return 1;

    const live = nums.find(n => rounds[n].some(e => stateOf(e) === "live"));
    if(live) return live;

    const now = Date.now();
    let latestStarted = nums[0];
    for(const n of nums){
      const times = rounds[n].map(e => new Date(e.date).getTime()).filter(Number.isFinite);
      const first = Math.min(...times);
      if(Number.isFinite(first) && first <= now) latestStarted = n;
    }
    return latestStarted;
  }

  function buildDateRanges(start,end,blockDays=13){
    const ranges = [];
    let cur = new Date(Date.UTC(
      start.getUTCFullYear(),
      start.getUTCMonth(),
      start.getUTCDate()
    ));

    while(cur <= end){
      const blockEnd = new Date(
        Math.min(
          cur.getTime() + blockDays * 86400000,
          end.getTime()
        )
      );

      ranges.push(`${fmtDateKey(cur)}-${fmtDateKey(blockEnd)}`);
      cur = new Date(blockEnd.getTime() + 86400000);
    }

    return ranges;
  }

  async function mapConcurrent(items,limit,worker){
    const queue = [...items];
    const results = new Array(items.length);
    let cursor = 0;

    const run = async ()=>{
      while(queue.length){
        const item = queue.shift();
        const index = cursor++;
        results[index] = await worker(item,index);
      }
    };

    const count = Math.min(limit,Math.max(1,items.length));
    await Promise.all(Array.from({length:count},run));
    return results;
  }

  async function hydrateSeasonCalendar(){
    if(seasonCalendarLoaded) return;
    if(seasonCalendarPromise) return seasonCalendarPromise;
    if(!seasonStartDate || !seasonEndDate) return;

    seasonCalendarPromise = (async()=>{
      const ranges = buildDateRanges(seasonStartDate,seasonEndDate,13);

      const chunks = await mapConcurrent(
        ranges,
        4,
        rng => getJson(`${SITE}/scoreboard?dates=${rng}`).catch(()=>({events:[]}))
      );

      const merged = new Map(allEvents.map(ev=>[String(ev.id),ev]));

      for(const chunk of chunks){
        for(const ev of chunk?.events || []){
          merged.set(String(ev.id),ev);
        }
      }

      const previousCurrent = currentRound;
      const previousSelected = selectedRound;
      const wasOnCurrentRound =
        Number(previousSelected) === Number(previousCurrent);

      allEvents = [...merged.values()];
      rounds = groupIntoRounds(allEvents);
      currentRound = detectCurrentRound();

      // If the app was still on "today", follow ESPN's refined current
      // round. If the user manually swiped elsewhere, preserve that choice
      // for the current session only.
      if(wasOnCurrentRound){
        selectedRound = currentRound;
      }else if(rounds[previousSelected]){
        selectedRound = previousSelected;
      }else{
        selectedRound = currentRound;
      }

      seasonCalendarLoaded = true;
    })();

    try{
      await seasonCalendarPromise;
    }finally{
      seasonCalendarPromise = null;
    }
  }

  function scheduleSeasonHydration(){
    if(seasonCalendarLoaded || seasonCalendarPromise || seasonHydrationTimer) return;

    const startHydration = ()=>{
      seasonHydrationTimer = null;
      hydrateSeasonCalendar().catch(()=>{});
    };

    if("requestIdleCallback" in window){
      seasonHydrationTimer = requestIdleCallback(startHydration,{timeout:2000});
    }else{
      seasonHydrationTimer = setTimeout(startHydration,1400);
    }
  }

  async function ensureSeasonCalendar(){
    if(seasonCalendarLoaded) return;
    await hydrateSeasonCalendar();
  }

  async function loadSeason(){
    const board = await getJson(`${SITE}/scoreboard?_=${Date.now()}`);
    const league = board?.leagues?.[0];

    if(!league?.season?.startDate || !league?.season?.endDate){
      throw new Error("Stagione non disponibile");
    }

    seasonYear =
      Number(league.season.year) ||
      new Date(league.season.startDate).getFullYear();

    const y2 = String(seasonYear + 1).slice(-2);
    seasonText = `Serie A ${seasonYear}/${y2}`;
    seasonLabel.textContent = seasonText;

    seasonStartDate = new Date(league.season.startDate);
    seasonEndDate = new Date(league.season.endDate);

    // First paint only needs the matchdays around today.
    // The entire season is hydrated later, in background.
    const now = new Date();
    const nearStart = new Date(
      Math.max(
        seasonStartDate.getTime(),
        now.getTime() - 10 * 86400000
      )
    );
    const nearEnd = new Date(
      Math.min(
        seasonEndDate.getTime(),
        now.getTime() + 10 * 86400000
      )
    );

    const nearRange = `${fmtDateKey(nearStart)}-${fmtDateKey(nearEnd)}`;
    const nearBoard = await getJson(
      `${SITE}/scoreboard?dates=${nearRange}`
    ).catch(()=>({events:[]}));

    const map = new Map();

    for(const ev of board?.events || []){
      map.set(String(ev.id),ev);
    }
    for(const ev of nearBoard?.events || []){
      map.set(String(ev.id),ev);
    }

    allEvents = [...map.values()];

    // If ESPN unexpectedly gives us too little near-date data,
    // fall back to the complete calendar before rendering.
    if(allEvents.length < 8){
      await hydrateSeasonCalendar();
    }else{
      rounds = groupIntoRounds(allEvents);
      currentRound = detectCurrentRound();
      selectedRound = currentRound;
      scheduleSeasonHydration();
    }

    setUpdated();
  }

  function normalizeFootballMinute(value){
    const raw = String(value || "")
      .trim()
      .replace(/[’′]/g,"'");

    if(!raw) return "";

    // ESPN commonly exposes stoppage time as 45'+3' or 90'+5'.
    // Normalize visually to 45+3' / 90+5'.
    let m = raw.match(/^(\d{1,3})'\s*\+\s*(\d{1,2})'?$/);
    if(m) return `${Number(m[1])}+${Number(m[2])}'`;

    m = raw.match(/^(\d{1,3})\s*\+\s*(\d{1,2})'?$/);
    if(m) return `${Number(m[1])}+${Number(m[2])}'`;

    m = raw.match(/^(\d{1,3})'$/);
    if(m) return `${Number(m[1])}'`;

    m = raw.match(/^(\d{1,3})$/);
    if(m) return `${Number(m[1])}'`;

    return raw;
  }

  function minuteOf(detail){
    const display = detail?.clock?.displayValue || "";
    return normalizeFootballMinute(display);
  }

  function extractMatchEvents(summary, homeId){
    const details = summary?.header?.competitions?.[0]?.details || [];
    const events = [];

    for(const d of details){
      const raw = d.participants || d.athletesInvolved || [];
      const athletes = raw.map(x => x?.athlete || x).filter(Boolean);
      const athlete = athletes?.[0] || {};
      const displayName =
        athlete?.displayName ||
        athlete?.fullName ||
        athlete?.shortName ||
        "—";

      const teamId = d?.team?.id;
      const side = String(teamId) === String(homeId) ? "home" : "away";
      const minute = minuteOf(d);
      const typeText = String(d?.type?.text || d?.type?.description || "").toLowerCase();

      if(d?.scoringPlay && !d?.shootout){
        let assist = "";
        if(!d.penaltyKick && !d.ownGoal && athletes.length > 1){
          const assister = athletes[1] || {};
          assist =
            assister?.displayName ||
            assister?.fullName ||
            assister?.shortName ||
            "";
        }

        events.push({
          kind:"goal",
          side,
          player:displayName,
          assist,
          minute,
          penalty:!!d.penaltyKick,
          ownGoal:!!d.ownGoal
        });
        continue;
      }

      const isMissedPenalty =
        !d?.scoringPlay && (
          !!d?.penaltyKick ||
          typeText.includes("penalty missed") ||
          typeText.includes("penalty saved") ||
          typeText.includes("missed penalty") ||
          typeText.includes("misses a penalty") ||
          typeText.includes("failed penalty") ||
          typeText.includes("fails to convert the penalty") ||
          typeText.includes("failed to convert the penalty")
        );

      if(isMissedPenalty){
        events.push({
          kind:"penmiss",
          side,
          player:displayName,
          minute
        });
        continue;
      }

      // Keep a second-yellow dismissal distinct from a direct red.
      const isSecondYellow =
        typeText.includes("second yellow") ||
        typeText.includes("2nd yellow");

      const isRed =
        !isSecondYellow && (
          !!d?.redCard ||
          typeText.includes("red card")
        );

      const isYellow =
        !isSecondYellow && !isRed && (
          !!d?.yellowCard ||
          typeText.includes("yellow card")
        );

      if(isSecondYellow || isRed || isYellow){
        events.push({
          kind:isSecondYellow ? "secondyellow" : (isRed ? "red" : "yellow"),
          side,
          player:displayName,
          minute
        });
      }
    }

    return events;
  }

  function normalizedTeamText(value){
    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]/g,"");
  }

  function playText(play){
    return String(
      play?.text ||
      play?.shortText ||
      play?.description ||
      play?.headline ||
      ""
    ).trim();
  }

  function playMinute(play){
    const direct =
      play?.clock?.displayValue ||
      play?.time?.displayValue ||
      play?.period?.displayValue ||
      "";

    if(direct) return normalizeFootballMinute(direct);

    const txt = playText(play);

    let m = txt.match(
      /^\s*(\d{1,3})['’]?\s*\+\s*(\d{1,2})['’]?/
    );
    if(m){
      return normalizeFootballMinute(`${m[1]}+${m[2]}'`);
    }

    m = txt.match(/^\s*(\d{1,3})['’]?/);
    return m ? normalizeFootballMinute(m[1]) : "";
  }

  function playAthleteName(play){
    const raw =
      play?.athletesInvolved ||
      play?.participants ||
      (play?.athlete ? [play.athlete] : []);

    const list = Array.isArray(raw) ? raw : [];
    const athlete = list?.[0]?.athlete || list?.[0] || {};

    const direct =
      athlete?.displayName ||
      athlete?.fullName ||
      athlete?.shortName ||
      "";

    if(direct) return direct;

    let txt = playText(play).replace(/^\s*\d+(?:'\+\d+)?'\s*/,"");

    // Esempi:
    // "Martin Baturina (Como) is shown the yellow card."
    // "Patrick Cutrone (Como) has a penalty saved."
    // "Patrick Cutrone (Como) misses a penalty."
    const generic = txt.match(/^(.+?)\s+\(([^)]+)\)/);
    return generic ? generic[1].trim() : "";
  }

  function playTeamId(play){
    if(play?.team?.id) return String(play.team.id);
    const ref = String(play?.team?.$ref || "");
    const m = ref.match(/\/teams\/(\d+)/);
    return m ? m[1] : "";
  }

  function eventCompetitorAliases(ev){
    const competitors = ev?.competitions?.[0]?.competitors || [];
    const sides = {};

    for(const c of competitors){
      const side = c?.homeAway;
      if(side !== "home" && side !== "away") continue;

      sides[side] = [
        c?.team?.displayName,
        c?.team?.shortDisplayName,
        c?.team?.name,
        c?.team?.abbreviation
      ]
        .filter(Boolean)
        .map(String)
        .sort((a,b)=>b.length-a.length);
    }

    return sides;
  }

  function sideFromTeamText(value,ev){
    const mentioned = normalizedTeamText(value);
    if(!mentioned) return "";

    const aliases = eventCompetitorAliases(ev);

    for(const side of ["home","away"]){
      for(const alias of aliases[side] || []){
        const normalized = normalizedTeamText(alias);
        if(!normalized) continue;

        if(
          normalized === mentioned ||
          (normalized.length >= 4 && mentioned.includes(normalized)) ||
          (mentioned.length >= 4 && normalized.includes(mentioned))
        ){
          return side;
        }
      }
    }

    return "";
  }

  function substitutionNamesFromPlay(play,ev){
    let txt = playText(play)
      .replace(/^\s*\d+(?:'\+\d+)?'\s*/,"")
      .trim();

    if(!/substitution/i.test(txt) || !/\sreplaces\s/i.test(txt)){
      return null;
    }

    // Mark injury only when ESPN explicitly states it as the
    // reason for the substitution.
    const injury =
      /\b(?:because of|due to)\s+(?:an?\s+)?injury\b/i.test(txt) ||
      /\bforced off\s+(?:with|because of|due to)\s+(?:an?\s+)?injury\b/i.test(txt);

    const replaceMatch = txt.match(/\sreplaces\s/i);
    if(!replaceMatch) return null;

    const splitAt = replaceMatch.index;
    let left = txt.slice(0,splitAt).trim();
    let playerOut = txt
      .slice(splitAt + replaceMatch[0].length)
      .trim();

    playerOut = playerOut
      .replace(/\s+(?:because of|due to)\b.*$/i,"")
      .replace(/[.!?]+\s*$/,"")
      .trim();

    left = left.replace(/^substitution,\s*/i,"").trim();

    const aliases = eventCompetitorAliases(ev);
    const allAliases = [
      ...(aliases.home || []).map(name=>({name,side:"home"})),
      ...(aliases.away || []).map(name=>({name,side:"away"}))
    ].sort((a,b)=>b.name.length-a.name.length);

    let playerIn = left;
    let side = "";

    for(const item of allAliases){
      const prefix = `${item.name}.`;
      if(left.toLowerCase().startsWith(prefix.toLowerCase())){
        playerIn = left.slice(prefix.length).trim();
        side = item.side;
        break;
      }
    }

    if(playerIn === left){
      const pieces = left.split(/\.\s+/);
      if(pieces.length >= 2){
        const possibleTeam = pieces.slice(0,-1).join(". ");
        const possiblePlayer = pieces[pieces.length-1].trim();
        const detectedSide = sideFromTeamText(possibleTeam,ev);

        if(detectedSide){
          side = detectedSide;
          playerIn = possiblePlayer;
        }else{
          const firstSeparator = left.indexOf(". ");
          if(firstSeparator >= 0){
            playerIn = left.slice(firstSeparator+2).trim();
          }
        }
      }
    }

    playerIn = playerIn
      .replace(/[.!?]+\s*$/,"")
      .trim();

    if(!playerIn || !playerOut) return null;

    return {playerIn,playerOut,side,injury};
  }

  function playSpecialKind(play){
    const typeId = String(play?.type?.id || "");
    const typeText = String(
      play?.type?.text ||
      play?.type?.description ||
      ""
    ).toLowerCase();

    const txtRaw = playText(play);
    const txt = txtRaw.toLowerCase();

    // Explicit ESPN VAR decision phrases.
    if(/^var decision:\s*no goal\b/i.test(txtRaw)){
      return "varnogoal";
    }

    if(/^var decision:\s*no penalty\b/i.test(txtRaw)){
      return "varnopenalty";
    }

    if(/^var decision:\s*penalty\b/i.test(txtRaw)){
      return "varpenalty";
    }

    if(/^var decision:\s*goal\b/i.test(txtRaw)){
      return "vargoal";
    }

    if(
      /^goal overturned by var:/i.test(txtRaw) ||
      txt.includes("goal overturned by var") ||
      (
        txt.includes("goal is ruled out") &&
        txt.includes("var review")
      )
    ){
      return "goaldisallowed";
    }

    if(
      /^var (?:check|review)\b/i.test(txtRaw) ||
      /^video assistant referee (?:check|review)\b/i.test(txtRaw)
    ){
      return "varreview";
    }

    const secondYellow =
      typeText.includes("second yellow") ||
      typeText.includes("2nd yellow") ||
      txt.includes("second yellow card") ||
      txt.includes("second yellow");

    if(secondYellow) return "secondyellow";

    if(
      typeId === "95" ||
      play?.redCard ||
      typeText.includes("red card") ||
      txt.includes("shown the red card")
    ) return "red";

    if(
      typeId === "94" ||
      play?.yellowCard ||
      typeText.includes("yellow card") ||
      txt.includes("shown the yellow card")
    ) return "yellow";

    const savedPenalty =
      txt.includes("penalty saved") ||
      txt.includes("penalty is saved") ||
      txt.includes("penalty was saved") ||
      /penalty.{0,80}saved by/.test(txt);

    if(savedPenalty) return "pensaved";

    const missedPenalty =
      txt.includes("penalty missed") ||
      txt.includes("misses a penalty") ||
      txt.includes("missed a penalty") ||
      txt.includes("failed to convert the penalty") ||
      txt.includes("fails to convert the penalty") ||
      txt.includes("failed penalty");

    if(missedPenalty) return "penmiss";

    // "Penalty Napoli. Player draws a foul in the penalty area."
    // Do NOT mistake "Penalty conceded by..." for a new award.
    if(
      /^penalty\s+(?!conceded\b|saved\b|missed\b)[^.]+\./i.test(txtRaw)
    ){
      return "penaltyawarded";
    }

    if(
      typeText.includes("substitution") ||
      (txt.includes("substitution") && txt.includes("replaces"))
    ) return "sub";

    return "";
  }

  function specialSide(play, ev, homeId){
    const teamId = playTeamId(play);
    if(teamId) return String(teamId) === String(homeId) ? "home" : "away";

    const txt = playText(play);

    const subTeam = txt.match(/substitution,\s*(.+?)\.\s*/i);
    if(subTeam){
      const side = sideFromTeamText(subTeam[1],ev);
      if(side) return side;
    }

    const teamMatch = txt.match(/\(([^)]+)\)/);
    if(teamMatch){
      const side = sideFromTeamText(teamMatch[1],ev);
      if(side) return side;
    }

    // VAR Decision / Penalty lines often name the team without parentheses.
    const fromWholeText = sideFromTeamText(txt,ev);
    if(fromWholeText) return fromWholeText;

    return "";
  }

  function varGoalPlayerFromText(text){
    const m = String(text || "").match(/\(([^)]+)\)\s*\.?\s*$/);
    return m ? m[1].trim() : "";
  }

  function penaltyWinnerFromText(text){
    const m = String(text || "").match(
      /^Penalty\s+[^.]+\.\s*(.+?)\s+draws a foul\b/i
    );
    return m ? m[1].trim() : "";
  }

  function specialEventFromPlay(play, ev, homeId){
    const kind = playSpecialKind(play);
    if(!kind) return null;

    if(kind === "sub"){
      const sub = substitutionNamesFromPlay(play,ev);
      if(!sub) return null;

      const side =
        specialSide(play,ev,homeId) ||
        sub.side;

      if(!side) return null;

      return {
        kind:"sub",
        side,
        playerIn:sub.playerIn,
        playerOut:sub.playerOut,
        injury:!!sub.injury,
        minute:playMinute(play)
      };
    }

    const side = specialSide(play,ev,homeId);
    if(!side) return null;

    const minute = playMinute(play);
    const txt = playText(play);

    if(
      kind === "varnogoal" ||
      kind === "varnopenalty" ||
      kind === "varpenalty" ||
      kind === "vargoal" ||
      kind === "varreview" ||
      kind === "penaltyawarded"
    ){
      let player = "";

      if(kind === "vargoal"){
        player = varGoalPlayerFromText(txt);
      }else if(kind === "penaltyawarded"){
        player = penaltyWinnerFromText(txt);
      }

      return {
        kind,
        side,
        player,
        minute,
        text:txt
      };
    }

    const player = playAthleteName(play);

    if(kind === "goaldisallowed"){
      return {
        kind,
        side,
        player:player || "—",
        minute,
        text:txt
      };
    }

    if(!player) return null;

    return {
      kind,
      side,
      player,
      minute,
      text:txt
    };
  }

  function specialEventKey(e){
    if(e.kind === "sub"){
      return [
        e.kind,
        e.side,
        normalizedTeamText(e.playerIn),
        normalizedTeamText(e.playerOut),
        String(e.minute || "")
      ].join("|");
    }

    return [
      e.kind,
      e.side,
      normalizedTeamText(e.player || ""),
      String(e.minute || "")
    ].join("|");
  }

  function mergeDuplicateSpecial(existing,incoming){
    if(!existing) return incoming;

    if(
      existing.kind === "sub" &&
      incoming.kind === "sub" &&
      incoming.injury &&
      !existing.injury
    ){
      return {
        ...existing,
        ...incoming,
        injury:true
      };
    }

    return existing;
  }

  function specialEventsFromSummaryDeep(summary, ev, homeId){
    const events = [];
    const seenObjects = new WeakSet();

    function walk(node,depth=0){
      if(!node || typeof node !== "object" || depth > 8) return;
      if(seenObjects.has(node)) return;
      seenObjects.add(node);

      if(!Array.isArray(node)){
        const kind = playSpecialKind(node);
        const txt = playText(node).toLowerCase();
        const eventLike =
          !!node?.clock ||
          !!node?.time ||
          !!node?.athletesInvolved ||
          !!node?.participants ||
          txt.includes("is shown the yellow card") ||
          txt.includes("is shown the red card") ||
          txt.includes("second yellow") ||
          txt.includes("penalty saved") ||
          txt.includes("penalty is saved") ||
          txt.includes("penalty was saved") ||
          txt.includes("misses a penalty") ||
          txt.includes("penalty missed") ||
          txt.startsWith("penalty ") ||
          txt.startsWith("var decision:") ||
          txt.startsWith("var check") ||
          txt.startsWith("var review") ||
          txt.includes("goal overturned by var") ||
          (txt.includes("goal is ruled out") && txt.includes("var review")) ||
          (txt.includes("substitution") && txt.includes("replaces"));

        if(kind && eventLike){
          const parsed = specialEventFromPlay(node,ev,homeId);
          if(parsed) events.push(parsed);
        }
      }

      if(Array.isArray(node)){
        node.forEach(x=>walk(x,depth+1));
      }else{
        for(const value of Object.values(node)){
          if(value && typeof value === "object") walk(value,depth+1);
        }
      }
    }

    walk(summary);

    const unique = new Map();
    events.forEach(e=>{
      const key = specialEventKey(e);
      unique.set(
        key,
        mergeDuplicateSpecial(unique.get(key),e)
      );
    });
    return [...unique.values()];
  }

  function minuteDistance(a,b){
    const av = eventMinuteValue(a);
    const bv = eventMinuteValue(b);

    if(
      av === Number.MAX_SAFE_INTEGER ||
      bv === Number.MAX_SAFE_INTEGER
    ) return Number.MAX_SAFE_INTEGER;

    // eventMinuteValue uses baseMinute*100 + stoppage.
    return Math.abs(av-bv);
  }

  function normalizeAdvancedTimeline(items){
    const sorted = items
      .map((e,index)=>({...e,_mergeOrder:index}))
      .sort((a,b)=>
        eventMinuteValue(a.minute)-eventMinuteValue(b.minute) ||
        a._mergeOrder-b._mergeOrder
      );

    const out = [];

    for(const item of sorted){
      // GOAL OVERTURNED BY VAR is richer than the later
      // "VAR Decision: No Goal" line because it contains the player.
      if(item.kind === "varnogoal"){
        const richer = out.some(prev=>
          prev.kind === "goaldisallowed" &&
          prev.side === item.side &&
          minuteDistance(prev.minute,item.minute) <= 500
        );
        if(richer) continue;
      }

      // If a generic penalty award is immediately followed by an explicit
      // VAR Penalty decision, keep one event and mark it as VAR-confirmed.
      if(item.kind === "varpenalty"){
        let merged = false;

        for(let i=out.length-1;i>=0;i--){
          const prev = out[i];

          if(
            prev.kind === "penaltyawarded" &&
            prev.side === item.side &&
            minuteDistance(prev.minute,item.minute) <= 400
          ){
            out[i] = {
              ...prev,
              minute:item.minute || prev.minute,
              varConfirmed:true
            };
            merged = true;
            break;
          }
        }

        if(merged) continue;
      }

      if(item.kind === "varnopenalty"){
        const hadAward = [...out]
          .reverse()
          .find(prev=>
            prev.kind === "penaltyawarded" &&
            prev.side === item.side &&
            minuteDistance(prev.minute,item.minute) <= 500
          );

        if(hadAward){
          item.penaltyRevoked = true;
        }
      }

      out.push(item);
    }

    return out.map(({_mergeOrder,...event})=>event);
  }

  async function specialPlaysFor(ev, homeId){
    const id = String(ev.id);
    if(cardPlaysCache.has(id)) return cardPlaysCache.get(id);

    const promise = (async()=>{
      const compId = ev?.competitions?.[0]?.id || ev.id;
      try{
        const data = await getJson(
          `${CORE}/events/${encodeURIComponent(ev.id)}/competitions/${encodeURIComponent(compId)}/plays?limit=300`
        );

        const plays =
          data?.items ||
          data?.plays ||
          data?.events ||
          [];

        const events = [];
        if(Array.isArray(plays)){
          for(const play of plays){
            const parsed = specialEventFromPlay(play,ev,homeId);
            if(parsed) events.push(parsed);
          }
        }

        const unique = new Map();
        events.forEach(e=>{
          const key = specialEventKey(e);
          unique.set(
            key,
            mergeDuplicateSpecial(unique.get(key),e)
          );
        });
        return [...unique.values()];
      }catch{
        return [];
      }
    })();

    cardPlaysCache.set(id,promise);
    try{
      return await promise;
    }catch{
      cardPlaysCache.delete(id);
      return [];
    }
  }
  function personDisplayName(person){
    if(!person) return "";
    if(typeof person === "string") return person.trim();

    const p = person?.athlete || person?.person || person;

    const direct =
      p?.displayName ||
      p?.fullName ||
      p?.shortName ||
      p?.name ||
      "";

    if(direct) return String(direct).trim();

    const combined = [p?.firstName,p?.lastName]
      .filter(Boolean)
      .join(" ")
      .trim();

    return combined;
  }

  function teamIdFromObject(obj){
    const direct =
      obj?.team?.id ||
      obj?.id ||
      obj?.teamId ||
      "";
    if(direct) return String(direct);

    const ref = String(obj?.team?.$ref || obj?.$ref || "");
    const m = ref.match(/\/teams\/(\d+)/);
    return m ? m[1] : "";
  }

  function normalizeFormation(value){
    if(value == null) return "";

    if(typeof value === "object"){
      value =
        value?.displayValue ??
        value?.displayName ??
        value?.name ??
        value?.value ??
        "";
    }

    let clean = String(value || "").trim();
    if(!clean) return "";

    // ESPN/feeds sometimes expose a compact numeric formation, e.g. 4231.
    if(/^\d{3,5}$/.test(clean)){
      clean = clean.split("").join("-");
    }

    return /^\d(?:-\d){2,4}$/.test(clean) ? clean : "";
  }

  function formationFromContainer(container){
    if(!container || typeof container !== "object") return "";
    const candidates = [
      container?.formation,
      container?.formationName,
      container?.formationText,
      container?.team?.formation
    ];
    for(const c of candidates){
      const value = normalizeFormation(c);
      if(value) return value;
    }
    return "";
  }

  function flattenRosterEntries(roster){
    if(!Array.isArray(roster)) return [];

    const out = [];
    for(const item of roster){
      if(!item) continue;

      if(Array.isArray(item?.athletes)){
        for(const nested of item.athletes){
          out.push(nested);
        }
      }else{
        out.push(item);
      }
    }
    return out;
  }

  function lineupPlayer(entry){
    const athlete = entry?.athlete || entry?.player || entry;
    const name = personDisplayName(athlete);
    if(!name) return null;

    const jersey = String(
      entry?.jersey ??
      athlete?.jersey ??
      entry?.shirtNumber ??
      athlete?.shirtNumber ??
      ""
    ).trim();

    const starter =
      entry?.starter === true ||
      entry?.isStarter === true ||
      String(entry?.status?.type || "").toLowerCase() === "starter";

    const positionObj =
      entry?.position ||
      athlete?.position ||
      {};

    // Keep every useful ESPN position label instead of only the first one.
    // Different matches can expose D/M/F, CB/RB/LB, or full names.
    const position = [
      positionObj?.abbreviation,
      positionObj?.name,
      positionObj?.displayName,
      entry?.positionName,
      athlete?.position?.abbreviation,
      athlete?.position?.name,
      athlete?.position?.displayName
    ]
      .filter(Boolean)
      .map(String)
      .join(" ")
      .trim();

    const tacticalOrder = Number(
      entry?.formationPlace ??
      entry?.formationPosition ??
      entry?.order ??
      athlete?.formationPlace ??
      NaN
    );

    return {
      name,
      jersey,
      starter,
      position,
      tacticalOrder:Number.isFinite(tacticalOrder) ? tacticalOrder : null
    };
  }

  function fallbackTeamContainer(summary, teamId){
    const id = String(teamId || "");
    const candidates = [
      ...(summary?.boxscore?.teams || []),
      ...(summary?.header?.competitions?.[0]?.competitors || [])
    ];

    return candidates.find(item => teamIdFromObject(item) === id) || null;
  }

  function lineupSideFromSummary(summary, teamId){
    const id = String(teamId || "");
    const blocks = Array.isArray(summary?.rosters) ? summary.rosters : [];
    const block = blocks.find(r => teamIdFromObject(r) === id) || null;
    const fallback = fallbackTeamContainer(summary,id);

    const rawRoster = flattenRosterEntries(
      block?.roster ||
      block?.athletes ||
      []
    );

    const players = rawRoster
      .map(lineupPlayer)
      .filter(Boolean);

    let starters = players.filter(p=>p.starter);
    let bench = players.filter(p=>!p.starter);

    // If starter flags are absent but the match roster is ordered,
    // use the first 11 only when the feed clearly contains >11 players.
    const hasStarterFlags = rawRoster.some(
      x => x?.starter === true || x?.starter === false || x?.isStarter === true || x?.isStarter === false
    );

    if(!hasStarterFlags && players.length > 11){
      starters = players.slice(0,11);
      bench = players.slice(11);
    }

    const formation =
      formationFromContainer(block) ||
      formationFromContainer(fallback);

    return {
      starters,
      bench,
      formation
    };
  }

  function lineupsFromSummary(summary, homeId, awayId){
    return {
      home:lineupSideFromSummary(summary,homeId),
      away:lineupSideFromSummary(summary,awayId)
    };
  }

  function hasLineupData(lineups){
    return !!(
      lineups?.home?.starters?.length ||
      lineups?.away?.starters?.length ||
      lineups?.home?.bench?.length ||
      lineups?.away?.bench?.length
    );
  }


  function normalizeStatKey(value){
    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]/g,"");
  }

  function numericStatValue(stat){
    const candidates = [
      stat?.value,
      stat?.displayValue,
      stat?.summary,
      stat?.text
    ];

    for(const candidate of candidates){
      if(typeof candidate === "number" && Number.isFinite(candidate)){
        return candidate;
      }

      if(candidate === null || candidate === undefined) continue;

      const match = String(candidate)
        .replace(",",".")
        .match(/-?\d+(?:\.\d+)?/);

      if(match){
        const n = Number(match[0]);
        if(Number.isFinite(n)) return n;
      }
    }

    return null;
  }

  function summaryStatsForTeam(summary,teamId){
    const id = String(teamId ?? "");

    const candidates = [
      ...(summary?.boxscore?.teams || []),
      ...(summary?.header?.competitions?.[0]?.competitors || [])
    ];

    const team = candidates.find(entry=>
      String(
        entry?.team?.id ??
        entry?.id ??
        ""
      ) === id
    );

    const stats =
      team?.statistics ||
      team?.stats ||
      [];

    return Array.isArray(stats) ? stats : [];
  }

  function findSummaryStat(stats,aliases){
    const wanted = aliases.map(normalizeStatKey);

    // Exact key match first.
    for(const stat of stats){
      const keys = [
        stat?.name,
        stat?.abbreviation,
        stat?.displayName,
        stat?.shortDisplayName,
        stat?.label,
        stat?.description
      ].map(normalizeStatKey).filter(Boolean);

      if(keys.some(key=>wanted.includes(key))) return stat;
    }

    // ESPN occasionally varies labels slightly between competitions.
    for(const stat of stats){
      const keys = [
        stat?.name,
        stat?.abbreviation,
        stat?.displayName,
        stat?.shortDisplayName,
        stat?.label,
        stat?.description
      ].map(normalizeStatKey).filter(Boolean);

      if(keys.some(key=>
        wanted.some(alias=>
          alias.length >= 5 &&
          (key.includes(alias) || alias.includes(key))
        )
      )){
        return stat;
      }
    }

    return null;
  }

  function formatMatchStat(value,isPercent=false,decimals=1){
    if(!Number.isFinite(value)) return "—";

    const factor = 10 ** decimals;
    const rounded = Math.round(value * factor) / factor;

    let display;
    if(decimals <= 0){
      display = String(Math.round(rounded));
    }else{
      display = rounded
        .toFixed(decimals)
        .replace(".",",")
        .replace(/,0+$/,"")
        .replace(/(,\d*?)0+$/,"$1");
    }

    return isPercent ? `${display}%` : display;
  }

  function statsFromSummary(summary,homeId,awayId){
    const homeStats = summaryStatsForTeam(summary,homeId);
    const awayStats = summaryStatsForTeam(summary,awayId);

    const definitions = [
      {
        key:"possession",
        label:"Possesso",
        aliases:["possessionPct","possessionPercentage","possession"],
        percent:true
      },
      {
        key:"expectedGoals",
        label:"xG",
        aliases:[
          "expectedGoals",
          "expectedGoalsFor",
          "expectedGoalsTotal",
          "xG",
          "xg"
        ],
        decimals:2
      },
      {
        key:"shots",
        label:"Tiri",
        aliases:["totalShots","shots","shotsTotal"]
      },
      {
        key:"shotsOnTarget",
        label:"Tiri in porta",
        aliases:["shotsOnTarget","shotsOnGoal"]
      },
      {
        key:"corners",
        label:"Calci d’angolo",
        aliases:["wonCorners","cornerKicks","corners"]
      },
      {
        key:"fouls",
        label:"Falli",
        aliases:["foulsCommitted","fouls"]
      },
      {
        key:"offsides",
        label:"Fuorigioco",
        aliases:["offsides","offside"]
      },
      {
        key:"saves",
        label:"Parate",
        aliases:["saves","goalkeeperSaves"]
      },
      {
        key:"yellowCards",
        label:"Cartellini gialli",
        aliases:["yellowCards","yellow"]
      },
      {
        key:"redCards",
        label:"Cartellini rossi",
        aliases:["redCards","red"]
      }
    ];

    const rows = [];

    for(const def of definitions){
      const homeStat = findSummaryStat(homeStats,def.aliases);
      const awayStat = findSummaryStat(awayStats,def.aliases);

      if(!homeStat && !awayStat) continue;

      const homeValue = numericStatValue(homeStat);
      const awayValue = numericStatValue(awayStat);

      if(homeValue === null && awayValue === null) continue;

      const h = homeValue ?? 0;
      const a = awayValue ?? 0;

      rows.push({
        key:def.key,
        label:def.label,
        homeValue:h,
        awayValue:a,
        homeDisplay:formatMatchStat(
          h,
          !!def.percent,
          Number.isFinite(def.decimals) ? def.decimals : 1
        ),
        awayDisplay:formatMatchStat(
          a,
          !!def.percent,
          Number.isFinite(def.decimals) ? def.decimals : 1
        )
      });
    }

    return rows;
  }

  async function summaryFor(ev){
    if(summaryCache.has(ev.id)) return summaryCache.get(ev.id);
    const promise = getJson(`${SITE}/summary?event=${encodeURIComponent(ev.id)}`);
    summaryCache.set(ev.id,promise);
    try{
      return await promise;
    }catch(e){
      summaryCache.delete(ev.id);
      throw e;
    }
  }

  async function detailsFor(ev, homeId, awayId){
    if(matchDetailsCache.has(ev.id)) return matchDetailsCache.get(ev.id);

    try{
      const sm = await summaryFor(ev);
      const lineups = lineupsFromSummary(sm,homeId,awayId);
      const statistics = statsFromSummary(sm,homeId,awayId);

      // Coach data must be match-specific.
      // If ESPN does not provide it in the match summary, we leave it blank
      // instead of using the team's current coach for an older fixture.
      const status = stateOf(ev);

      if(status === "pre"){
        const value = {events:[],lineups,statistics};
        matchDetailsCache.set(ev.id,value);
        return value;
      }

      const baseEvents = extractMatchEvents(sm,homeId);

      // Per cartellini, rigori sbagliati e sostituzioni integriamo anche il play-by-play ESPN.
      const [deepSpecials, playSpecials] = await Promise.all([
        Promise.resolve(specialEventsFromSummaryDeep(sm,ev,homeId)),
        specialPlaysFor(ev,homeId)
      ]);

      const combined = [...baseEvents];
      const specialIndex = new Map();

      combined.forEach((item,index)=>{
        if(item.kind !== "goal"){
          specialIndex.set(specialEventKey(item),index);
        }
      });

      for(const item of [...deepSpecials,...playSpecials]){
        const key = specialEventKey(item);
        const existingIndex = specialIndex.get(key);

        if(existingIndex === undefined){
          specialIndex.set(key,combined.length);
          combined.push(item);
          continue;
        }

        combined[existingIndex] = mergeDuplicateSpecial(
          combined[existingIndex],
          item
        );
      }

      const advancedEvents = normalizeAdvancedTimeline(combined);
      const value = {events:advancedEvents,lineups,statistics};
      matchDetailsCache.set(ev.id,value);
      return value;
    }catch{
      return {
        events:[],
        statistics:[],
        lineups:{
          home:{starters:[],bench:[],formation:""},
          away:{starters:[],bench:[],formation:""}
        }
      };
    }
  }

  async function matchModel(ev){
    const comp = ev?.competitions?.[0];
    const cs = comp?.competitors || [];
    const home = cs.find(x=>x.homeAway==="home") || cs[0];
    const away = cs.find(x=>x.homeAway==="away") || cs[1];
    const status = stateOf(ev);

    let matchEvents = [];
    let statistics = [];
    let lineups = {
      home:{starters:[],bench:[],formation:""},
      away:{starters:[],bench:[],formation:""}
    };

    if(home && away){
      const id = String(ev.id);
      // Match cards stay lightweight. Detailed ESPN data is loaded only
      // after the user explicitly opens the Match Page (or if already cached).
      const shouldLoadDetails =
        matchDetailsCache.has(ev.id);

      if(shouldLoadDetails){
        const details = await detailsFor(ev,home.id,away.id);
        matchEvents = details.events || [];
        statistics = details.statistics || [];
        lineups = details.lineups || lineups;
      }
    }

    const score = c => {
      const n = Number.parseInt(c?.score,10);
      return Number.isFinite(n) ? n : 0;
    };

    let statusText = "Da giocare";
    if(status === "done") statusText = "Finale";
    if(status === "live"){
      const t = ev?.status?.type || {};
      const typeName = String(t?.name || "");
      const description = String(t?.description || "");
      const isHalftime =
        typeName === "STATUS_HALFTIME" ||
        /^half[\s-]?time$/i.test(description) ||
        /^halftime$/i.test(description);

      statusText = isHalftime
        ? "Intervallo"
        : (ev?.status?.displayClock || t?.shortDetail || t?.detail || "LIVE");
    }

    return {
      id:ev.id,
      date:ev.date,
      status,
      statusText,
      home:{
        id:home?.id,
        name:teamName(home),
        logo:teamLogo(home),
        score:score(home),
        color:teamPrimaryColor(home)
      },
      away:{
        id:away?.id,
        name:teamName(away),
        logo:teamLogo(away),
        score:score(away),
        color:teamPrimaryColor(away)
      },
      matchEvents,
      statistics,
      lineups
    };
  }

  function eventMinuteValue(minute){
    const clean = String(minute || "");
    const match = clean.match(/(\d+)(?:\D*\+(\d+))?/);
    if(!match) return Number.MAX_SAFE_INTEGER;

    const base = Number(match[1]) || 0;
    const extra = Number(match[2]) || 0;
    return base * 100 + extra;
  }

  function halftimeScoreFromEvents(events){
    let home = 0;
    let away = 0;

    for(const e of events){
      if(
        e.kind !== "goal" ||
        eventBaseMinute(e.minute) > 45
      ){
        continue;
      }

      if(e.side === "home") home += 1;
      if(e.side === "away") away += 1;
    }

    return {home,away};
  }

  function eventsDescending(events){
    return [...events].sort((a,b)=>
      eventMinuteValue(b.minute) - eventMinuteValue(a.minute)
    );
  }

  function eventsPanelHtml(m,timeline){
    if(m.status === "pre"){
      return `<div class="detail-message">Partita non iniziata.</div>`;
    }

    if(!timeline.length){
      return `<div class="detail-message">Nessun evento disponibile.</div>`;
    }

    const displayEvents = timelineDisplayEvents(timeline);

    const firstHalf = eventsDescending(
      displayEvents.filter(
        e=>eventBaseMinute(e.minute) <= 45
      )
    );

    const secondHalf = eventsDescending(
      displayEvents.filter(
        e=>eventBaseMinute(e.minute) >= 46
      )
    );

    const halftime = halftimeScoreFromEvents(displayEvents);

    const hasReachedHalftime =
      secondHalf.length > 0 ||
      m.status === "done" ||
      String(m.statusText || "").toLowerCase() === "intervallo";

    const secondHtml = secondHalf.length
      ? timelineRowsHtml(secondHalf)
      : "";

    const intervalHtml = hasReachedHalftime
      ? `<div class="timeline-period interval">
          <span>
            INTERVALLO
            <strong class="timeline-period-score">
              ${esc(halftime.home)}–${esc(halftime.away)}
            </strong>
          </span>
        </div>`
      : "";

    const firstHtml = firstHalf.length
      ? timelineRowsHtml(firstHalf)
      : "";

    // LIVE-first reading: newest events at the top.
    return `<div class="events">
      ${secondHtml}
      ${intervalHtml}
      ${firstHtml}
    </div>`;
  }

  function formationNumbers(value){
    const clean = normalizeFormation(value);
    if(!clean) return [];

    const nums = clean
      .split("-")
      .map(Number)
      .filter(n=>Number.isFinite(n) && n>0);

    return nums.reduce((sum,n)=>sum+n,0) === 10 ? nums : [];

  function normalizedPositionText(player){
    return String(player?.position || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[._/,-]+/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function hasPositionToken(text,tokens){
    const padded = ` ${text} `;
    return tokens.some(token=>{
      const t = String(token).toLowerCase();
      return padded.includes(` ${t} `);
    });
  }

  function playerPositionProfile(player){
    const text = normalizedPositionText(player);

    // Neutral fallback: formation + roster order can still place the player,
    // but a real ESPN position always wins by a wide margin.
    const profile = {
      def:12,
      mid:12,
      att:12,
      vertical:.5,
      side:0,
      known:false
    };

    if(!text) return profile;

    // Goalkeeper
    if(
      hasPositionToken(text,["g","gk","goalkeeper","keeper","portiere"]) ||
      text.includes("goalkeeper") ||
      text.includes("portiere")
    ){
      return {
        def:0,mid:0,att:0,vertical:0,side:0,known:true,gk:true
      };
    }

    // Horizontal side preference.
    // -1 = left, 0 = centre, +1 = right.
    if(
      /\b(lb|lwb|lm|lw)\b/.test(text) ||
      text.includes("left back") ||
      text.includes("left wing") ||
      text.includes("sinistro")
    ){
      profile.side = -1;
    }else if(
      /\b(rb|rwb|rm|rw)\b/.test(text) ||
      text.includes("right back") ||
      text.includes("right wing") ||
      text.includes("destro")
    ){
      profile.side = 1;
    }

    // Central defenders: strongest defensive signal.
    if(
      /\b(cb|cd|dc)\b/.test(text) ||
      text.includes("centre back") ||
      text.includes("center back") ||
      text.includes("central defender") ||
      text.includes("difensore centrale")
    ){
      Object.assign(profile,{
        def:120,mid:4,att:0,vertical:.05,known:true
      });
      return profile;
    }

    // Full-backs: defenders first, but can spill into midfield in systems
    // with wing-backs if the formation requires it.
    if(
      /\b(lb|rb|fb)\b/.test(text) ||
      text.includes("full back") ||
      text.includes("terzino")
    ){
      Object.assign(profile,{
        def:108,mid:34,att:2,vertical:.16,known:true
      });
      return profile;
    }

    // Wing-backs are deliberately more flexible between DEF and MID.
    if(
      /\b(lwb|rwb|wb)\b/.test(text) ||
      text.includes("wing back")
    ){
      Object.assign(profile,{
        def:74,mid:92,att:10,vertical:.30,known:true
      });
      return profile;
    }

    // Defensive midfielders.
    if(
      /\b(cdm|dm|md)\b/.test(text) ||
      text.includes("defensive midfield") ||
      text.includes("holding midfield") ||
      text.includes("mediano")
    ){
      Object.assign(profile,{
        def:28,mid:116,att:8,vertical:.26,known:true
      });
      return profile;
    }

    // Attacking midfield / trequartista.
    if(
      /\b(cam|am)\b/.test(text) ||
      text.includes("attacking midfield") ||
      text.includes("trequartista")
    ){
      Object.assign(profile,{
        def:2,mid:108,att:50,vertical:.78,known:true
      });
      return profile;
    }

    // Wide midfielders.
    if(
      /\b(lm|rm)\b/.test(text) ||
      text.includes("left midfield") ||
      text.includes("right midfield")
    ){
      Object.assign(profile,{
        def:8,mid:112,att:36,vertical:.58,known:true
      });
      return profile;
    }

    // Central midfielders.
    if(
      /\b(cm|mc)\b/.test(text) ||
      text.includes("central midfield") ||
      text.includes("centrocampista centrale")
    ){
      Object.assign(profile,{
        def:10,mid:120,att:20,vertical:.48,known:true
      });
      return profile;
    }

    // Wingers: usually the most advanced line in a 4-3-3, but can be
    // attacking midfielders in shapes such as 4-2-3-1.
    if(
      /\b(lw|rw|winger|w)\b/.test(text) ||
      text.includes("left wing") ||
      text.includes("right wing") ||
      text.includes("ala")
    ){
      Object.assign(profile,{
        def:1,mid:58,att:106,vertical:.84,known:true
      });
      return profile;
    }

    // Strikers / centre-forwards.
    if(
      /\b(st|cf|ss)\b/.test(text) ||
      text.includes("striker") ||
      text.includes("centre forward") ||
      text.includes("center forward") ||
      text.includes("second striker") ||
      text.includes("forward centre") ||
      text.includes("punta") ||
      text.includes("attaccante centrale")
    ){
      Object.assign(profile,{
        def:0,mid:8,att:122,vertical:.98,known:true
      });
      return profile;
    }

    // Generic ESPN broad roles.
    if(
      hasPositionToken(text,["d","df","def"]) ||
      text.includes("defender") ||
      text.includes("difensore")
    ){
      Object.assign(profile,{
        def:104,mid:18,att:1,vertical:.12,known:true
      });
      return profile;
    }

    if(
      hasPositionToken(text,["m","mf","mid"]) ||
      text.includes("midfielder") ||
      text.includes("centrocampista")
    ){
      Object.assign(profile,{
        def:12,mid:106,att:18,vertical:.5,known:true
      });
      return profile;
    }

    if(
      hasPositionToken(text,["f","fw","att"]) ||
      text.includes("forward") ||
      text.includes("attaccante")
    ){
      Object.assign(profile,{
        def:0,mid:16,att:110,vertical:.9,known:true
      });
      return profile;
    }

    return profile;
  }

  function isGoalkeeper(player){
    return !!playerPositionProfile(player).gk;
  }

  function playerSortOrder(player,index){
    return Number.isFinite(player?.tacticalOrder)
      ? player.tacticalOrder
      : 1000 + index;
  }

  function orderedStartersForPitch(starters){
    const list = [...(starters || [])];
    if(!list.length) return [];

    const indexed = list.map((player,index)=>({player,index}));

    // Tactical order is now only a secondary ordering signal.
    // We no longer let it decide the player's tactical line by itself.
    indexed.sort((a,b)=>
      playerSortOrder(a.player,a.index) - playerSortOrder(b.player,b.index)
    );

    return indexed.map(x=>x.player);
  }

  function pitchGroupScore(player,group,orderHint){
    const p = playerPositionProfile(player);
    let score =
      group === "def" ? p.def :
      group === "mid" ? p.mid :
      p.att;

    // Weak formation-order hint only when ESPN exposes a usable order.
    // Position remains the dominant signal.
    if(Number.isFinite(orderHint)){
      if(group === "def" && orderHint < .34) score += 8;
      if(group === "mid" && orderHint >= .22 && orderHint <= .78) score += 8;
      if(group === "att" && orderHint > .66) score += 8;
    }

    return score;
  }

  function assignPitchGroups(players,defCount,midCount,attCount){
    const n = players.length;
    if(n !== defCount + midCount + attCount) return null;

    const withOrder = players.filter(p=>Number.isFinite(p?.tacticalOrder));
    const orderedValues = withOrder
      .map(p=>p.tacticalOrder)
      .sort((a,b)=>a-b);

    const orderHintFor = player=>{
      if(!Number.isFinite(player?.tacticalOrder) || orderedValues.length < 7){
        return null;
      }
      const rank = orderedValues.indexOf(player.tacticalOrder);
      return orderedValues.length <= 1 ? .5 : rank/(orderedValues.length-1);
    };

    const memo = new Map();

    function solve(i,d,m,a){
      if(i === n){
        return (d===defCount && m===midCount && a===attCount)
          ? {score:0,groups:[]}
          : null;
      }

      const key = `${i}|${d}|${m}|${a}`;
      if(memo.has(key)) return memo.get(key);

      const player = players[i];
      const hint = orderHintFor(player);
      let best = null;

      const options = [
        ["def",d < defCount,d+1,m,a],
        ["mid",m < midCount,d,m+1,a],
        ["att",a < attCount,d,m,a+1]
      ];

      for(const [group,allowed,nd,nm,na] of options){
        if(!allowed) continue;

        const tail = solve(i+1,nd,nm,na);
        if(!tail) continue;

        const total = pitchGroupScore(player,group,hint) + tail.score;
        if(!best || total > best.score){
          best = {
            score:total,
            groups:[group,...tail.groups]
          };
        }
      }

      memo.set(key,best);
      return best;
    }

    const solved = solve(0,0,0,0);
    if(!solved) return null;

    const groups = {def:[],mid:[],att:[]};
    players.forEach((player,index)=>{
      groups[solved.groups[index]].push(player);
    });

    return groups;
  }

  function horizontalPlayerSort(players){
    return [...players]
      .map((player,index)=>({
        player,
        index,
        profile:playerPositionProfile(player)
      }))
      .sort((a,b)=>{
        if(a.profile.side !== b.profile.side){
          return a.profile.side - b.profile.side;
        }
        return playerSortOrder(a.player,a.index) - playerSortOrder(b.player,b.index);
      })
      .map(x=>x.player);
  }

  function splitMidfieldLines(players,lineCounts){
    const sorted = [...players]
      .map((player,index)=>({
        player,
        index,
        profile:playerPositionProfile(player)
      }))
      .sort((a,b)=>{
        if(a.profile.vertical !== b.profile.vertical){
          return a.profile.vertical - b.profile.vertical;
        }
        return playerSortOrder(a.player,a.index) - playerSortOrder(b.player,b.index);
      })
      .map(x=>x.player);

    const lines = [];
    let cursor = 0;

    for(const count of lineCounts){
      const line = sorted.slice(cursor,cursor+count);
      lines.push(horizontalPlayerSort(line));
      cursor += count;
    }

    return cursor === players.length ? lines : null;
  }

  function pitchDataForSide(side){
    const formation = formationNumbers(side?.formation);
    const starters = orderedStartersForPitch(side?.starters);

    if(formation.length < 3 || starters.length < 11){
      return null;
    }

    // Use an ESPN goalkeeper whenever possible, not simply roster item #1.
    let keeperIndex = starters.findIndex(isGoalkeeper);
    if(keeperIndex < 0) keeperIndex = 0;

    const keeper = starters[keeperIndex];
    const fieldPlayers = starters
      .filter((_,index)=>index !== keeperIndex)
      .slice(0,10);

    if(fieldPlayers.length !== 10) return null;

    const defCount = formation[0];
    const attCount = formation[formation.length-1];
    const middleLineCounts = formation.slice(1,-1);
    const midCount = middleLineCounts.reduce((sum,n)=>sum+n,0);

    if(defCount + midCount + attCount !== 10) return null;

    return {
      keeper,
      fieldPlayers,
      formation,
      defCount,
      midCount,
      attCount,
      middleLineCounts
    };
  }

  function buildPitchSide(side){
    const data = pitchDataForSide(side);
    if(!data) return null;

    const groups = assignPitchGroups(
      data.fieldPlayers,
      data.defCount,
      data.midCount,
      data.attCount
    );

    if(!groups) return null;

    const midfieldLines = splitMidfieldLines(
      groups.mid,
      data.middleLineCounts
    );

    if(!midfieldLines) return null;

    const lines = [
      horizontalPlayerSort(groups.def),
      ...midfieldLines,
      horizontalPlayerSort(groups.att)
    ];

    if(lines.reduce((sum,line)=>sum+line.length,0) !== 10){
      return null;
    }

    return {
      keeper:data.keeper,
      lines,
      formation:data.formation,
      starters:[data.keeper,...lines.flat()]
    };
  }

  function evenlySpacedX(count,index){
    if(count <= 1) return 50;
    const edge = count >= 5 ? 10 : count === 4 ? 13 : 18;
    const usable = 100 - edge*2;
    return edge + (usable * index / (count-1));
  }

  function pitchYPositions(lineCount,home){
    const keeper = home ? 7.5 : 92.5;
    const nearHalf = home ? 43 : 57;
    const firstLine = home ? 18 : 82;

    if(lineCount <= 1){
      return {keeper,lines:[nearHalf]};
    }

    const lines = [];
    for(let i=0;i<lineCount;i++){
      const t = i/(lineCount-1);
      lines.push(firstLine + (nearHalf-firstLine)*t);
    }

    return {keeper,lines};
  }

  function pitchPlayerHtml(player,x,y,colorSpec){
    if(!player) return "";

    return `<div
      class="pitch-player"
      style="
        left:${x.toFixed(2)}%;
        top:${y.toFixed(2)}%;
        --team-color:${esc(colorSpec.color)};
        --team-text:${esc(colorSpec.text)};
        --team-border:${esc(colorSpec.border)};
      "
    >
      <span class="pitch-player-dot">${esc(player.jersey || "•")}</span>
      <span class="pitch-player-name">${esc(shortPlayerName(player.name))}</span>
    </div>`;
  }

  function pitchSidePlayersHtml(side,home,color){
    const data = buildPitchSide(side);
    if(!data) return "";

    const colorSpec = colorPresentation(color);
    const pos = pitchYPositions(data.lines.length,home);
    const chunks = [];

    chunks.push(
      pitchPlayerHtml(data.keeper,50,pos.keeper,colorSpec)
    );

    data.lines.forEach((line,lineIndex)=>{
      line.forEach((player,playerIndex)=>{
        chunks.push(
          pitchPlayerHtml(
            player,
            evenlySpacedX(line.length,playerIndex),
            pos.lines[lineIndex],
            colorSpec
          )
        );
      });
    });

    return chunks.join("");
  }

  function startersPitchHtml(m){
    const homePitch = buildPitchSide(m?.lineups?.home);
    const awayPitch = buildPitchSide(m?.lineups?.away);

    if(!homePitch || !awayPitch) return "";

    return `<div
      class="soccer-pitch"
      role="img"
      aria-label="Schieramento titolare sul campo"
    >
      ${pitchMarkingsSvg()}
      ${pitchSidePlayersHtml(m.lineups.home,true,m.home.color)}
      ${pitchSidePlayersHtml(m.lineups.away,false,m.away.color)}
    </div>`;
  }


  function statisticPercentages(homeValue,awayValue){
    const h = Math.max(0,Number(homeValue) || 0);
    const a = Math.max(0,Number(awayValue) || 0);
    const total = h + a;

    if(total <= 0) return [0,0];

    return [
      (h / total) * 100,
      (a / total) * 100
    ];
  }

  function statisticsPanelHtml(m){
    const rows = Array.isArray(m?.statistics)
      ? m.statistics
      : [];

    if(!rows.length){
      return `<div class="detail-message">Statistiche non ancora disponibili.</div>`;
    }

    return `<div class="match-stats">
      ${rows.map(row=>{
        const [homePct,awayPct] = statisticPercentages(
          row.homeValue,
          row.awayValue
        );

        return `<div class="match-stat-row">
          <div class="match-stat-head">
            <span class="match-stat-value home">${esc(row.homeDisplay)}</span>
            <span class="match-stat-label">${esc(row.label)}</span>
            <span class="match-stat-value away">${esc(row.awayDisplay)}</span>
          </div>

          <div class="match-stat-bars" aria-hidden="true">
            <div class="match-stat-half home">
              <span
                class="match-stat-fill"
                style="--stat-width:${homePct.toFixed(2)}%;--stat-color:${esc(m.home.color)}"
              ></span>
            </div>
            <div class="match-stat-half away">
              <span
                class="match-stat-fill"
                style="--stat-width:${awayPct.toFixed(2)}%;--stat-color:${esc(m.away.color)}"
              ></span>
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function formationsPanelHtml(m){
    const lineups = m?.lineups || {};
    const home = lineups?.home || {};
    const away = lineups?.away || {};

    if(!hasLineupData(lineups)){
      return `<div class="detail-message">Formazioni non ancora disponibili.</div>`;
    }

    const formationRow = (home.formation || away.formation)
      ? `<div class="formation-row">
          <div class="formation-value">${esc(home.formation || "")}</div>
          <div class="formation-value">${esc(away.formation || "")}</div>
        </div>`
      : "";

    const pitch = startersPitchHtml(m);

    const starters = (home.starters?.length || away.starters?.length)
      ? `<div class="lineup-heading">Titolari</div>
         ${pitch || `
           <div class="lineup-grid">
             ${lineupRowsHtml(home.starters || [],away.starters || [])}
           </div>
         `}`
      : "";

    const bench = (home.bench?.length || away.bench?.length)
      ? `<div class="lineup-heading">Panchina</div>
         <div class="lineup-grid">
           ${lineupRowsHtml(home.bench || [],away.bench || [])}
         </div>`
      : "";

    return `<div class="lineups">
      ${formationRow}
      ${starters}
      ${bench}
    </div>`;
  }

  function findMatchEventById(id){
    const wanted = String(id || "");

    for(const ev of allEvents){
      if(String(ev?.id || "") === wanted) return ev;
    }

    for(const evs of Object.values(rounds)){
      const found = (evs || []).find(
        ev=>String(ev?.id || "") === wanted
      );
      if(found) return found;
    }

    return null;
  }

  function matchPageSummaryHtml(m){
    const statusClass =
      m.status === "live"
        ? "live"
        : m.status === "done"
          ? "done"
          : "";

    const scoreCenter = m.status === "pre"
      ? `<div class="match-page-ko">${esc(timeLabel(m.date))}</div>`
      : `<div class="match-page-score">${esc(m.home.score)}–${esc(m.away.score)}</div>`;

    return `<div class="match-page-summary">
      <div class="match-page-team">
        ${m.home.logo
          ? `<img src="${esc(m.home.logo)}" alt="" loading="eager">`
          : ""
        }
        <div class="match-page-team-name">${esc(m.home.name)}</div>
      </div>

      <div class="match-page-scorebox">
        ${scoreCenter}
        <span class="match-page-status ${statusClass}">
          ${esc(m.statusText)}
        </span>
      </div>

      <div class="match-page-team">
        ${m.away.logo
          ? `<img src="${esc(m.away.logo)}" alt="" loading="eager">`
          : ""
        }
        <div class="match-page-team-name">${esc(m.away.name)}</div>
      </div>
    </div>`;
  }

  function renderMatchPageModel(m,{loading=false}={}){
    if(!m || !matchPageContent) return;

    const id = String(m.id);
    const defaultTab = m.status === "pre" ? "formations" : "events";
    const activeDetailTab = matchDetailTabs.get(id) || defaultTab;

    const timeline = (m.matchEvents || [])
      .map((e,index)=>({...e,_sourceOrder:index}))
      .sort((a,b)=>
        eventMinuteValue(a.minute) - eventMinuteValue(b.minute) ||
        a._sourceOrder - b._sourceOrder
      );

    const details = loading
      ? `<div class="match-page-loading">
          <div><div class="spinner"></div>Carico i dettagli…</div>
        </div>`
      : detailTabsHtml(m,timeline,activeDetailTab);

    matchPageContent.innerHTML = `
      ${matchPageSummaryHtml(m)}
      ${details}
    `;

    if(!loading){
      matchPageContent.querySelectorAll("[data-detail-tab]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const tab = String(btn.dataset.detailTab || "");
          if(!["events","statistics","formations"].includes(tab)) return;

          matchDetailTabs.set(id,tab);
          renderMatchPageModel(m);
        });
      });
    }
  }

  async function fullMatchModel(ev){
    const comp = ev?.competitions?.[0];
    const competitors = comp?.competitors || [];
    const home =
      competitors.find(x=>x.homeAway === "home") ||
      competitors[0];

    const away =
      competitors.find(x=>x.homeAway === "away") ||
      competitors[1];

    if(home && away){
      await detailsFor(ev,home.id,away.id);
    }

    return matchModel(ev);
  }

  function lockMatchPageScroll(){
    matchPageScrollY = window.scrollY || window.pageYOffset || 0;

    document.body.classList.add("match-page-open");
    document.body.style.top = `-${matchPageScrollY}px`;
    document.body.style.position = "fixed";
    document.body.style.width = "100%";
    document.body.style.left = "0";
    document.body.style.right = "0";
  }

  function unlockMatchPageScroll(){
    const y = matchPageScrollY || 0;

    document.body.classList.remove("match-page-open");
    document.body.style.top = "";
    document.body.style.position = "";
    document.body.style.width = "";
    document.body.style.left = "";
    document.body.style.right = "";

    window.scrollTo(0,y);
  }

  function closeMatchPage(){
    matchPageRequestToken++;
    matchPageOpenId = "";
    matchPageModel = null;

    if(matchPage){
      matchPage.hidden = true;
    }

    unlockMatchPageScroll();
  }

  async function openMatchPage(id){
    const ev = findMatchEventById(id);
    if(!ev) return;

    const token = ++matchPageRequestToken;
    matchPageOpenId = String(id);

    const basicModel = await matchModel(ev);
    if(token !== matchPageRequestToken) return;

    matchPageModel = basicModel;
    renderMatchPageModel(basicModel,{loading:true});

    lockMatchPageScroll();
    matchPage.hidden = false;
    matchPageScroll.scrollTop = 0;

    try{
      const model = await fullMatchModel(ev);
      if(
        token !== matchPageRequestToken ||
        matchPageOpenId !== String(id)
      ){
        return;
      }

      matchPageModel = model;
      renderMatchPageModel(model);
      matchPageScroll.scrollTop = 0;
    }catch(_){
      if(token !== matchPageRequestToken) return;

      matchPageContent.innerHTML = `
        ${matchPageSummaryHtml(basicModel)}
        <div class="detail-message">
          Dettagli partita non disponibili in questo momento.
        </div>
      `;
    }
  }

  async function refreshOpenMatchPage(){
    if(!matchPageOpenId || matchPage?.hidden) return;

    const id = String(matchPageOpenId);
    const ev = findMatchEventById(id);
    if(!ev) return;

    const selectedTab =
      matchDetailTabs.get(id) ||
      (matchPageModel?.status === "pre" ? "formations" : "events");

    const scrollTop = matchPageScroll?.scrollTop || 0;

    matchDetailsCache.delete(ev.id);
    summaryCache.delete(ev.id);
    cardPlaysCache.delete(String(ev.id));

    try{
      const model = await fullMatchModel(ev);

      if(matchPageOpenId !== id || matchPage?.hidden) return;

      matchPageModel = model;
      matchDetailTabs.set(id,selectedTab);
      renderMatchPageModel(model);
      matchPageScroll.scrollTop = scrollTop;
    }catch(_){}
  }

  function setupMatchPage(){
    matchPageClose?.addEventListener("click",closeMatchPage);

    document.addEventListener("keydown",event=>{
      if(
        event.key === "Escape" &&
        matchPage &&
        !matchPage.hidden
      ){
        closeMatchPage();
      }
    });
  }

  function detailTabsHtml(m,timeline,activeDetailTab){
    const eventsActive = activeDetailTab === "events";
    const statisticsActive = activeDetailTab === "statistics";
    const formationsActive = activeDetailTab === "formations";

    let panel = eventsPanelHtml(m,timeline);

    if(statisticsActive){
      panel = statisticsPanelHtml(m);
    }else if(formationsActive){
      panel = formationsPanelHtml(m);
    }

    return `<div class="match-details">
      <div class="detail-tabs" role="tablist" aria-label="Dettagli partita">
        <button
          class="detail-tab ${eventsActive ? "active" : ""}"
          type="button"
          role="tab"
          aria-selected="${eventsActive ? "true" : "false"}"
          data-detail-tab="events"
